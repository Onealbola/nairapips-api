<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NairaPips · Trader catalogue controls</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#091015;color:#edf3f5;font:15px/1.6 system-ui}main{max-width:1200px;margin:auto;padding:28px 18px}h1{color:#f3cf72;font-size:32px}.card{border:1px solid #34444f;background:#111d25;padding:20px;border-radius:14px;margin:20px 0}.actions{display:flex;gap:10px;flex-wrap:wrap}button,a{font:inherit;padding:10px 14px;background:#f3cf72;color:#17242b;border:0;border-radius:8px;text-decoration:none;cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}input{width:20px;height:20px;accent-color:#f3cf72}.scroll{overflow:auto}table{width:100%;border-collapse:collapse;min-width:700px}td,th{text-align:left;padding:12px;border-bottom:1px solid #34444f}.small{font-size:12px;color:#b9c6ce}.status{color:#f3cf72;min-height:28px}.locked{color:#ffb0a4}.on{color:#88d9ad}body{background:#0a0e10}main{max-width:1440px;padding:26px}h1{font-size:32px;letter-spacing:-.5px;margin-bottom:8px}.card{background:#111b22;border-color:#303c44;border-radius:14px}.actions{gap:8px}.actions button,.actions a{font-size:12px;border:1px solid #46545d;background:#18262f;color:#edf3f5}.actions #save{background:#f3cf72;color:#17242b;border-color:#f3cf72;font-weight:800}input[type=checkbox]{appearance:none;-webkit-appearance:none;position:relative;width:42px;height:24px;border:1px solid #58616a;background:#252e35;border-radius:20px;cursor:pointer;vertical-align:middle;transition:background .16s}input[type=checkbox]:before{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#d5d9db;transition:transform .16s}input[type=checkbox]:checked{background:#f3cf72;border-color:#f3cf72}input[type=checkbox]:checked:before{transform:translateX(18px);background:#17242b}input[type=checkbox]:disabled{opacity:.35;cursor:not-allowed}input:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid #f3cf72;outline-offset:3px}th{font-size:11px;letter-spacing:.4px;color:#aebbc3;text-transform:uppercase}td{font-size:13px;padding:15px 12px}.status{font-size:12px}.small{line-height:1.5}</style></head><body><main><div class="small" style="color:#f3cf72;font-weight:800;letter-spacing:2px">NAIRAPIPS / BUSINESS SETTINGS</div><h1>Purchase switches</h1><p>Control new purchases for each product.</p><div class="card"><div class="actions"><button id="save" disabled>Save purchase switches</button><button id="reload">Reload current settings</button><a href="/package-studio">Account settings</a><a href="/control-panel">Standard & Premium</a><button id="logout">Sign out</button></div><p id="status" class="status" role="status">Loading…</p><p id="global" class="small"></p><p class="small">Visibility is managed in account settings. Purchase switches apply to new orders.</p></div><div class="card"><div class="scroll"><table><thead><tr><th>Product</th><th>Category</th><th>Shown to traders</th><th>New purchases</th><th>Current state</th></tr></thead><tbody id="products"></tbody></table></div></div></main><script>
'use strict';const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let doc=null,rows=[],busy=false;
async function api(method,body){const r=await fetch('/admin/catalog_publication',{method,cache:'no-store',signal:AbortSignal.timeout(25000),headers:{'Content-Type':'application/json',Authorization:'Bearer '+(window.__npStudioToken||'')},body:body===undefined?undefined:JSON.stringify(body)});const d=await r.json();if(!r.ok||!d.success)throw Error(d.error||'Purchase switches could not be confirmed.');return d}
function lock(v){busy=v;$('save').disabled=v||!doc;$('reload').disabled=v;document.querySelectorAll('[data-product]').forEach(e=>e.disabled=v||!rows.find(r=>r.id===e.dataset.product)?.checkout_supported)}
function render(result){doc=result.data;rows=result.products;$('global').textContent=result.global_sales_open?'The global challenge-sales service is ON.':'The global challenge-sales service is OFF. Turn it on in Business Settings → Service availability before any new challenge can be purchased.';$('products').innerHTML=rows.map(p=>'<tr><td><strong>'+esc(p.name)+'</strong></td><td>'+esc(({progress:'2-Phase',standard:'Standard',premium:'Premium',custom:'Custom builder'})[p.family]||p.family)+'</td><td>'+(p.visible?'Visible':'Hidden')+'</td><td><input aria-label="Open purchases for '+esc(p.name)+'" type="checkbox" data-product="'+esc(p.id)+'" '+(p.purchase_switch&&p.checkout_supported?'checked':'')+' '+(p.checkout_supported?'':'disabled')+'></td><td class="'+(p.purchases_open?'on':'locked')+'">'+(p.purchases_open?'Purchases open':!p.checkout_supported?'Locked: '+esc(p.release_reason):!p.visible?'Hidden: purchases closed':!result.global_sales_open?'Paused by global service switch':'Purchases closed')+'</td></tr>').join('')}
async function load(){lock(true);try{render(await api('GET'));$('status').textContent='Current prices and purchase switches loaded.'}catch(e){doc=null;$('status').textContent=e.message}finally{lock(false)}}
$('save').onclick=async()=>{if(!doc||busy)return;const products={};for(const p of rows){const box=[...document.querySelectorAll('[data-product]')].find(x=>x.dataset.product===p.id);products[p.id]={purchases_open:p.checkout_supported&&box.checked}}lock(true);try{render(await api('POST',{revision:doc.revision,products}));$('status').textContent='Saved and confirmed. New purchases follow these switches; existing purchases keep their terms.'}catch(e){$('status').textContent='Not saved: '+e.message+' Your selections remain here.'}finally{lock(false)}};$('reload').onclick=load;$('logout').onclick=()=>{window.__npStudioToken='';location.replace('/package-studio?catalog=1')};load();
</script></body></html>
