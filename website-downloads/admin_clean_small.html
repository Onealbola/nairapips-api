@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap');

/* =========================================================================
   NAIRAPIPS ADMIN — matches your reference (old admin style)
   Black + warm gold + pill action buttons + trader card grid + mono money
   ========================================================================= */
:root{
  --bg:#000000;
  --card:#0a0a0a;
  --card-2:#111111;
  --line:#1f1f1f;
  --line-2:#2a2a2a;
  --line-gold:rgba(212,175,55,.35);

  --gold:#f7c843;          /* warm yellow-gold (your reference) */
  --gold-2:#ffd968;
  --gold-deep:#c89a25;

  --green:#1f8a3a;          /* Pass Phase button */
  --green-2:#22c55e;
  --green-text:#4ade80;

  --red:#c2292c;            /* Breached button */
  --red-2:#ef4444;
  --red-text:#f87171;

  --yellow:#eab308;          /* Mark Funded */
  --yellow-2:#fbbf24;

  --blue:#38bdf8;
  --info-text:#7dd3fc;

  --t1:#ffffff;
  --t2:#e5e5e5;
  --t3:#a1a1aa;
  --t4:#71717a;
  --t5:#52525b;
}

*{box-sizing:border-box;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
html,body{margin:0;background:var(--bg);color:var(--t1);font-family:'Inter',-apple-system,system-ui,sans-serif;font-size:14px;line-height:1.5}

/* App shell */
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh;background:var(--bg)}
.app>aside{position:sticky;top:0;height:100vh;overflow-y:auto;background:#000;border-right:1px solid var(--line)}
.app>main{min-width:0}
@media(max-width:900px){.app{grid-template-columns:1fr}.app>aside{display:none}}

/* ---------- Sidebar (your reference = plain text + yellow active) ---------- */
.brand{padding:18px 18px 16px;border-bottom:1px solid var(--line)}
.brand-name{font-weight:900;font-size:17px;letter-spacing:.02em;color:#fff;text-transform:uppercase}
.brand-name span{color:var(--gold)}
.brand-sub{font-size:10px;color:var(--t4);letter-spacing:.18em;text-transform:uppercase;margin-top:3px;font-weight:600}

.nav-section{padding:14px 18px 4px;color:var(--t4);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.18em}
.nav{display:flex;align-items:center;gap:9px;width:auto;margin:0 8px;padding:7px 11px;color:var(--t2);font-weight:500;font-size:13px;background:transparent;border:0;text-align:left;cursor:pointer;font-family:inherit;line-height:1.2;border-radius:6px;transition:background .1s linear}
.nav .ico{width:14px;font-size:12px;flex-shrink:0;color:var(--t4)}
.nav:hover{background:#161616;color:var(--gold)}
.nav:hover .ico{color:var(--gold)}
.nav.active{background:rgba(247,200,67,.12);color:var(--gold);font-weight:600}
.nav.active .ico{color:var(--gold)}

/* ---------- Topbar (slim, gold-on-black) ---------- */
.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:14px;padding:0 22px;height:50px;background:#000;border-bottom:1px solid var(--line)}
.topbar h1{font-size:18px;font-weight:800;margin:0;color:#fff;letter-spacing:.005em;text-transform:uppercase}
.topbar h1 small{color:var(--gold);font-weight:700;margin-left:8px;font-size:12px;letter-spacing:.1em}
.tb-clock{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--t3);margin-left:auto;letter-spacing:.04em}
.tb-clock .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--green);margin-right:6px;box-shadow:0 0 8px var(--green)}

/* ---------- Content area ---------- */
.content{padding:22px}
@media(max-width:700px){.content{padding:14px}}

/* ---------- Cards (the reference look: dark inner box, thin gold border) ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.card.gold-border{border-color:var(--line-gold)}
.card.tilt:hover{border-color:var(--line-2)}

/* ---------- Section heading (your reference = big gold uppercase) ---------- */
.sec-title{font-size:22px;font-weight:800;color:var(--gold);margin:0 0 4px;letter-spacing:.005em;text-transform:uppercase;line-height:1.2}
.sec-sub{color:var(--t3);font-size:13px;margin-bottom:14px}

/* ---------- Stat blocks (Account Size / Profit / Drawdown / MT5 Access) ---------- */
.stat-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media(max-width:900px){.stat-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.stat-label{color:var(--t3);font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase}
.stat-value{font-family:'JetBrains Mono',monospace;font-size:24px;font-weight:800;color:var(--gold);margin-top:6px;letter-spacing:-.02em;line-height:1.1;text-transform:uppercase}
.stat-value.long{color:var(--green-text)}
.stat-value.short{color:var(--red-text)}
.stat-value.info{color:var(--info-text)}
.stat-sub{font-size:11px;color:var(--t3);margin-top:4px}

/* ---------- Trader card (your reference: outer gold border, badges on top, name, contact, stats, action row) ---------- */
.trader-card{background:var(--card);border:2px solid var(--line-gold);border-radius:18px;padding:20px;margin-bottom:16px}
.trader-card.breached{border-color:rgba(239,68,68,.5)}
.trader-card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:14px}
.trader-card-info{flex:1;min-width:0}
.trader-card-badges{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.trader-name{font-size:22px;font-weight:800;color:var(--gold);margin:4px 0 2px;line-height:1.2;text-transform:uppercase;letter-spacing:.005em}
.trader-name.breached{color:var(--red-2)}
.trader-contact{color:var(--t3);font-size:13px}
.trader-contact a{color:var(--info-text);text-decoration:none}

.trader-card-side{text-align:right;flex-shrink:0}
.trader-mt5-label{color:var(--t3);font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}

.trader-stage-label{color:var(--t3);font-size:11px;font-weight:600;margin-top:8px}
.trader-stage-val{font-size:14px;font-weight:700;color:var(--gold);text-transform:uppercase}
.trader-stage-val.breached{color:var(--red-2)}
.trader-stage-val.passed{color:#8be0ff}

/* ---------- Trader action row (your reference: 5 pill buttons in a row) ---------- */

.act{font-family:inherit;font-weight:700;font-size:13px;padding:14px 18px;border-radius:10px;border:0;cursor:pointer;text-align:center;letter-spacing:.01em;transition:all .12s ease;background:#1a1a1a;color:#fff}

/* ---------- Tags / pills (your reference = uppercase thin-border) ---------- */
.tag{display:inline-block;padding:3px 9px;border-radius:6px;font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;border:1px solid transparent;font-family:'Inter',sans-serif}

.tag-red{background:rgba(239,68,68,.10);color:var(--red-text);border-color:rgba(239,68,68,.35)}
.tag-yellow{background:rgba(234,179,8,.10);color:#fde68a;border-color:rgba(234,179,8,.35)}
.tag-gray{background:rgba(113,113,122,.12);color:var(--t3);border-color:rgba(113,113,122,.35)}
.tag-purple{background:rgba(168,85,247,.10);color:#d8b4fe;border-color:rgba(168,85,247,.35)}

/* ---------- KPI / generic ---------- */
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.kpi-label{color:var(--t3);font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.kpi-value{font-family:'JetBrains Mono',monospace;font-size:22px;font-weight:800;color:#fff;margin-top:6px;letter-spacing:-.02em}
.kpi-value.gold{color:var(--gold)}
.kpi-value.long{color:var(--green-text)}
.kpi-value.short{color:var(--red-text)}
.kpi-sub{font-size:11px;color:var(--t3);margin-top:5px}

/* ---------- Forms (dark inputs) ---------- */
.input,.select,textarea.input{width:100%;padding:11px 14px;background:#000;border:1px solid var(--line);border-radius:10px;color:#fff;font-family:inherit;font-size:13px;outline:none;transition:border-color .12s ease}
.input:focus,.select:focus{border-color:var(--gold)}
.input::placeholder{color:var(--t5)}
textarea.input{resize:vertical;min-height:80px}
label{display:block;font-size:11px;color:var(--t3);letter-spacing:.1em;text-transform:uppercase;font-weight:600;margin-bottom:5px;margin-top:10px}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:10px 16px;font-weight:700;cursor:pointer;font-family:inherit;font-size:13px;background:#1a1a1a;color:#fff;transition:all .12s ease}
.btn:hover{background:#2a2a2a;border-color:var(--line-2)}
.btn-gold{background:linear-gradient(180deg,#ffd968,#f7c843)!important;color:#000!important;border:0!important;font-weight:800}

.btn-green{background:var(--green)!important;color:#fff!important;border:0!important}

/* ---------- Tables ---------- */
.table-wrap{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{background:#0f0f0f;color:var(--t3);text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);font-size:11px;text-transform:uppercase;letter-spacing:.1em;font-weight:700;white-space:nowrap}
tbody td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle;color:var(--t2)}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:#0f0f0f;color:#fff}
.num{font-family:'JetBrains Mono',monospace;font-feature-settings:"tnum" 1;text-align:right}
.num.gold{color:var(--gold)}

.num.short{color:var(--red-text)}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:12px 22px;border-radius:10px;font-weight:800;font-size:13.5px;z-index:99999;color:#000;background:linear-gradient(180deg,#ffd968,#f7c843);box-shadow:0 10px 30px rgba(0,0,0,.7);max-width:90vw;line-height:1.4;text-align:center;white-space:pre-wrap}

.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:99999;display:flex;align-items:flex-start;justify-content:center;padding:30px 16px;overflow-y:auto;backdrop-filter:blur(6px)}
.modal-card{background:#0a0a0a;border:2px solid var(--line-gold);border-radius:18px;padding:28px;max-width:680px;width:100%;position:relative;max-height:90vh;overflow-y:auto}

#np-owner-economic-centre h2,
#np-owner-economic-centre h3,
#owner-economic-command-centre h1,
#owner-economic-command-centre h2,

[style*="color:var(--t3)"]{ color:#AEB7C4 !important; }
