@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap');

/* =========================================================================
   NAIRAPIPS ADMIN — matches your reference (old admin style)
   Black + warm gold + pill action buttons + trader card grid + mono money
   ========================================================================= */
:root{
  --bg:#000000;
  --card:#0a0a0a;
  --card-2:#111111;
  --line:#1f1f1f;
  --line-2:#2a2a2a;
  --line-gold:rgba(212,175,55,.35);

  --gold:#f7c843;          /* warm yellow-gold (your reference) */
  --gold-2:#ffd968;
  --gold-deep:#c89a25;

  --green:#1f8a3a;          /* Pass Phase button */
  --green-2:#22c55e;
  --green-text:#4ade80;

  --red:#c2292c;            /* Breached button */
  --red-2:#ef4444;
  --red-text:#f87171;

  --yellow:#eab308;          /* Mark Funded */
  --yellow-2:#fbbf24;

  --blue:#38bdf8;
  --info-text:#7dd3fc;

  --t1:#ffffff;
  --t2:#e5e5e5;
  --t3:#a1a1aa;
  --t4:#71717a;
  --t5:#52525b;
}

*{box-sizing:border-box;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
html,body{margin:0;background:var(--bg);color:var(--t1);font-family:'Inter',-apple-system,system-ui,sans-serif;font-size:14px;line-height:1.5}

/* App shell */
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh;background:var(--bg)}
.app>aside{position:sticky;top:0;height:100vh;overflow-y:auto;background:#000;border-right:1px solid var(--line)}
.app>main{min-width:0}
@media(max-width:900px){.app{grid-template-columns:1fr}.app>aside{display:none}}

/* ---------- Sidebar (your reference = plain text + yellow active) ---------- */
.brand{padding:18px 18px 16px;border-bottom:1px solid var(--line)}
.brand-name{font-weight:900;font-size:17px;letter-spacing:.02em;color:#fff;text-transform:uppercase}
.brand-name span{color:var(--gold)}
.brand-sub{font-size:10px;color:var(--t4);letter-spacing:.18em;text-transform:uppercase;margin-top:3px;font-weight:600}

.nav-section{padding:14px 18px 4px;color:var(--t4);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.18em}
.nav{display:flex;align-items:center;gap:9px;width:auto;margin:0 8px;padding:7px 11px;color:var(--t2);font-weight:500;font-size:13px;background:transparent;border:0;text-align:left;cursor:pointer;font-family:inherit;line-height:1.2;border-radius:6px;transition:background .1s linear}
.nav .ico{width:14px;font-size:12px;flex-shrink:0;color:var(--t4)}
.nav:hover{background:#161616;color:var(--gold)}
.nav:hover .ico{color:var(--gold)}
.nav.active{background:rgba(247,200,67,.12);color:var(--gold);font-weight:600}
.nav.active .ico{color:var(--gold)}

/* ---------- Topbar (slim, gold-on-black) ---------- */
.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:14px;padding:0 22px;height:50px;background:#000;border-bottom:1px solid var(--line)}
.topbar h1{font-size:18px;font-weight:800;margin:0;color:#fff;letter-spacing:.005em;text-transform:uppercase}
.topbar h1 small{color:var(--gold);font-weight:700;margin-left:8px;font-size:12px;letter-spacing:.1em}
.tb-clock{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--t3);margin-left:auto;letter-spacing:.04em}
.tb-clock .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--green);margin-right:6px;box-shadow:0 0 8px var(--green)}

/* ---------- Content area ---------- */
.content{padding:22px}
@media(max-width:700px){.content{padding:14px}}

/* ---------- Cards (the reference look: dark inner box, thin gold border) ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.card.gold-border{border-color:var(--line-gold)}
.card.tilt:hover{border-color:var(--line-2)}

/* ---------- Trader card (your reference: outer gold border, badges on top, name, contact, stats, action row) ---------- */

.act{font-family:inherit;font-weight:700;font-size:13px;padding:14px 18px;border-radius:10px;border:0;cursor:pointer;text-align:center;letter-spacing:.01em;transition:all .12s ease;background:#1a1a1a;color:#fff}

/* ---------- Forms (dark inputs) ---------- */
.input,.select,textarea.input{width:100%;padding:11px 14px;background:#000;border:1px solid var(--line);border-radius:10px;color:#fff;font-family:inherit;font-size:13px;outline:none;transition:border-color .12s ease}

.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:99999;display:flex;align-items:flex-start;justify-content:center;padding:30px 16px;overflow-y:auto;backdrop-filter:blur(6px)}

-weight:900;margin-bottom:8px">Public Marketer Signup</h3><div class="grid sm:grid-cols-3 gap-2"><div><div class="kpi-sub">Landing URL</div><input class="input" id="aff-public-url" readonly value="https://nairapips.com/?affiliate_signup=1"></div><div><div class="kpi-sub">API Endpoint</div><input class="input" readonly value="POST /affiliate_signup"></div><div style="display:flex;align-items:end"><button class="btn btn-gold" onclick="copyText(document.getElementById('aff-public-url').value,'Signup link copied')">Copy Signup Link</button></div></div><div class="kpi-sub" style="margin-top:8px">Landing page form should submit name, email, phone, company and optional preferred_code. The backend returns the partner code and referral link.</div></div><div class="grid md:grid-cols-2 gap-3 mb-6 tab-content">\n      <div class="card">\n        <h3 style="font-weight:900;margin-bottom:10px">＋ New Partner</h3>\n        <div class="grid sm:grid-cols-2 gap-2">\n          <div><div class="kpi-sub">Name</div><input class="input" id="ap-name"></div>\n          <div><div class="kpi-sub">Code</div><input class="input" id="ap-code" placeholder="KUNLEFX"></div>\n          <div><div class="kpi-sub">Email</div><input class="input" id="ap-email"></div>\n          <div><div class="kpi-sub">Phone</div><input class="input" id="ap-phone"></div>\n          <div><div class="kpi-sub">Company</div><input class="input" id="ap-company"></div>\n          <div><div class="kpi-sub">Type</div><select class="select" id="ap-type"><option value="individual">Individual</option><option value="influencer">Influencer</option><option value="agency">Agency</option></select></div>\n          <div><div class="kpi-sub">Commission %</div><input class="input" id="ap-comm" type="number" value="${esc(admReferralCommission())}"></div>\n          <div><div class="kpi-sub">Discount %</div><input class="input" id="ap-disc" type="number" value="${esc(admReferralBuyerDiscount())}"></div>\n        </div>\n        <div class="flex gap-2 mt-3"><button class="btn btn-gold" onclick="createAffiliatePartner()">＋ Create</button></div>\n      </div>\n      <div class="card">\n        <h3 style="font-weight:900;margin-bottom:10px">＋ New Code</h3>\n        <div class="grid sm:grid-cols-2 gap-2">\n          <div><div class="kpi-sub">Code</div><input class="input" id="ac-code" placeholder="XMAS50"></div>\n          <div><div class="kpi-sub">Owner Name</div><input class="input" id="ac-owner"></div>\n          <div><div class="kpi-sub">Type</div><select class="select" id="ac-type"><option value="seasonal">Seasonal</option><option value="flash">Flash</option><option value="partner">Partner</option></select></div>\n          <div><div class="kpi-sub">Commission %</div><input class="input" id="ac-comm" type="number" value="${esc(admReferralCommission())}"></div>\n          <div><div class="kpi-sub">Discount %</div><input class="input" id="ac-disc" type="number" value="${esc(admReferralBuyerDiscount())}"></div>\n          <div><div class="kpi-sub">Usage Limit</div><input class="input" id="ac-limit" type="number" placeholder="unlimited"></div>\n          <div><div class="kpi-sub">Start Date</div><input class="input" id="ac-start" type="date"></div>\n          <div><div class="kpi-sub">End Date</div><input class="input" id="ac-end" type="date"></div>\n        </div>\n        <div class="flex gap-2 mt-3"><button class="btn btn-gold" onclick="createAffiliateCode()">＋ Create</button></div>\n      </div>\n    </div>\n    <div class="card tab-content mb-3"><h3 style="font-weight:900;margin-bottom:10px">Partners</h3><div style="overflow-x:auto"><table class="compact">\n      <thead><tr><th>Code</th><th>Name</th><th>Email</th><th>Link</th><th>Commission</th><th>Earnings</th><th>Status</th><th>Actions</th></tr></thead>\n      <tbody>${SESSION.affiliates.map(p=>`<tr>\n        <td style="color:var(--gold);font-weight:700">${esc(p.partner_code||p.code||"—")}</td>\n        <td>${esc(p.partner_name||p.name||"—")}</td>\n        <td>${esc(p.partner_email||p.email||"—")}</td>\n        <td><button class="btn btn-sm btn-gold" onclick="copyText('${esc(p.affiliate_link||"https://nairapips.com/?ref="+(p.partner_code||p.code||""))}','Affiliate link copied')">Copy Link</button></td>\n        <td>${pct(p.commission_percent||p.commission||0)}</td>\n        <td>${esc(money(p.total_earnings||0))}</td>\n        <td>${esc(p.status||"active")}</td>\n        <td><button class="btn btn-sm btn-red" onclick='deactivateAffiliatePartner(${JSON.stringify(p.id)})'>Deactivate</button></td>\n      </tr>`).join("")||'<tr><td colspan="9"><div class="empty">None.</div></td></tr>'}</tbody>\n    </table></div></div>\n    <div class="card tab-content mb-3"><h3 style="font-weight:900;margin-bottom:10px">Codes</h3><div style="overflow-x:auto"><table class="compact">\n      <thead><tr><th>Code</th><th>Owner</th><th>Type</th><th>Link</th><th>Commission</th><th>Discount</th><th>Uses</th><th>Status</th><th>Actions</th></tr></thead>\n      <tbody>${SESSION.affiliateCodes.map(c=>`<tr>\n        <td style="color:var(--gold);font-weight:700">${esc(c.code||c.affiliate_code||"—")}</td>\n        <td>${esc(c.owner_name||c.partner_name||"—")}</td>\n        <td class="text-xs">${esc(c.code_type||"—")}</td>\n        <td><button class="btn btn-sm btn-gold" onclick="copyText('${esc(c.affiliate_link||"https://nairapips.com/?ref="+(c.code||c.affiliate_code||""))}','Code link copied')">Copy Link</button></td>\n        <td>${pct(c.commission_percent||0)}</td>\n        <td>${pct(c.discount_percent||0)}</td>\n        <td>${esc(c.usage_count||0)} / ${esc(c.usage_limit||"∞")}</td>\n        <td>${esc(c.status||"active")}</td>\n        <td><button class="btn btn-sm btn-red" onclick='deactivateAffiliateCode(${JSON.stringify(c.id)})'>Deactivate</button></td>\n      </tr>`).join("")||'<tr><td colspan="9"><div class="empty">None.</div></td></tr>'}</tbody>\n    </table></div></div>\n    <div class="card tab-content mb-3"><h3 style="font-weight:900;margin-bottom:10px">Affiliate Payout Requests</h3><div style="overflow-x:auto"><table class="compact">\n      <thead><tr><th>Code</th><th>Partner</th><th>Contact</th><th>Amount</th><th>Method</th><th>Payment Details</th><th>Status</th><th>Actions</th></tr></thead>\n      <tbody>${(SESSION.affiliatePayoutRequests||[]).map(p=>`<tr>\n        <td style="color:var(--gold);font-weight:700">${esc(p.partner_code||" ")}</td>\n        <td>${esc(p.partner_name||" ")}</td>\n        <td>${esc(p.partner_email||"")}<br><span class="text-xs">${esc(p.partner_phone||"")}</span></td>\n        <td>${esc(money(p.amount||0))}</td>\n        <td>${esc(p.payment_method||"bank")}</td>\n        <td>${esc(p.bank_name||"")}<br><span class="text-xs">${esc(p.account_number||"")}   ${esc(p.account_name||"")}</span></td>\n        <td>${esc(p.status||"pending")}</td>\n        <td class="flex gap-1 flex-wrap">\n          <button class="btn btn-sm btn-gold" onclick='updateAffiliatePayoutRequest(${JSON.stringify(p.id)},"approved")'>Approve</button>\n          <button class="btn btn-sm btn-green" onclick='updateAffiliatePayoutRequest(${JSON.stringify(p.id)},"paid")'>Mark Paid</button>\n          <button class="btn btn-sm btn-red" onclick='updateAffiliatePayoutRequest(${JSON.stringify(p.id)},"rejected")'>Reject</button>\n        </td>\n      </tr>`).join("")||'<tr><td colspan="8"><div class="empty">No affiliate payout requests yet.</div></td></tr>'}</tbody>\n    </table></div></div>    <div class="card tab-content"><h3 style="font-weight:900;margin-bottom:10px">＋ Manual Commission</h3>\n      <div class="grid sm:grid-cols-5 gap-2">\n        <div><div class="kpi-sub">Partner Code</div><input class="input" id="mc-code"></div>\n        <div><div class="kpi-sub">Customer Name</div><input class="input" id="mc-name"></div>\n        <div><div class="kpi-sub">Customer Email</div><input class="input" id="mc-email"></div>\n        <div><div class="kpi-sub">Sale Amount</div><input class="input" id="mc-amount" type="number"></div>\n        <div><div class="kpi-sub">Commission %</div><input class="input" id="mc-pct" type="number" value="20"></div>\n      </div>\n      <div class="flex gap-2 mt-3"><button class="btn btn-gold" onclick="createManualCommission()">＋ Add</button></div>\n    </div>\n  `}window.updateAffiliatePayoutRequest=async function(id,status){if(!id)return;const note=prompt("Admin note (optional):","")||"";if(status==="paid"&&!confirm("Mark this affiliate payout as PAID and mark linked commissions paid?"))return;try{await api("/update_affiliate_payout_request","POST",{id:id,status:status,admin_note:note,admin_name:SESSION.admin?.name,admin_username:SESSION.admin?.username});await audit("affiliates","affiliate_payout_"+status,note,id);toast("Affiliate payout updated","ok");await loadModuleData("affiliates");renderAffiliates()}catch(e){toast("Failed: "+(e?.message||e),"err")}};window.createAffiliatePartner=async function(){const payload={name:document.getElementById("ap-name").value.trim(),code:document.getElementById("ap-code").value.trim().toUpperCase(),email:document.getElementById("ap-email").value.trim(),phone:document.getElementById("ap-phone").value.trim(),company:document.getElementById("ap-company").value.trim(),partner_type:document.getElementById("ap-type").value,commission_percent:Number(document.getElementById("ap-comm").value),discount_percent:Number(document.getElementById("ap-disc").value),admin_name:SESSION.admin?.name,admin_role:SESSION.admin?.role};if(!payload.name||!payload.code){toast("Name + code required","err");return}try{await api("/create_affiliate_partner","POST",payload);await audit("affiliates","partner_create",payload.code);toast("Partner created","ok");reload()}catch(e){toast("Failed: "+e.message,"err")}};window.createAffiliateCode=async function(){const code=document.getElementById("ac-code").value.trim().toUpperCase();if(!code){toast("Enter a code","err");return}try{await api("/create_affiliate_code","POST",{code:code,owner_name:document.getElementById("ac-owner").value,code_type:document.getElementById("ac-type").value,commission_percent:Number(document.getElementById("ac-comm").value),discount_percent:Number(document.getElementById("ac-disc").value),start_date:document.getElementById("ac-start").value,end_date:document.getElementById("ac-end").value,usage_limit:document.getElementById("ac-limit").value,admin_name:SESSION.admin?.name,admin_role:SESSION.admin?.role});await audit("affiliates","code_create",code);toast("Code created: "+code,"ok");reload()}catch(e){toast("Failed: "+e.message,"err")}};window.deactivateAffiliatePartner=async function(id){if(!confirm("Deactivate this partner?"))return;try{await api("/delete_affiliate_partner","POST",{id:id,admin_name:SESSION.admin?.name});await audit("affiliates","partner_deactivate","",id);toast("Deactivated","ok");reload()}catch(e){toast("Failed: "+e.message,"err")}};window.deactivateAffiliateCode=async function(id){if(!confirm("Deactivate this code?"))return;try{await api("/delete_affiliate_code","POST",{id:id,admin_name:SESSION.admin?.name});await audit("affiliates","code_deactivate","",id);toast("Deactivated","ok");reload()}catch(e){toast("Failed: "+e.message,"err")}};window.createManualCommission=async function(){const partner_code=document.getElementById("mc-code").value.trim().toUpperCase();if(!partner_code){toast("Partner code required","err");return}try{await api("/create_affiliate_commission","POST",{partner_code:partner_code,customer_name:document.getElementById("mc-name").value,customer_email:document.getElementById("mc-email").value,sale_amount:Number(document.getElementById("mc-amount").value)||0,commission_percent:Number(document.getElementById("mc-pct").value)||20,partner_name:partner_code});await audit("affiliates","manual_commission",partner_code);toast("Commission added","ok");reload()}catch(e){toast("Failed: "+e.message,"err")}};function renderTimeline(){const events=[...SESSION.traders.map(t=>({when:t.created_at,who:t.name||t.email,what:"Trader registered",kind:"trader"})),...SESSION.purchases.map(p=>({when:p.created_at,who:"(purchase)",what:p.plan_name||"Challenge",kind:"purchase"})),...SESSION.payouts.map(p=>({when:p.created_at,who:"(payout)",what:money(p.amount),kind:"payout"})),...SESSION.announcements.map(a=>({when:a.created_at,who:a.target_email||"(all)",what:a.subject||a.title,kind:"offer"}))].filter(e=>e.when).sort((a,b)=>new Date(b.when)-new Date(a.when)).slice(0,100);document.getElementById("content").innerHTML=`\n    <div class="vault mb-6 tab-content">\n      <div class="badge">TIMELINE</div>\n      <div style="font-size:24px;font-weight:900;margin-top:6px">${events.length} recent event(s)</div>\n    </div>\n    <div class="card tab-content">\n      ${events.length?events.map(e=>`<div class="mb-2" style="border-left:3px solid var(--gold);padding:8px 12px;background:rgba(212,175,55,.05);border-radius:0 6px 6px 0">\n        <div class="text-xs text-gray-400">${esc(String(e.when).slice(0,16))}</div>\n        <div><b>${esc(e.what)}</b> — <span class="text-gray-400">${esc(e.who)}</span> · <span class="tag tag-gray">${esc(e.kind)}</span></div>\n      </div>`).join(""):'<div class="empty">No events yet.</div>'}\n    </div>\n  `}function admReferralCommission(){const s=SESSION.referralSettings||{};return Number(s.rebateValue??s.rebate_percent??10)||0}function admReferralBuyerDiscount(){const s=SESSION.referralSettings||{};return Number(s.customerBonus??s.customer_bonus??0)||0}async function loadReferralSettings(force=false){if(SESSION.referralSettings&&!force)return SESSION.referralSettings;try{const r=await api("/referral_settings");SESSION.referralSettings=r.data||r||{};if(document.getElementById("ref-commission"))document.getElementById("ref-commission").value=admReferralCommission();if(document.getElementById("ref-discount"))document.getElementById("ref-discount").value=admReferralBuyerDiscount();if(document.getElementById("ref-min-payout"))document.getElementById("ref-min-payout").value=SESSION.referralSettings.minPayout||5e3}catch(e){console.warn("Referral settings unavailable",e?.message||e)}return SESSION.referralSettings||{}}window.saveReferralSettings=async function(){const current=SESSION.referralSettings||{};const payload=Object.assign({},current,{rebateType:"percent",rebateValue:document.getElementById("ref-commission")?.value||admReferralCommission(),customerBonus:document.getElementById("ref-discount")?.value||admReferralBuyerDiscount(),minPayout:document.getElementById("ref-min-payout")?.value||current.minPayout||5e3,status:current.status||"active"});try{const r=await api("/referral_settings","POST",payload);SESSION.referralSettings=r.data||r||payload;toast("Referral settings saved","ok")}catch(e){toast("Failed: "+(e?.message||e),"err")}};function renderSettings(){loadReferralSettings();document.getElementById("content").innerHTML=`\n    <div class="vault mb-6 tab-content">\n      <div class="badge">SETTINGS</div>\n      <div style="font-size:24px;font-weight:900;margin-top:6px">Business settings</div><p class="kpi-sub mt-3">Manage package benefits, prices and availability.</p>\n    </div>\n    <div class="card tab-content">\n      <h3 style="font-weight:900;margin-bottom:8px">Signed in as</h3>\n      <div>${esc(SESSION.admin?.name||SESSION.admin?.username||"—")} <span class="text-gray-400">(${esc(SESSION.admin?.role||"admin")})</span></div>\n    </div>\n    <div style="height:12px"></div>\n    <div class="card tab-content">\n      <h3 style="font-weight:900;margin-bottom:8px">Referral Defaults</h3>\n      <div class="grid sm:grid-cols-3 gap-2">\n        <div><div class="kpi-sub">Marketer Commission %</div><input class="input" id="ref-commission" type="number" min="0" max="100" value="${esc(admReferralCommission())}"></div>\n        <div><div class="kpi-sub">Buyer Discount %</div><input class="input" id="ref-discount" type="number" min="0" max="100" value="${esc(admReferralBuyerDiscount())}"></div>\n        <div><div class="kpi-sub">Minimum Payout</div><input class="input" id="ref-min-payout" type="number" min="0" value="${esc(SESSION.referralSettings&&SESSION.referralSettings.minPayout||5e3)}"></div>\n      </div>\n      <div class="flex gap-2 mt-3"><button class="btn btn-gold" onclick="saveReferralSettings()">Save Referral Settings</button><button class="btn btn-ghost" onclick="loadReferralSettings(true)">Reload</button></div>\n      <div class="kpi-sub mt-2">These defaults control automatic trader/marketer referral links. Existing special partner codes can still have their own custom percentages.</div>\n    </div>    <div style="height:12px"></div>\n    <div class="card tab-content">\n      <div id="np-production-settings"></div>\n    </div>\n  `;npLoadProductionSettings()}function showModal(html){const div=document.createElement("div");div.className="modal-bg";div.onclick=e=>{if(e.target===div)div.remove()};div.innerHTML=`<div class="modal-card" onclick="event.stopPropagation()">${html}</div>`;document.body.appendChild(div);return div}function modal(title,html){return showModal(`<div class="badge" style="margin-bottom:10px">${title}</div>${html}`)}function genMT5(id){const el=document.getElementById(id);if(!el)return;el.value=makeMT5Password()}function makeMT5Password(){const upper="ABCDEFGHJKLMNPQRSTUVWXYZ";const lower="abcdefghjkmnpqrstuvwxyz";const num="23456789";const sym="@#$%&*!?";let s="";s+=upper[Math.floor(Math.random()*upper.length)];s+=lower[Math.floor(Math.random()*lower.length)];s+=num[Math.floor(Math.random()*num.length)];s+=sym[Math.floor(Math.random()*sym.length)];const all=upper+lower+num+sym;for(let i=s.length;i<14;i++)s+=all[Math.floor(Math.random()*all.length)];return s.split("").sort(()=>Math.random()-.5).join("")}async function copyField(id){const el=document.getElementById(id);if(!el||!el.value){toast("Nothing to copy","err");return}try{await navigator.clipboard.writeText(el.value);toast("Copied","ok")}catch(e){el.select();document.execCommand("copy");toast("Copied","ok")}}
</script>
<script>
window.adminOpenIntelligence=async function(traderId,accountId){if(!accountId){toast("Black Box requires the exact breached account.","err");return}const dialog=modal("Breach Intelligence",`<div role="status">Loading the exact account’s breach evidence…</div><button class="btn btn-sm" onclick="this.closest('.modal-bg').remove()">Close</button>`);const controller=new AbortController;const timer=setTimeout(()=>controller.abort(),25e3);try{if(!SESSION.token)throw new Error("Your admin session has expired. Please sign in again.");const base=API_URL.replace(/\/$/,"");const headers={Accept:"application/json"};if(SESSION.token)headers["Authorization"]="Bearer "+SESSION.token;const resp=await fetch(base+"/admin/breach_intelligence?trader_id="+encodeURIComponent(traderId)+"&account_id="+encodeURIComponent(accountId),{headers:headers,signal:controller.signal,cache:"no-store"});const j=await resp.json();if(!resp.ok||j.success===false)throw new Error(j.error||j.message||"HTTP "+resp.status);const x=j.data||j,a=x.account||{},r=x.rule||{},f=x.first_crossing||{},low=x.lowest_observed||{},rec=x.recovery_after_breach||{};const fmtTime=v=>{if(!v)return"—";const d=new Date(v);return isNaN(d)?String(v):d.toLocaleString("en-GB",{day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false,timeZone:"UTC"})+" UTC"};const dd=Number(f.drawdown_percent||0),limit=Number(f.dd_limit_percent||r.dd_limit_percent||0);const usage=limit>0?Math.min(100,Math.max(0,dd/limit*100)):0;const recovery=rec.recovered?`<div class="npbb-recovery"><b>RECOVERY RECORDED AFTER BREACH</b><div style="margin-top:4px;color:#a7f3d0">Equity later returned above the breach floor at ${esc(fmtTime(rec.first_recovery_timestamp))}. The original first crossing remains preserved.</div></div>`:"";const timeline=(x.timeline||[]).map(t=>`<tr><td>${esc(fmtTime(t.timestamp))}</td><td>${esc(String(t.kind||t.event_type||"—"))}</td><td>${money(t.balance||0)}</td><td>${money(t.equity||0)}</td><td>${pct(t.drawdown_percent||0)}</td><td>${esc(String(t.risk_zone||"—"))}</td></tr>`).join("");const html=`<div class="npbb-shell"><div class="npbb-inner">\n      <div class="npbb-head">\n        <div><div class="npbb-brand">NairaPips · Forensic Risk Record</div><div class="npbb-title">Black Box</div><div class="npbb-sub">Immutable breach intelligence for MT5 ${esc(String(a.mt5_login||"—"))}. A later recovery cannot rewrite the recorded first crossing.</div></div>\n        <div class="npbb-seal">BREACH CONFIRMED</div>\n      </div>\n      <div class="npbb-moment">\n        <div class="npbb-kicker">Exact first recorded crossing</div>\n        <div class="npbb-time">${esc(fmtTime(f.timestamp||a.breached_at))}</div>\n        <div style="display:flex;gap:16px;flex-wrap:wrap;margin-top:8px;color:#a1a1aa;font-size:11px"><span>MT5 <b style="color:#fff">${esc(String(a.mt5_login||"—"))}</b></span><span>Stage <b style="color:#fff">${esc(String(a.stage||"—").toUpperCase())}</b></span><span>Evidence <b style="color:#fff">${esc(String(x.evidence_quality||"FORENSIC RECORD").replaceAll("_"," "))}</b></span></div>\n      </div>\n      <div class="npbb-metrics">\n        <div class="npbb-card gold"><div class="npbb-label">Account Size</div><div class="npbb-value">${money(a.account_size||r.start_balance)}</div><div class="npbb-note">Starting capital ${money(r.start_balance)}</div></div>\n        <div class="npbb-card"><div class="npbb-label">Permitted DD</div><div class="npbb-value">${pct(r.dd_limit_percent||0)}</div><div class="npbb-note">Breach floor ${money(r.breach_equity_level)}</div></div>\n        <div class="npbb-card critical"><div class="npbb-label">Equity at Crossing</div><div class="npbb-value">${money(f.equity||0)}</div><div class="npbb-note">Balance ${money(f.balance||0)}</div></div>\n        <div class="npbb-card critical"><div class="npbb-label">DD at Crossing</div><div class="npbb-value">${pct(f.drawdown_percent||0)}</div><div class="npbb-note">Exceeded by ${money(f.exceeded_amount||0)}</div></div>\n        <div class="npbb-card"><div class="npbb-label">Floating P/L</div><div class="npbb-value">${money(f.floating_profit||0)}</div><div class="npbb-note">At first crossing</div></div>\n        <div class="npbb-card"><div class="npbb-label">Lowest Equity Seen</div><div class="npbb-value">${money(low.equity||0)}</div><div class="npbb-note">${esc(fmtTime(low.timestamp))}</div></div>\n        <div class="npbb-card gold"><div class="npbb-label">Breach Floor</div><div class="npbb-value">${money(r.breach_equity_level||0)}</div><div class="npbb-note">Exact rule threshold</div></div>\n        <div class="npbb-card"><div class="npbb-label">Evidence Records</div><div class="npbb-value">${Number(x.snapshot_count||0)+Number(x.event_count||0)}</div><div class="npbb-note">${Number(x.snapshot_count||0)} snapshots · ${Number(x.event_count||0)} events</div></div>\n      </div>\n      <div class="npbb-proof">\n        <div class="npbb-panel"><h4>Drawdown Threshold</h4><div style="display:flex;justify-content:space-between;gap:12px"><span style="color:#a1a1aa">Observed ${pct(dd)}</span><b style="color:#fff">Limit ${pct(limit)}</b></div><div class="npbb-ruleline"><div class="npbb-rulefill" style="width:${usage}%"></div></div><div style="font-size:11px;color:#71717a">Rule authority: ${esc(String(r.authority||"exact account rule"))}</div>${recovery}</div>\n        <div class="npbb-panel"><h4>Evidence Integrity</h4><div style="font-size:11px;color:#a1a1aa;line-height:1.7">First crossing is historical evidence and is not replaced by current equity.<br><b style="color:#fff">Reference</b><br><span class="npbb-ref">${esc(String(x.event_id||"—"))}</span><br><b style="color:#fff">Breach source</b><br>${esc(String(f.breach_source||"stored monitoring evidence"))}</div></div>\n      </div>\n      <div class="npbb-panel" style="margin-top:12px"><h4>Forensic Timeline</h4><div class="npbb-timeline"><table><thead><tr><th>UTC Time</th><th>Record</th><th>Balance</th><th>Equity</th><th>DD</th><th>State</th></tr></thead><tbody>${timeline||'<tr><td colspan="6" style="text-align:center;color:#71717a">Legacy record — detailed timeline was not stored.</td></tr>'}</tbody></table></div></div>\n      <div class="npbb-foot"><div>Official NairaPips breach evidence · ${esc(fmtTime(x.generated_at))}</div><div class="npbb-actions"><button class="npbb-btn" onclick="navigator.clipboard?.writeText('${esc(String(x.event_id||""))}').then(()=>toast('Evidence reference copied','ok'))">Copy Reference</button><button class="npbb-btn" onclick="window.print()">Print Evidence</button></div></div>\n    </div></div>`;if(dialog.isConnected)dialog.querySelector(".modal-card").innerHTML=`<button class="btn btn-sm" onclick="this.closest('.modal-bg').remove()">Close</button>`+html}catch(e){const message=e.name==="AbortError"?"The account evidence did not respond within 25 seconds. Please retry.":String(e.message||e);if(dialog.isConnected)dialog.querySelector(".modal-card").innerHTML=`<h3>Breach Intelligence unavailable</h3><div role="alert" style="margin:16px 0;color:#fca5a5">${esc(message)}</div><button class="btn btn-gold" onclick="this.closest('.modal-bg').remove();adminOpenIntelligence('${esc(String(traderId))}','${esc(String(accountId))}')">Retry</button> <button class="btn" onclick="this.closest('.modal-bg').remove()">Close</button>`}finally{clearTimeout(timer)}};const LEAGUE={sub:"overview",season:null,seasons:[],registrations:[],rewards:[],champions:[],mt5:[],activity:[],busy:false};async function _leagueApi(path,method="GET",body=null){const opts={method:method};if(body){opts.headers={"Content-Type":"application/json"};opts.body=JSON.stringify(body)}const r=await api(path,opts);return r&&(r.data!==undefined?r.data:r)}async function loadLeagueModule(){LEAGUE.busy=true;try{const seasons=await _leagueApi("/admin/league/seasons");LEAGUE.seasons=seasons&&seasons.seasons||[];LEAGUE.season=LEAGUE.seasons[0]||null;if(LEAGUE.season){const regs=await _leagueApi("/admin/league/"+LEAGUE.season.id+"/registrations");LEAGUE.registrations=regs&&regs.registrations||[];const accounts=await api("/trader_accounts?programme_type=traders_league&limit=500&fresh="+Date.now());const acctsArr=Array.isArray(accounts)?accounts:accounts.accounts||accounts.data||[];LEAGUE.mt5=acctsArr.filter(a=>a.competition_id===LEAGUE.season.id);LEAGUE.rewards=[];for(let pos=1;pos<=3;pos++){const reward=await _leagueApi("/admin/league/seasons/"+LEAGUE.season.id+"/rewards?position="+pos).catch(()=>null);if(reward&&reward.reward)LEAGUE.rewards.push(reward.reward)}const champRes=await _leagueApi("/admin/league/"+LEAGUE.season.id+"/champions").catch(()=>null);LEAGUE.champions=champRes&&champRes.champions||[]}else{LEAGUE.registrations=[];LEAGUE.mt5=[];LEAGUE.rewards=[];LEAGUE.champions=[]}}catch(e){console.error("loadLeagueModule error",e);toast("League module load failed: "+(e.message||e),"err")}finally{LEAGUE.busy=false}}window.refreshLeagueNow=async function(button){if(LEAGUE.busy){toast("League refresh is already running. Please wait a moment.","warn");return}const btn=button||document.getElementById("league-refresh-btn");const original=btn?btn.innerHTML:"↻ Refresh";if(btn){btn.disabled=true;btn.style.pointerEvents="none";btn.innerHTML='<span class="spinner"></span> Refreshing…'}try{await loadLeagueModule();renderLeague();toast("Traders League refreshed","ok")}catch(e){console.error("refreshLeagueNow failed",e);toast("League refresh failed: "+(e?.message||e),"err");renderLeague()}finally{LEAGUE.busy=false;const liveBtn=document.getElementById("league-refresh-btn");if(liveBtn){liveBtn.disabled=false;liveBtn.style.pointerEvents="auto";liveBtn.innerHTML=original}}};function _leagueSeasonBadge(status){const s=String(status||"").toLowerCase();const map={draft:["#6b7280","DRAFT"],registration_open:["#10b981","REGISTRATION OPEN"],selection_in_progress:["#f59e0b","SELECTION"],ready:["#3b82f6","READY"],live:["#22c55e","LIVE"],under_review:["#f59e0b","UNDER REVIEW"],completed:["#a78bfa","COMPLETED"],cancelled:["#ef4444","CANCELLED"],archived:["#6b7280","ARCHIVED"]};const[c,label]=map[s]||["#6b7280",String(status||"UNKNOWN").toUpperCase()];return`<span style="display:inline-block;padding:4px 10px;border-radius:999px;background:${c}22;color:${c};border:1px solid ${c}55;font-size:10px;font-weight:900;letter-spacing:.1em">${label}</span>`}function renderLeague(){const root=document.getElementById("content");if(!root){return}if(LEAGUE.busy){root.innerHTML=`<div class="card"><div class="empty"><span class="spinner"></span> Loading Traders League…</div></div>`;return}const sub=LEAGUE.sub;const season=LEAGUE.season;root.innerHTML=`\n    <div class="vault mb-6 tab-content">\n      <div class="flex flex-wrap items-center justify-between gap-3">\n        <div>\n          <div class="badge">🏆 TRADERS LEAGUE V1</div>\n          <div style="font-size:28px;font-weight:900;margin-top:6px">${esc(season?season.name:"No season yet")}</div>\n          <div class="text-gray-400 text-sm mt-1">${season?_leagueSeasonBadge(season.status):'<span style="color:#6b7280">Create a season below to begin.</span>'}</div>\n        </div>\n        <div class="flex gap-2 flex-wrap">\n          <button id="league-refresh-btn" type="button" class="btn btn-gold league-refresh-action" onclick="refreshLeagueNow(this);return false;">↻ Refresh</button>\n          <button class="btn" onclick="leagueCreateSeasonPrompt()">＋ New season</button>\n        </div>\n      </div>\n    </div>\n    <div class="card mb-4" style="padding:0">\n      <div style="display:flex;gap:0;flex-wrap:wrap;border-bottom:1px solid var(--line)">\n        ${["overview","registrations","assignment","leaderboard","rewards","champions","settings","audit"].map(t=>`<button onclick="LEAGUE.sub='${t}';renderLeague()" style="padding:14px 18px;background:${sub===t?"rgba(212,175,55,.08)":"transparent"};color:${sub===t?"var(--gold)":"var(--t3)"};border:0;border-bottom:2px solid ${sub===t?"var(--gold)":"transparent"};font-weight:800;cursor:pointer;font-size:12px;text-transform:uppercase;letter-spacing:.06em">${t}</button>`).join("")}\n      </div>\n    </div>\n    <div id="league-sub">${renderLeagueSub()}</div>\n  `}function renderLeagueSub(){if(!LEAGUE.season){return`<div class="card"><div class="empty">\n      <div style="font-size:18px;font-weight:800;margin-bottom:6px">No season configured</div>\n      <div>Create Season 1 from the button above. After creation, you can configure rewards, run the selection queue, and assign ₦1,000,000 MT5 accounts.</div>\n    </div></div>`}switch(LEAGUE.sub){case"registrations":return renderLeagueRegistrations();case"assignment":return renderLeagueAssignment();case"leaderboard":return renderLeagueLeaderboard();case"rewards":return renderLeagueRewards();case"champions":return renderLeagueChampions();case"settings":const html=renderLeagueSettings();setTimeout(loadLeagueFlags,50);return html;case"audit":return renderLeagueAudit();case"overview":default:return renderLeagueOverview()}}function renderLeagueOverview(){const s=LEAGUE.season;const registered=LEAGUE.registrations.length;const selected=LEAGUE.registrations.filter(r=>String(r.selection_status||"").toLowerCase()==="selected").length;const waitlisted=LEAGUE.registrations.filter(r=>String(r.selection_status||"").toLowerCase()==="waitlisted").length;const active=LEAGUE.mt5.filter(a=>["assigned_active","active","funded_active"].includes(String(a.account_status||"").toLowerCase())).length;return`\n    <div class="grid md:grid-cols-4 gap-3 mb-4">\n      ${kpi("Registered",registered)}\n      ${kpi("Selected",selected)}\n      ${kpi("Waitlisted",waitlisted)}\n      ${kpi("Active Accounts",active)}\n    </div>\n    <div class="card mb-4">\n      <h3 style="font-weight:900;margin-bottom:12px">Season control</h3>\n      <div class="grid md:grid-cols-3 gap-2">\n        <button class="btn" onclick="leagueAction('open-registration')" ${s.status!=="draft"?"disabled":""}>Open registration</button>\n        <button class="btn" onclick="leagueAction('close-registration')" ${s.status!=="registration_open"?"disabled":""}>Close registration → Selection</button>\n        <button class="btn btn-gold" onclick="leagueAction('start')" ${s.status!=="selection_in_progress"&&s.status!=="ready"?"disabled":""}>Start trading</button>\n        <button class="btn" onclick="leagueAction('end')" ${s.status!=="live"?"disabled":""}>End → Under review</button>\n        <button class="btn btn-gold" onclick="leagueAction('complete')" ${s.status!=="under_review"?"disabled":""}>Complete season</button>\n        <button class="btn" onclick="leagueAction('archive')" ${s.status==="archived"?"disabled":""}>Archive</button>\n      </div>\n    </div>\n    <div class="card">\n      <h3 style="font-weight:900;margin-bottom:12px">Season details</h3>\n      <div class="grid md:grid-cols-2 gap-2" style="font-size:13px">\n        <div><b>Name:</b> ${esc(s.name||"—")}</div>\n        <div><b>Slug:</b> ${esc(s.slug||"—")}</div>\n        <div><b>Capacity:</b> ${esc(s.capacity||"—")}</div>\n        <div><b>Account size:</b> ₦${Number(s.account_size||0).toLocaleString()}</div>\n        <div><b>Max DD:</b> ${esc(s.max_drawdown_percent||"—")}%</div>\n        <div><b>Min trading days:</b> ${esc(s.minimum_trading_days||"—")}</div>\n        <div><b>Ranking method:</b> ${esc(s.ranking_method||"—")}</div>\n        <div><b>Season type:</b> ${esc(s.season_type||"founding")}</div>\n        <div><b>Registration open:</b> ${esc(s.registration_open_at||"—")}</div>\n        <div><b>Trading start:</b> ${esc(s.trading_start_at||"—")}</div>\n      </div>\n    </div>\n  `}function renderLeagueRegistrations(){const regs=LEAGUE.registrations;return`\n    <div class="card">\n      <div class="flex flex-wrap items-center justify-between gap-3 mb-3">\n        <h3 style="font-weight:900">Registration pool (${regs.length})</h3>\n        <div class="flex gap-2 flex-wrap">\n          <button class="btn" onclick="leagueBulkAction('select')">✓ Select selected</button>\n          <button class="btn" onclick="leagueBulkAction('waitlist')">⏸ Waitlist selected</button>\n          <button class="btn" onclick="leagueBulkAction('disqualify')" style="background:rgba(239,68,68,.15);color:#fca5a5">✗ Disqualify selected</button>\n        </div>\n      </div>\n      <div class="table-wrap">\n        <table class="compact">\n          <thead>\n            <tr>\n              <th style="width:36px"><input type="checkbox" id="league-reg-all" onchange="document.querySelectorAll('.league-reg-cb').forEach(c=>c.checked=this.checked)"></th>\n              <th>Ticket</th>\n              <th>Nickname</th>\n              <th>Status</th>\n              <th>Selection</th>\n              <th>Imported</th>\n              <th>Priority</th>\n              <th>Created</th>\n            </tr>\n          </thead>\n          <tbody>\n            ${regs.map(r=>`\n              <tr>\n                <td><input type="checkbox" class="league-reg-cb" value="${esc(r.id)}"></td>\n                <td><code style="color:var(--gold)">${esc(r.ticket_code||"—")}</code></td>\n                <td>${esc(r.public_nickname||r.nickname_pending?"<em>pending</em>":"—")}</td>\n                <td>${esc(r.registration_status||"—")}</td>\n                <td>${esc(r.selection_status||"pending")}</td>\n                <td>${r.imported_from_founding?'<span style="color:var(--gold)">★ Founding</span>':"—"}</td>\n                <td>${esc(r.priority_score||0)}</td>\n                <td><small>${esc(String(r.created_at||"").slice(0,10))}</small></td>\n              </tr>\n            `).join("")||`<tr><td colspan="8" style="text-align:center;padding:30px;color:var(--t4)">No registrations yet. Run BACKFILL_FOUNDING_LEAGUE.sql to import the existing 18 Golden Ticket leads.</td></tr>`}\n          </tbody>\n        </table>\n      </div>\n    </div>\n  `}function renderLeagueAssignment(){const s=LEAGUE.season;const selected=LEAGUE.registrations.filter(r=>String(r.selection_status||"").toLowerCase()==="selected"&&!r.trader_account_id);return`\n    <div class="card">\n      <h3 style="font-weight:900;margin-bottom:12px">Account assignment</h3>\n      <p style="color:var(--t3);font-size:13px;margin-bottom:14px">${selected.length} selected registration(s) awaiting a fresh ₦1,000,000 MT5 account assignment.</p>\n      ${selected.length===0?'<div class="empty">No selected registrations pending assignment.</div>':""}\n      ${selected.map(r=>`\n        <div class="card mb-2" style="padding:14px;background:rgba(212,175,55,.04);border:1px solid var(--line)">\n          <div class="flex flex-wrap items-center justify-between gap-2">\n            <div>\n              <b>${esc(r.ticket_code||r.id)}</b> · ${esc(r.public_nickname||"no nickname")}\n              <div style="font-size:11px;color:var(--t4);margin-top:3px">registration_id: <code>${esc(r.id)}</code></div>\n            </div>\n            <button class="btn btn-gold" onclick="leagueAssignMT5('${esc(r.id)}')">Assign MT5 from pool</button>\n          </div>\n        </div>\n      `).join("")}\n    </div>\n  `}function renderLeagueLeaderboard(){const accts=LEAGUE.mt5.slice();accts.sort((a,b)=>Number(b.profit_percent||b.current_profit_percent||0)-Number(a.profit_percent||a.current_profit_percent||0));return`\n    <div class="card">\n      <h3 style="font-weight:900;margin-bottom:12px">Live leaderboard (admin view)</h3>\n      <p style="color:var(--t3);font-size:13px;margin-bottom:14px">Admin-augmented: includes real name, MT5 login, drawdown, and review controls. Public view shows only approved fields.</p>\n      <div class="table-wrap">\n        <table class="compact">\n          <thead>\n            <tr>\n              <th>Rank</th><th>Nickname</th><th>Trader</th><th>MT5</th>\n              <th>Balance</th><th>Growth</th><th>DD%</th><th>Status</th><th>Action</th>\n            </tr>\n          </thead>\n          <tbody>\n            ${accts.map((a,idx)=>`\n              <tr>\n                <td>${idx+1}</td>\n                <td>${esc(a.public_nickname||"—")}</td>\n                <td>${esc(a.trader_id||"—")}</td>\n                <td><code>${esc(a.mt5_login||"—")}</code></td>\n                <td>₦${Number(a.current_balance||a.start_balance||0).toLocaleString()}</td>\n                <td>${(Number(a.profit_percent||0)>=0?"+":"")+Number(a.profit_percent||0).toFixed(2)}%</td>\n                <td>${Number(a.dd_used_percent||0).toFixed(1)}%</td>\n                <td>${esc(a.risk_zone||"safe")}</td>\n                <td>\n                  <button class="btn btn-sm" onclick="leagueReview('${esc(a.id)}','provisional')">Provisional</button>\n                  <button class="btn btn-sm" onclick="leagueReview('${esc(a.id)}','qualify')">Qualify</button>\n                  <button class="btn btn-sm" style="background:rgba(239,68,68,.15);color:#fca5a5" onclick="leagueReview('${esc(a.id)}','disqualify')">DQ</button>\n                </td>\n              </tr>\n            `).join("")||`<tr><td colspan="9" style="text-align:center;padding:30px;color:var(--t4)">No active League accounts yet.</td></tr>`}\n          </tbody>\n        </table>\n      </div>\n    </div>\n  `}function renderLeagueRewards(){const s=LEAGUE.season;return`\n    <div class="card">\n      <h3 style="font-weight:900;margin-bottom:12px">Reward management</h3>\n      <p style="color:var(--t3);font-size:13px;margin-bottom:14px">Edit Top 3 reward definitions. Admin-editable. V1 placeholders are visible=false until enabled.</p>\n      ${[1,2,3].map(pos=>{const existing=LEAGUE.rewards.find(r=>Number(r.position)===pos);const r=existing||{position:pos,title:["First Place","Second Place","Third Place"][pos-1],reward_type:"cash",reward_value:"",challenge_size:"",description:"",enabled:false,visible:false};return`\n          <div class="card mb-2" style="padding:14px;background:rgba(255,255,255,.03)">\n            <div class="flex items-center justify-between mb-2">\n              <b>Position ${pos} — ${esc(r.title)}</b>\n              <small style="color:var(--t4)">${existing?'<span style="color:var(--gold)">exists</span>':"placeholder"}</small>\n            </div>\n            <div class="grid md:grid-cols-3 gap-2">\n              <div><label style="font-size:11px;color:var(--t4)">Title</label><input class="select" id="r-title-${pos}" value="${esc(r.title||"")}" style="width:100%"></div>\n              <div><label style="font-size:11px;color:var(--t4)">Reward type</label>\n                <select class="select" id="r-type-${pos}" style="width:100%">\n                  ${["cash","challenge_account","funded_opportunity","badge","certificate","other"].map(t=>`<option ${r.reward_type===t?"selected":""}>${t}</option>`).join("")}\n                </select>\n              </div>\n              <div><label style="font-size:11px;color:var(--t4)">Reward value (₦)</label><input class="select" id="r-value-${pos}" value="${esc(r.reward_value||"")}" type="number" style="width:100%"></div>\n              <div><label style="font-size:11px;color:var(--t4)">Challenge size (₦)</label><input class="select" id="r-size-${pos}" value="${esc(r.challenge_size||"")}" type="number" style="width:100%"></div>\n              <div style="grid-column:span 2"><label style="font-size:11px;color:var(--t4)">Description</label><input class="select" id="r-desc-${pos}" value="${esc(r.description||"")}" style="width:100%"></div>\n              <div class="flex items-center gap-2">\n                <label style="font-size:12px"><input type="checkbox" id="r-enabled-${pos}" ${r.enabled?"checked":""}> Enabled</label>\n                <label style="font-size:12px"><input type="checkbox" id="r-visible-${pos}" ${r.visible?"checked":""}> Visible</label>\n              </div>\n            </div>\n            <div class="mt-2 flex gap-2">\n              <button class="btn btn-gold" onclick="leagueSaveReward(${pos})">💾 Save reward</button>\n              ${existing?'<button class="btn" onclick="leagueConfirmWinner('+pos+')">Confirm winner for position '+pos+"</button>":""}\n              ${existing&&existing.status==="awarded"?'<button class="btn" onclick="leagueRecordReward(\''+existing.id+"')\">Record payment</button>":""}\n            </div>\n          </div>\n        `}).join("")}\n    </div>\n  `}function renderLeagueChampions(){return`\n    <div class="card">\n      <h3 style="font-weight:900;margin-bottom:12px">Champions archive</h3>\n      ${LEAGUE.champions.length===0?'<div class="empty">The first champions will be revealed at the end of the Founding League.</div>':`\n        <div class="table-wrap">\n          <table class="compact">\n            <thead><tr><th>Position</th><th>Nickname</th><th>Growth</th><th>Balance</th><th>Reward</th><th>Completed</th></tr></thead>\n            <tbody>\n              ${LEAGUE.champions.map(c=>`<tr>\n                <td>${c.position}</td>\n                <td>${esc(c.public_nickname||"—")}</td>\n                <td>${(Number(c.final_qualified_growth_percent||0)>=0?"+":"")+Number(c.final_qualified_growth_percent||0).toFixed(2)}%</td>\n                <td>₦${Number(c.final_balance||0).toLocaleString()}</td>\n                <td>${esc(c.reward_summary||"—")}</td>\n                <td><small>${esc(String(c.completed_at||"").slice(0,10))}</small></td>\n              </tr>`).join("")}\n            </tbody>\n          </table>\n        </div>\n      `}\n    </div>\n  `}function renderLeagueSettings(){const s=LEAGUE.season;const fields=[["show_public_leaderboard","Show public leaderboard"],["show_activity_feed","Show activity feed"],["registration_enabled","Accept new registrations"],["rewards_published","Publish rewards to public"]];return`\n    <div class="card mb-4">\n      <h3 style="font-weight:900;margin-bottom:6px">⚡ Feature Flags (global)</h3>\n      <p style="color:var(--t3);font-size:12px;margin-bottom:12px">Master switches. Flip a flag → it takes effect immediately (no Render restart). Source: <code>app_runtime_flags</code> in Supabase. Override beats env var.</p>\n      <div id="league-flags-grid" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:8px">\n        <div class="empty" style="grid-column:1/-1;color:var(--muted);font-size:12px">Loading flags…</div>\n      </div>\n      <div class="mt-3" style="display:flex;gap:8px;flex-wrap:wrap">\n        <button class="btn btn-gold" onclick="leagueFlagsFlipAll(true)">⚡ Turn ALL on</button>\n        <button class="btn" onclick="leagueFlagsFlipAll(false)">Turn all off</button>\n        <button class="btn" onclick="loadLeagueModule().then(loadLeagueFlags)">↻ Refresh</button>\n      </div>\n    </div>\n    <div class="card">\n      <h3 style="font-weight:900;margin-bottom:12px">Public display settings</h3>\n      <div class="grid md:grid-cols-2 gap-2">\n        ${fields.map(([k,label])=>`\n          <label style="display:flex;align-items:center;gap:8px;padding:10px;border:1px solid var(--line);border-radius:10px;cursor:pointer">\n            <input type="checkbox" id="league-cfg-${k}" ${s[k]?"checked":""} onchange="leaguePatch({${k}: this.checked})">\n            <span>${label}</span>\n          </label>\n        `).join("")}\n      </div>\n      <div class="grid md:grid-cols-2 gap-2 mt-3">\n        <div><label style="font-size:11px;color:var(--t4)">Hero title</label><input class="select" id="league-cfg-hero_title" value="${esc(s.hero_title||"")}" onchange="leaguePatch({hero_title: this.value})" style="width:100%"></div>\n        <div><label style="font-size:11px;color:var(--t4)">Hero kicker</label><input class="select" id="league-cfg-hero_kicker" value="${esc(s.hero_kicker||"")}" onchange="leaguePatch({hero_kicker: this.value})" style="width:100%"></div>\n        <div style="grid-column:span 2"><label style="font-size:11px;color:var(--t4)">Hero subtitle</label><input class="select" id="league-cfg-hero_subtitle" value="${esc(s.hero_subtitle||"")}" onchange="leaguePatch({hero_subtitle: this.value})" style="width:100%"></div>\n      </div>\n    </div>\n  `}const LEAGUE_FLAG_META={LEAGUE_ENABLED:{label:"Master switch (everything)",hint:"Required for all other flags. Turn this on first."},LEAGUE_PUBLIC_ENABLED:{label:"Public surface (landing page)",hint:"Hero pulse, rewards, leaderboard become live."},LEAGUE_REGISTRATION_ENABLED:{label:"New lead registration",hint:"When off, new Golden Ticket leads do not link into seasons."},LEAGUE_LEADERBOARD_ENABLED:{label:"Public leaderboard inside bootstrap",hint:"Top-N trader ranking on the public page."},LEAGUE_ACTIVITY_ENABLED:{label:"Public activity ticker",hint:"Recent events (MT5 assigned, winners, etc.) on the public page."}};async function loadLeagueFlags(){const grid=document.getElementById("league-flags-grid");if(!grid)return;try{const r=await _leagueApi("/admin/league/flags");const flags=r&&r.flags||[];if(!flags.length){grid.innerHTML='<div class="empty" style="grid-column:1/-1;color:var(--muted);font-size:12px">No flag rows. Did you run RUNTIME_FLAGS.sql?</div>';return}grid.innerHTML=flags.map(f=>{const meta=LEAGUE_FLAG_META[f.flag]||{label:f.flag,hint:""};const isOn=!!f.enabled;const sourceLabel=f.source==="override"?'<span style="color:var(--gold)">DB override</span>':'<span style="color:var(--muted)">env default</span>';return`\n        <div style="padding:14px;border:1px solid ${isOn?"rgba(34,197,94,.4)":"var(--line)"};border-radius:12px;background:${isOn?"rgba(34,197,94,.06)":"rgba(255,255,255,.02)"}">\n          <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px">\n            <b style="font-size:13px">${esc(meta.label)}</b>\n            <label style="position:relative;display:inline-block;width:42px;height:22px;cursor:pointer">\n              <input type="checkbox" ${isOn?"checked":""} onchange="leagueFlagToggle('${f.flag}', this.checked)" style="opacity:0;width:0;height:0">\n              <span style="position:absolute;inset:0;background:${isOn?"#22c55e":"#444"};border-radius:11px;transition:.2s"></span>\n              <span style="position:absolute;top:3px;left:${isOn?"23px":"3px"};width:16px;height:16px;background:#fff;border-radius:50%;transition:.2s"></span>\n            </label>\n          </div>\n          <div style="font-size:11px;color:var(--muted);line-height:1.4;margin-bottom:6px">${esc(meta.hint)}</div>\n          <div style="font-size:10px;font-family:monospace;color:var(--t4)"><code>${esc(f.flag)}</code> · ${sourceLabel}</div>\n        </div>\n      `}).join("")}catch(e){grid.innerHTML='<div class="empty" style="grid-column:1/-1;color:#fca5a5;font-size:12px">Failed to load flags: '+esc(e.message||e)+"</div>"}}async function leagueFlagToggle(flag,enabled){try{await _leagueApi("/admin/league/flags","POST",{flag:flag,enabled:enabled});toast(flag+" = "+(enabled?"ON":"OFF"),"ok");await loadLeagueFlags()}catch(e){toast("Failed: "+(e.message||e),"err")}}async function leagueFlagsFlipAll(enabled){const grid=document.getElementById("league-flags-grid");if(!grid)return;if(!confirm("Set all 5 feature flags to "+(enabled?"ON":"OFF")+"?"))return;const cards=grid.querySelectorAll('div[style*="border"]');for(const card of cards){const code=card.querySelector("code");if(!code)continue;const flag=code.textContent.trim();const cb=card.querySelector("input[type=checkbox]");if(cb&&cb.checked!==enabled){await leagueFlagToggle(flag,enabled)}}}function renderLeagueAudit(){return`\n    <div class="card">\n      <h3 style="font-weight:900;margin-bottom:12px">Audit log</h3>\n      <p style="color:var(--t3);font-size:13px;margin-bottom:14px">V1 audit trail is stdout-only (Render logs). The dedicated <code>league_audit_log</code> table is V2. To inspect V1 audit entries, run on the Render instance:<br><code style="color:var(--gold)">grep "LEAGUE_AUDIT" /var/log/...</code></p>\n      <div class="empty">No in-app audit viewer in V1.</div>\n    </div>\n  `}async function leagueAction(name){if(!LEAGUE.season){toast("No season loaded","err");return}try{LEAGUE.busy=true;renderLeague();await _leagueApi("/admin/league/seasons/"+LEAGUE.season.id+"/"+name,"POST");toast("Season action: "+name,"ok");await loadLeagueModule();renderLeague()}catch(e){toast("Action failed: "+(e.message||e),"err")}finally{LEAGUE.busy=false}}async function leaguePatch(body){if(!LEAGUE.season)return;try{await _leagueApi("/admin/league/seasons/"+LEAGUE.season.id,"PATCH",body);toast("Season updated","ok");await loadLeagueModule();renderLeague()}catch(e){toast("Patch failed: "+(e.message||e),"err")}}async function leagueBulkAction(action){const ids=Array.from(document.querySelectorAll(".league-reg-cb:checked")).map(c=>c.value);if(!ids.length){toast("Select at least one registration","err");return}const path=action==="select"?"/admin/league/"+LEAGUE.season.id+"/select":action==="waitlist"?"/admin/league/"+LEAGUE.season.id+"/waitlist":"/admin/league/"+LEAGUE.season.id+"/disqualify";const body=action==="disqualify"?{registration_id:ids[0],reason:"Bulk disqualify from admin"}:{registration_ids:ids};try{const r=await _leagueApi(path,"POST",body);const success=r&&(r.success!==undefined?r.success:ids.length);toast("Action: "+success+" succeeded","ok");await loadLeagueModule();renderLeague()}catch(e){toast("Bulk action failed: "+(e.message||e),"err")}}async function leagueAssignMT5(registrationId){try{const seasonSize=Number(LEAGUE.season.account_size||1e6);const pool=await api("/mt5_pool?status=available&limit=200");const poolArr=Array.isArray(pool)?pool:pool.accounts||pool.data||[];const candidates=poolArr.filter(m=>Number(m.account_size||0)===seasonSize||!Number(m.account_size||0));if(!candidates.length){toast("No available MT5 matches season account size ₦"+seasonSize.toLocaleString(),"err");return}const choices=candidates.slice(0,50).map(m=>`<option value="${esc(m.id)}">${esc(m.mt5_login||m.login||m.id)} (size ${m.account_size||"—"})</option>`).join("");const html=`<div style="padding:6px">\n      <div class="badge">ASSIGN MT5 — registration ${esc(registrationId)}</div>\n      <p style="margin:12px 0;color:var(--t3)">Select a fresh ₦${seasonSize.toLocaleString()} MT5 from the pool. Single-use MT5 is enforced by the backend.</p>\n      <select class="select" id="league-mt5-pick" style="width:100%">${choices}</select>\n      <div class="mt-3 flex gap-2">\n        <button class="btn btn-gold" onclick="leagueAssignMT5Confirm('${esc(registrationId)}')">Assign</button>\n        <button class="btn" onclick="this.closest('.modal-bg').remove()">Cancel</button>\n      </div>\n    </div>`;modal("Assign MT5",html)}catch(e){toast("Pool fetch failed: "+(e.message||e),"err")}}async function leagueAssignMT5Confirm(registrationId){const mt5Id=document.getElementById("league-mt5-pick").value;if(!mt5Id){toast("Pick an MT5","err");return}try{const r=await _leagueApi("/admin/league/"+LEAGUE.season.id+"/assign-mt5","POST",{registration_id:registrationId,mt5_id:mt5Id,account_size:Number(LEAGUE.season.account_size||1e6)});toast("MT5 assigned: "+(r.mt5_login||"success"),"ok");document.querySelector(".modal-bg")?.remove();await loadLeagueModule();renderLeague()}catch(e){toast("Assign failed: "+(e.message||e),"err")}}async function leagueReview(accountId,action){try{await _leagueApi("/admin/league/"+LEAGUE.season.id+"/review-ranking","POST",{trader_account_id:accountId,action:action,reason:"Admin review: "+action});toast("Reviewed: "+action,"ok");await loadLeagueModule();renderLeague()}catch(e){toast("Review failed: "+(e.message||e),"err")}}async function leagueSaveReward(pos){const body={position:pos,title:document.getElementById("r-title-"+pos).value,reward_type:document.getElementById("r-type-"+pos).value,reward_value:document.getElementById("r-value-"+pos).value?Number(document.getElementById("r-value-"+pos).value):null,challenge_size:document.getElementById("r-size-"+pos).value?Number(document.getElementById("r-size-"+pos).value):null,description:document.getElementById("r-desc-"+pos).value,enabled:document.getElementById("r-enabled-"+pos).checked,visible:document.getElementById("r-visible-"+pos).checked};try{await _leagueApi("/admin/league/seasons/"+LEAGUE.season.id+"/rewards/"+pos,"PUT",body);toast("Reward saved","ok");await loadLeagueModule();renderLeague()}catch(e){toast("Reward save failed: "+(e.message||e),"err")}}async function leagueConfirmWinner(pos){const existing=LEAGUE.rewards.find(r=>Number(r.position)===pos);if(!existing){toast("Save the reward first","err");return}const accts=LEAGUE.mt5.slice();accts.sort((a,b)=>Number(b.profit_percent||b.current_profit_percent||0)-Number(a.profit_percent||a.current_profit_percent||0));const candidates=accts.slice(0,10);if(!candidates.length){toast("No active League accounts to confirm.","err");return}const choices=candidates.map(a=>`<option value="${esc(a.id)}">${esc(a.public_nickname||a.mt5_login||a.id)} (${(Number(a.profit_percent||0)>=0?"+":"")+Number(a.profit_percent||0).toFixed(2)}%)</option>`).join("");const html=`<div style="padding:6px">\n    <div class="badge">CONFIRM POSITION ${pos} WINNER</div>\n    <p style="margin:12px 0;color:var(--t3)">Select the qualifying account for position ${pos}. The backend will look up the registration from the account.</p>\n    <select class="select" id="league-winner-pick" style="width:100%">${choices}</select>\n    <div class="mt-3 flex gap-2">\n      <button class="btn btn-gold" onclick="leagueConfirmWinnerSubmit(${pos}, '${esc(existing.id)}')">Confirm</button>\n      <button class="btn" onclick="this.closest('.modal-bg').remove()">Cancel</button>\n    </div>\n  </div>`;modal("Confirm Winner",html)}async function leagueConfirmWinnerSubmit(pos,rewardId){const accountId=document.getElementById("league-winner-pick").value;if(!accountId){toast("Pick a League account","err");return}try{await _leagueApi("/admin/league/"+LEAGUE.season.id+"/confirm-winners","POST",{positions:[{trader_account_id:accountId,position:pos,reward_id:rewardId}]});toast("Winner confirmed","ok");document.querySelector(".modal-bg")?.remove();await loadLeagueModule();renderLeague()}catch(e){toast("Confirm failed: "+(e.message||e),"err")}}async function leagueRecordReward(rewardId){const ref=prompt("Payment reference (transaction id, payout channel, etc.):","");if(ref===null)return;try{await _leagueApi("/admin/league/"+LEAGUE.season.id+"/record-reward","POST",{reward_id:rewardId,payment_reference:ref,status:"paid"});toast("Reward recorded","ok");await loadLeagueModule();renderLeague()}catch(e){toast("Record failed: "+(e.message||e),"err")}}function leagueCreateSeasonPrompt(){const html=`<div style="padding:6px">\n    <div class="badge">＋ CREATE NEW SEASON</div>\n    <div class="grid md:grid-cols-2 gap-2 mt-3">\n      <div><label style="font-size:11px;color:var(--t4)">Name</label><input class="select" id="new-season-name" placeholder="Founding League — Season 1" style="width:100%"></div>\n      <div><label style="font-size:11px;color:var(--t4)">Slug</label><input class="select" id="new-season-slug" placeholder="founding-league-season-1" style="width:100%"></div>\n      <div><label style="font-size:11px;color:var(--t4)">Season number</label><input class="select" id="new-season-num" type="number" value="1" style="width:100%"></div>\n      <div><label style="font-size:11px;color:var(--t4)">Capacity</label><input class="select" id="new-season-cap" type="number" value="50" style="width:100%"></div>\n      <div><label style="font-size:11px;color:var(--t4)">Account size (₦)</label><input class="select" id="new-season-size" type="number" value="1000000" style="width:100%"></div>\n      <div><label style="font-size:11px;color:var(--t4)">Max DD %</label><input class="select" id="new-season-dd" type="number" value="20" style="width:100%"></div>\n      <div><label style="font-size:11px;color:var(--t4)">Min trading days</label><input class="select" id="new-season-days" type="number" value="5" style="width:100%"></div>\n      <div><label style="font-size:11px;color:var(--t4)">Status</label>\n        <select class="select" id="new-season-status" style="width:100%">\n          <option>draft</option><option>registration_open</option><option>selection_in_progress</option>\n          <option>ready</option><option>live</option><option>under_review</option>\n          <option>completed</option><option>cancelled</option><option>archived</option>\n        </select>\n      </div>\n    </div>\n    <div class="mt-3 flex gap-2">\n      <button class="btn btn-gold" onclick="leagueCreateSeasonSubmit()">Create</button>\n      <button class="btn" onclick="this.closest('.modal-bg').remove()">Cancel</button>\n    </div>\n  </div>`;modal("New Season",html)}async function leagueCreateSeasonSubmit(){const body={name:document.getElementById("new-season-name").value,slug:document.getElementById("new-season-slug").value,season_number:Number(document.getElementById("new-season-num").value||1),capacity:Number(document.getElementById("new-season-cap").value||50),account_size:Number(document.getElementById("new-season-size").value||1e6),max_drawdown_percent:Number(document.getElementById("new-season-dd").value||20),minimum_trading_days:Number(document.getElementById("new-season-days").value||5),status:document.getElementById("new-season-status").value,ranking_method:"current_balance_growth",season_type:"founding"};if(!body.name||!body.slug){toast("Name and slug required","err");return}try{await _leagueApi("/admin/league/seasons","POST",body);toast("Season created","ok");document.querySelector(".modal-bg")?.remove();await loadLeagueModule();renderLeague()}catch(e){toast("Create failed: "+(e.message||e),"err")}}
</script>

atching verified stock</p><button class="btn" data-entitlement="${e(r.id)}" onclick="npRetryPackageDelivery(this)">Retry package delivery</button><p role="status" class="np-delivery-result"></p></div>`).join(""):"<p>No package accounts are awaiting delivery on this page.</p>";node.insertAdjacentHTML("beforeend",`<div style="display:flex;gap:12px;align-items:center"><button class="btn" ${page===1?"disabled":""} onclick="npLoadPackageDeliveries(${page-1})">Previous</button><span>Page ${e(page)}</span><button class="btn" ${result.has_more?"":"disabled"} onclick="npLoadPackageDeliveries(${page+1})">Next</button></div>`)}catch(err){if(sequence===deliverySequence)node.innerHTML=`<p>${e(err.message)}</p><button class="btn" onclick="npLoadPackageDeliveries(${page})">Reload package deliveries</button>`}};window.npRetryPackageDelivery=async function(button){const id=button.dataset.entitlement,node=button.parentElement.querySelector(".np-delivery-result");if(!/^[a-f0-9-]{36}$/i.test(id)){node.textContent="Invalid delivery identity. Reload the list.";return}button.disabled=true;node.textContent="Checking the same delivery entitlement…";try{const result=await api("/admin/package_fulfillment/retry","POST",{entitlement_id:id});if(result.data?.waiting){node.textContent="Still waiting for matching verified stock. No account was assigned."}else if(result.data?.account_id){node.textContent="Account delivery is recorded. Refresh the trader account list.";button.textContent="Delivery recorded";return}else throw Error("Delivery was not confirmed. Reload before retrying.")}catch(err){node.textContent=err.message}finally{if(button.textContent!=="Delivery recorded")button.disabled=false}};const packageApprovalBusy=new Set;const oldApproveAndAssign=window.approveAndAssign,oldApprovePurchase=window.approvePurchase;const packagePurchase=id=>(typeof SESSION!=="undefined"?SESSION.purchases||[]:[]).find(p=>String(p.id)===String(id)&&p.package_contract_id);window.npApprovePackagePurchase=async fun ee suitable stock for every order.",telemetry_fresh:"Exact account, customer and MT5 observations no older than 3 minutes at the database snapshot time.",telemetry_attention:"Open assignments without a matching broker observation within 3 minutes. A connection check, not proof of a trading loss.",purchase_reviews:"Submitted plan payment proof still awaiting a decision. Pending proof is not collected revenue.",reset_reviews:"Submitted reset payment proof still awaiting a decision; kept separate from new plan sales.",first_account_waiting:"Approved plan purchases with no linked account or recorded assignment evidence. Exact purchase/customer links are used; check the record before assigning.",payout_reviews:"Outstanding payout requests awaiting review. Rejected, cancelled and already paid evidence takes precedence. Requests are not yet approved liabilities.",approved_payouts:"Approved payout records without a paid timestamp. Check the source account and eligibility before making payment. This queue is not filtered by the money reporting period.",open_tickets:"Support tickets still marked open, pending or in progress.",work_waiting:"Unique payment, purchase, payout and ticket records in the six queues below. A record is counted once here. Record checks and broker connection checks are separate.",approved_receipts:"Sum of saved final fees on approved, non-test, non-excluded plan and reset payments in the selected period. Uses approval date, or submission date when approval date is absent. This is recorded approval, not independently reconciled bank cash.",paid_payouts:"Payout amounts with a recorded paid timestamp in the selected period. Paid/rejected conflicts are held for reconciliation. This is not a bank statement.",record_checks:"Distinct source records with conflicting status, ownership, missing proof, amount or account links. These are checks to investigate, not automatically debts or customer actions. They can overlap operational queues.",account_history:"Histor
