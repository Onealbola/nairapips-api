function npHydrateDashboardInBackground(label, fallbackArgs){
  if(SESSION.__hydrateRecoveryRunning) return;
  SESSION.__hydrateRecoveryRunning = true;

  (async()=>{
    let lastError = null;

    try{
      await loadAll();
      SESSION.fastBootNote = '';
      renderApp();
      return;
    }catch(e){
      lastError = e;
      SESSION.__loadingAll = null;
      console.warn((label||'Dashboard')+' primary bootstrap failed', e);
    }

    const traderId = String(fallbackArgs?.traderId || SESSION.trader?.id || '').trim();
    const token = String(fallbackArgs?.token || SESSION.auth_token || '').trim();

    if(traderId && token){
      try{
        if(SESSION.adminView){
          await loadAdminViewFallback(traderId, token);
        }else{
          await loadTraderHydrationFallback(traderId, token);
          scheduleDeferredTraderData(traderId, SESSION.trader);
        }
        SESSION.fastBootNote = '';
        renderApp();
        return;
      }catch(fallbackError){
        console.warn('Immediate dashboard fallback failed', fallbackError);
        lastError = fallbackError;
      }
    }

    SESSION.fastBootNote = 'Live account data is reconnecting securely...';
    try{ renderApp(); }catch(_e){}
    await new Promise(resolve=>setTimeout(resolve, 1800));

    try{
      await loadAll();
      SESSION.fastBootNote = '';
      renderApp();
      return;
    }catch(e){
      lastError = e;
      SESSION.__loadingAll = null;
    }

    SESSION.fastBootNote = 'Live data is temporarily delayed. Refresh once or open MT5 Accounts while reconnection continues.';
    try{ renderApp(); }catch(_e){}
    console.warn('Live dashboard hydration remains delayed', lastError);
  })().finally(()=>{
    SESSION.__hydrateRecoveryRunning = false;
  });
}

async function loadAdminViewFallback(traderId, token){
  const url = API + '/trader_current_account/' + encodeURIComponent(traderId)
    + '?token=' + encodeURIComponent(token || '')
    + '&auth_token=' + encodeURIComponent(token || '')
    + '&admin_view=1&_t=' + Date.now();
  const j = await safeFetchJson(url, {cache:'no-store'}, 9000, false);
  if(!j || j.success === false) throw new Error((j && (j.error || j.message)) || 'Fallback account feed failed');
  SESSION.data = j.data || j;
  SESSION.trader = SESSION.data.trader || SESSION.trader || {id:traderId};
  SESSION.data.trader = SESSION.trader;
  SESSION.auth_token = token;
  SESSION.adminView = true;
  SESSION.bootstrap_url = '/trader_bootstrap?trader_id=' + encodeURIComponent(traderId)
    + '&token=' + encodeURIComponent(token || '')
    + '&auth_token=' + encodeURIComponent(token || '')
    + '&admin_view=1';
  SESSION.currentTab = 'dashboard';
  SESSION.lifecycleAccountId = SESSION.data.trader?.current_account_id || SESSION.data.current_account?.id || null;
  SESSION.selectedAccountId = SESSION.lifecycleAccountId || SESSION.trader?.id;
  SESSION.userSelectedAccountId = false;
  const pendingReplacements = Array.isArray(SESSION.data.pending_replacements) ? SESSION.data.pending_replacements : [];
  SESSION.allAccounts = npMergeAccountRows(
    SESSION.data.all_accounts || [],
    SESSION.data.accounts || [],
    SESSION.data.active_accounts || [],
    SESSION.data.current_account ? [SESSION.data.current_account] : [],
    pendingReplacements
  );
  SESSION.accounts = SESSION.allAccounts;
  npApplyAccountDisplaySafety();
  npEnforceFundedAuthorityLockV142();
  npFinalFundedWaitingCleanupV141();
  SESSION.trades = Array.isArray(SESSION.data.latest_trades) ? SESSION.data.latest_trades : (SESSION.trades || []);
  SESSION.snapshots = SESSION.data.latest_monitoring ? [SESSION.data.latest_monitoring] : (SESSION.snapshots || []);
  SESSION.offers = SESSION.offers || [];
  SESSION.announcements = SESSION.announcements || [];
  npHydrateAnnouncementCacheV159();
  setTimeout(()=>npRefreshAnnouncementsV159({rerender:true}),250);
  SESSION.purchases = SESSION.purchases || [];
  SESSION.payouts = SESSION.payouts || [];
  SESSION.tickets = Array.isArray(SESSION.data.tickets) ? SESSION.data.tickets : (SESSION.tickets || []);
  SESSION.plansList = SESSION.plansList || [];
  SESSION.paymentAccounts = SESSION.paymentAccounts || [];
  scheduleDeferredTraderData(SESSION.trader.id, SESSION.trader);
}

(async function restore(){
  let bootCompleted = false;

  function forceLoginScreen(reason){
    const adminRequest = npAdminViewParamsFromUrl();
    if(adminRequest){
      console.error('Admin View boot failed; login fallback blocked.', reason || 'unknown');
      showAdminViewError(reason || new Error('Admin View could not load authorised trader data.'));
      bootCompleted = true;
      return;
    }

    try{
      console.warn('Trader boot fallback:', reason || 'unknown');
      SESSION.trader = null;
      SESSION.auth_token = null;
      SESSION.bootstrap_url = null;
      SESSION.data = null;
      SESSION.currentTab = 'dashboard';
      if(typeof showLogin === 'function'){
        showLogin();
        bootCompleted = true;
        return;
      }
    }catch(e){
      console.error('showLogin fallback failed', e);
    }

    const root = document.getElementById('root');
    if(root){
      root.innerHTML = `
        <div style="min-height:100vh;background:#050505;color:#fff;display:flex;align-items:center;justify-content:center;font-family:Arial,sans-serif">
          <div style="width:min(440px,90vw);padding:28px;border:1px solid rgba(212,175,55,.35);border-radius:18px;background:#0b0b0b;text-align:center">
            <div style="color:#d4af37;font-weight:900;letter-spacing:.12em">NAIRAPIPS</div>
            <h2 style="margin:14px 0 8px">Trader Login Required</h2>
            <p style="color:#aaa;line-height:1.5">The previous session could not be restored. Reload the page to sign in again.</p>
            <button onclick="try{sessionStorage.removeItem('np_trader')}catch(e){};location.reload()" style="margin-top:14px;padding:11px 18px;border:0;border-radius:10px;background:#d4af37;color:#000;font-weight:900;cursor:pointer">Reload Login</button>
          </div>
        </div>`;
    }
  }

  try{
    if(npStartAdminViewFromUrl()){
      bootCompleted = true;
      return;
    }

    if(npGoldenTicketFromUrl()){
      try{ sessionStorage.removeItem('np_trader'); }catch(e){}
      showLogin();
      bootCompleted = true;
      return;
    }

    let raw = null;
    try{ raw = sessionStorage.getItem('np_trader'); }catch(e){ raw = null; }

    if(raw){
      try{
        const s = JSON.parse(raw);
        if(!s || !s.trader || !s.token || !s.url){
          throw new Error('Saved trader session is incomplete');
        }
        SESSION.trader = s.trader;
        SESSION.auth_token = s.token;
        SESSION.bootstrap_url = s.url;
        SESSION.adminView = !!s.admin_view;

        npSeedFastDashboard(SESSION.trader, 'Opening dashboard. Live account data is loading...');
        renderApp();
        bootCompleted = true;
        npHydrateDashboardInBackground('Saved trader session', {traderId:SESSION.trader.id, token:SESSION.auth_token});
        return;
      }catch(e){
        console.error('Saved trader session restore failed', e);
        try{ sessionStorage.removeItem('np_trader'); }catch(_e){}
        forceLoginScreen(e);
        return;
      }
    }

    showLogin();
    bootCompleted = true;

  }catch(e){
    console.error('Trader boot failed', e);
    forceLoginScreen(e);
  }

  setTimeout(()=>{
    if(!bootCompleted){
      forceLoginScreen('Dashboard boot did not complete');
    }
  }, 13000);
})();

/* ====== RESET/WAITING LIFECYCLE SAFETY ====== */
function traderLifecycleBlocksPurchaseFallback(trader){
  const state = String(
    trader?.challenge_state || trader?.status || trader?.phase || ''
  ).trim().toLowerCase().replace(/\s+/g,'_');
  return [
    'phase1_waiting_mt5','phase2_waiting_mt5','funded_waiting_mt5',
    'waiting_for_fresh_mt5','waiting_for_phase_1','waiting_for_phase_2',
    'waiting_for_funded','reset','archived','breached','disabled','closed'
  ].some(flag => state.includes(flag));
}

/* ====== LOAD ====== */
async function loadAll(){
  if(SESSION.__loadingAll) return SESSION.__loadingAll;
  let t, tid;
  SESSION.__loadingAll = (async()=>{
  const j=await safeFetchJson(API+SESSION.bootstrap_url, {}, SESSION.adminView ? 20000 : 11000, true);
  if(!j.success) throw new Error('Failed to load');
  SESSION.data=j.data;
  if(SESSION.data?.trader){
    SESSION.trader = {...(SESSION.trader||{}), ...SESSION.data.trader};
  }
  npEnforceTemporaryPasswordScreen();
  SESSION.lifecycleAccountId=
    j.data.trader?.current_account_id
    || j.data.current_account?.id
    || null;

  // Preserve the exact Journey-Cockpit account focus. The old loadAll() reset
  // this back to current_account_id after the Admin handoff.
  const preservedAdminFocus=String(SESSION.adminFocusAccountId||'').trim();
  SESSION.selectedAccountId=preservedAdminFocus || SESSION.lifecycleAccountId || j.data.trader?.id;
  SESSION.userSelectedAccountId=!!preservedAdminFocus;

  t=SESSION.data.trader;
  tid=t.id;
  const pendingReplacements = Array.isArray(SESSION.data.pending_replacements) ? SESSION.data.pending_replacements : [];
  SESSION.data.pending_replacements = pendingReplacements;
  // Bootstrap is the only lifecycle authority. Never preserve an older account list
  // across a fresh bootstrap because it can resurrect a reset/archived lifecycle.
  SESSION.allAccounts = npMergeAccountRows(
    SESSION.data.all_accounts || [],
    SESSION.data.accounts || [],
    SESSION.data.active_accounts || [],
    SESSION.data.current_account ? [SESSION.data.current_account] : [],
    pendingReplacements
  );
  SESSION.accounts = SESSION.allAccounts;
  SESSION.previousResetActions = Array.isArray(SESSION.data.previous_reset_actions)
    ? SESSION.data.previous_reset_actions.filter(Boolean)
    : (SESSION.previousResetActions||[]);
  SESSION.previousResetRelease = SESSION.data.previous_reset_release || SESSION.previousResetRelease || '';
  npApplyAccountDisplaySafety();
  npEnforceFundedAuthorityLockV142();
  npFinalFundedWaitingCleanupV141();

  if(preservedAdminFocus){
    const focused=SESSION.allAccounts.find(a=>String(a.id||'')===preservedAdminFocus);
    if(focused){
      SESSION.selectedAccountId=preservedAdminFocus;
      SESSION.userSelectedAccountId=true;
      SESSION.data.current_account=focused;
    }
  }

  SESSION.trades = Array.isArray(SESSION.data.latest_trades) ? SESSION.data.latest_trades : (SESSION.trades || []);
  SESSION.snapshots = SESSION.data.latest_monitoring ? [SESSION.data.latest_monitoring] : (SESSION.snapshots || []);
  SESSION.offers = SESSION.offers || [];
  SESSION.announcements = SESSION.announcements || [];
  SESSION.purchases = SESSION.purchases || [];
  SESSION.payouts = SESSION.payouts || [];
  SESSION.tickets = Array.isArray(SESSION.data.tickets) ? SESSION.data.tickets : (SESSION.tickets || []);
  SESSION.plansList = SESSION.plansList || [];
  SESSION.paymentAccounts = SESSION.paymentAccounts || [];
  // First paint comes from bootstrap, then the dashboard immediately loads the
  // complete owned account portfolio so active, funded, waiting, reset and history
  // accounts are all selectable in the overview.
  scheduleDeferredTraderData(tid, t);
  })().finally(()=>{ SESSION.__loadingAll = null; });
  return SESSION.__loadingAll;
}

function scheduleDeferredTraderData(tid, t){
  if(!tid) return;

  // V143 FAST MOBILE DASHBOARD:
  // The bootstrap already carries the current account and latest monitoring.
  // Do not immediately launch the heavy full trader_accounts + offers + reset
  // bundle 50ms after login. That was competing with first paint, especially
  // on mobile and slower connections.
  if(SESSION.currentTab==='dashboard'){
    clearTimeout(SESSION.__portfolioIdleTimerV143);
    SESSION.__portfolioIdleTimerV143=setTimeout(()=>{
      if(document.hidden || SESSION.currentTab!=='dashboard') return;
      loadTraderModuleData('accounts').catch(e=>
        console.warn('V143 idle portfolio refresh deferred', e?.message||e)
      );
    }, 12000);
    return;
  }

  if(SESSION.__deferredLoading) return;
  SESSION.__deferredLoading = true;
  setTimeout(async()=>{
    try{
      await loadTraderModuleData(SESSION.currentTab||'accounts');
      renderApp();
    }catch(e){
      console.warn('Deferred trader data failed', e?.message || e);
    }finally{
      SESSION.__deferredLoading = false;
    }
  }, 120);
}

async function loadDeferredTraderData(tid, t){
  return loadTraderModuleData(SESSION.currentTab || 'dashboard');
}


const NP_COMMERCE_CACHE_KEY_V144='np_mobile_commerce_v144';
function npHydrateCommerceCacheV144(maxAgeMs=15*60*1000){
  try{
    const raw=localStorage.getItem(NP_COMMERCE_CACHE_KEY_V144);
    if(!raw) return false;
    const saved=JSON.parse(raw);
    if(!saved || !saved.at || (Date.now()-Number(saved.at))>maxAgeMs) return false;

    if(Array.isArray(saved.plans) && saved.plans.length){
      SESSION.plansList=saved.plans;
    }
    if(Array.isArray(saved.payment_accounts) && saved.payment_accounts.length){
      SESSION.paymentAccounts=saved.payment_accounts;
    }
    return !!((SESSION.plansList||[]).length);
  }catch(_e){
    return false;
  }
}

      at:Date.now(),
      plans:Array.isArray(SESSION.plansList)?SESSION.plansList:[],

const NP_ANNOUNCEMENT_CACHE_V159='nairapips_announcements_v159';

function npAnnouncementMergeV159(rows){
  const map=new Map();
  [...(SESSION.announcements||[]), ...(rows||[])].forEach(a=>{
    if(!a) return;
    const key=String(a.id||[a.subject||a.title,a.created_at||a.sent_at].join('|'));
    map.set(key,{...(map.get(key)||{}),...a});
  });
  SESSION.announcements=Array.from(map.values()).sort(
    (a,b)=>(new Date(b.created_at||b.sent_at||0).getTime()||0)-
          (new Date(a.created_at||a.sent_at||0).getTime()||0)
  ).slice(0,100);
  return SESSION.announcements;
}

function npHydrateAnnouncementCacheV159(){
  try{
    const raw=localStorage.getItem(NP_ANNOUNCEMENT_CACHE_V159);
    if(!raw) return;
    const data=JSON.parse(raw);
    if(data && Array.isArray(data.rows)) npAnnouncementMergeV159(data.rows);
  }catch(_e){}
}

function npStoreAnnouncementCacheV159(){
  try{
    localStorage.setItem(NP_ANNOUNCEMENT_CACHE_V159,JSON.stringify({
      at:Date.now(),
      rows:(SESSION.announcements||[]).slice(0,100)
    }));
  }catch(_e){}
}

async function npRefreshAnnouncementsV159({rerender=true}={}){
  const t=SESSION.data?.trader||SESSION.trader||{};
  const tid=String(t.id||'').trim();
  if(!tid || SESSION.__announcementRefreshV159) return SESSION.announcements||[];

  SESSION.__announcementRefreshV159=true;
  try{
    const r=await safeFetchJson(
      API+'/trader_announcements_v159?trader_id='+encodeURIComponent(tid)+'&_t='+Date.now(),
      {cache:'no-store'},
      6500,
      false
    );
    const rows=Array.isArray(r)?r:(r?.announcements||r?.data?.announcements||r?.data||[]);
    if(Array.isArray(rows)){
      npAnnouncementMergeV159(rows);
      npStoreAnnouncementCacheV159();
    }
    if(rerender && (SESSION.currentTab==='announcements' || SESSION.currentTab==='dashboard')){
      renderApp();
    }
    return SESSION.announcements||[];
  }catch(e){
    console.warn('V159 announcement refresh deferred',e?.message||e);
    return SESSION.announcements||[];
  }finally{
    SESSION.__announcementRefreshV159=false;
  }
}


const NP_PAYOUT_CACHE_PREFIX_V161='np_payout_history_v161_';

function npPayoutCacheKeyV161(){
  const tid=String(SESSION.data?.trader?.id||SESSION.trader?.id||'').trim();
  return tid ? NP_PAYOUT_CACHE_PREFIX_V161+tid : '';
}

function npHydratePayoutCacheV161(maxAgeMs=30*60*1000){
  try{
    const key=npPayoutCacheKeyV161();
    if(!key) return false;
    const raw=localStorage.getItem(key);
    if(!raw) return false;
    const saved=JSON.parse(raw);
    if(!saved || !saved.at || Date.now()-Number(saved.at)>maxAgeMs || !Array.isArray(saved.rows)) return false;
    const map=new Map();
    [...(SESSION.payouts||[]),...saved.rows].forEach(p=>{
      if(!p) return;
      const k=String(p.id||[p.mt5_login,p.amount,p.requested_at||p.created_at].join('|'));
      map.set(k,{...(map.get(k)||{}),...p});
    });
    SESSION.payouts=Array.from(map.values());
    return true;
  }catch(_e){ return false; }
}

function npStorePayoutCacheV161(){
  try{
    const key=npPayoutCacheKeyV161();
    if(!key) return;
    localStorage.setItem(key,JSON.stringify({
      at:Date.now(),
      rows:(SESSION.payouts||[]).slice(0,200)
    }));
  }catch(_e){}
}

async function loadTraderModuleData(tab){
  SESSION.moduleLoaded = SESSION.moduleLoaded || {};
  SESSION.moduleLoading = SESSION.moduleLoading || {};
  const t = SESSION.data?.trader || {};
  const tid = t.id;
  const authQS = '';
  // Financial state is always refreshed when Payouts is opened.
  if(tab==='payouts') SESSION.moduleLoaded.payouts=false;

  // V159: announcements are a priority communication channel.
  // Never let a previous moduleLoaded flag hide a newly published broadcast.
  if(tab==='announcements'){
    npHydrateAnnouncementCacheV159();
    SESSION.moduleLoaded.announcements=true;
    setTimeout(()=>npRefreshAnnouncementsV159({rerender:true}).catch(()=>{}),0);
  }
  if(!tid || SESSION.moduleLoaded[tab] || SESSION.moduleLoading[tab]) return;
  SESSION.moduleLoading[tab] = true;
  try{
    if(['dashboard','accounts','mt5vault','progress'].includes(tab)){
      const [j, offerResponse, resetResponse, previousResetResponse] = await Promise.all([
        safeFetchJson(API+'/trader_accounts?trader_id='+encodeURIComponent(tid)+'&limit=200'+authQS, {}, 12000, true),
        safeFetchJson(
          API+'/private_offers_for_trader?trader_id='+encodeURIComponent(tid)
          +'&email='+encodeURIComponent(t.email||'')
          +'&phone='+encodeURIComponent(t.phone||'')
          +'&account_reference='+encodeURIComponent(t.account_reference||'')
          +'&fresh='+Date.now()+authQS,
          {cache:'no-store'}, 6500, true
        ).catch(()=>({offers:[]})),
        safeFetchJson(API+'/trader_reset_opportunities?trader_id='+encodeURIComponent(tid)+'&_t='+Date.now(), {cache:'no-store'}, 7000, false).catch(()=>({opportunity:null})),
        safeFetchJson(API+'/trader_previous_reset_actions?trader_id='+encodeURIComponent(tid)+'&_t='+Date.now(), {cache:'no-store'}, 8000, false).catch(()=>({actions:[]}))
      ]);
      const serverPrimary = resetResponse && (resetResponse.opportunity || resetResponse.data?.opportunity) || null;
      const serverRows = resetResponse && (
        resetResponse.opportunities || resetResponse.data?.opportunities
      ) || (serverPrimary ? [serverPrimary] : []);

      SESSION.resetOpportunities = npMergeResetOpportunities(serverRows);
      SESSION.resetOpportunity = SESSION.resetOpportunities[0] || serverPrimary || null;
      SESSION.resetAuthorityRelease = resetResponse?.release || resetResponse?.data?.release || '';
      SESSION.resetAuthorityDiagnostics = resetResponse?.diagnostics || resetResponse?.data?.diagnostics || [];
      SESSION.resetAuthorityError = resetResponse?.success===false
        ? String(resetResponse?.error||resetResponse?.message||'Recovery authority endpoint failed')
        : '';

      const optionalPreviousRows = (
        previousResetResponse?.actions
        || previousResetResponse?.data?.actions
        || []
      ).filter(Boolean);

      // /trader_bootstrap is primary. Optional endpoint failure must never
      // erase a valid reset card already delivered by bootstrap.
      if(optionalPreviousRows.length){
        const byAccount=new Map(
          (SESSION.previousResetActions||[]).map(a=>[
            String(a.account_id||a.source_account_id||''),
            a
          ])
        );
        optionalPreviousRows.forEach(a=>{
          const id=String(a.account_id||a.source_account_id||'');
          if(id) byAccount.set(id,a);
        });
        SESSION.previousResetActions=[...byAccount.values()];
      }
      SESSION.previousResetRelease = (
        previousResetResponse?.release
        || previousResetResponse?.data?.release
        || SESSION.previousResetRelease
        || SESSION.data?.previous_reset_release
        || ''
      );

      let rows = Array.isArray(j) ? j : (j.data || j.trader_accounts || j.accounts || []);
      rows = rows.filter(a => String(a.trader_id||'') === String(tid));
      if(rows.length){
        SESSION.allAccounts = npMergeAccountRows(
          SESSION.allAccounts||[],
          SESSION.data?.pending_replacements||[],
          rows,
          // Bootstrap current_account is the server-authoritative live lifecycle.
          // Merge it LAST so the delayed trader_accounts refresh cannot overwrite
          // a freshly assigned/reset MT5 with an older/stale copy of the same row.
          SESSION.data?.current_account ? [SESSION.data.current_account] : []
        );
        // The raw trader_accounts endpoint contains history rows but not virtual
        // reset placeholders. Re-merge bootstrap pending replacements after it
        // refreshes so the selector cannot lose WAITING FOR FRESH MT5.
        SESSION.allAccounts = npMergeAccountRows(
          SESSION.allAccounts||[],
          SESSION.data?.pending_replacements||[]
        );
        const authorityId=String(SESSION.lifecycleAccountId||SESSION.data?.current_account?.id||'');
        const exact=authorityId ? rows.find(a=>String(a.id||'')===authorityId) : null;
        if(exact) SESSION.data.current_account={...(SESSION.data.current_account||{}),...exact};
        npApplyAccountDisplaySafety();
  npEnforceFundedAuthorityLockV142();
        npFinalFundedWaitingCleanupV141();
      }

      const incomingOffers = Array.isArray(offerResponse)
        ? offerResponse
        : (offerResponse && (offerResponse.offers || offerResponse.data || [])) || [];

      // Keep the dedicated private-offer endpoint as the offer authority.
      // Do not clear a previously loaded offer merely because another dashboard
      // refresh response omitted the offers collection.
      if(incomingOffers.length || !(SESSION.offers||[]).length){
        SESSION.offers = incomingOffers;
      }
    }
    if(tab === 'trades'){
      const tradeLogins = Array.from(new Set([
        ...(SESSION.allAccounts||[]).map(a=>String(a.mt5_login||'').trim()),
        String(SESSION.data?.current_account?.mt5_login||'').trim(),
        String(t.mt5_login||'').trim()
      ].filter(Boolean)));
      const rows = await safeFetchJson(API+'/trader_trades?trader_id='+encodeURIComponent(tid)+'&mt5_login='+encodeURIComponent(tradeLogins.join(','))+'&limit=300'+authQS, {}, 12000, true);
      if(Array.isArray(rows)) SESSION.trades = rows;
    }
    if(['purchase','plans'].includes(tab)){
      SESSION.commerceLoadError='';

      // V161 MOBILE FAST:
      // Paint cached plans/payment details instantly. Never make the Plans or
      // Purchase screen wait on Render before becoming usable.
      const hadCache=npHydrateCommerceCacheV144();

      // Live catalogue refresh happens in background.
      npRefreshCommerceV161({rerender:true}).catch(()=>{});

      // Purchase history is also background-only.
      safeFetchJson(
        API+'/trader_challenge_purchases?trader_id='+encodeURIComponent(tid)+'&_t='+Date.now()+authQS,
        {cache:'no-store'},
        5000,
        false
      ).then(purchases=>{
        const purchaseRows=Array.isArray(purchases)
          ? purchases
          : (purchases&&(purchases.purchases||purchases.data||[]))||[];
        SESSION.purchases=purchaseRows.filter(p=>
          String(p.trader_id||'')===String(tid) ||
          (t.email && String(p.email||'').toLowerCase()===String(t.email||'').toLowerCase())
        );
      }).catch(e=>console.warn('V161 purchase history deferred',e?.message||e));

      // If there is no cache, leave the screen in a lightweight loading state;
      // background refresh will repaint as soon as the compact catalogue arrives.
      if(!hadCache && !(SESSION.plansList||[]).length){
        SESSION.commerceLoadError='';
      }
    }
    if(tab === 'payouts'){
      const payoutSelectedAccountId=String(SESSION.selectedAccountId||'').trim();
      const payoutUserSelected=!!SESSION.userSelectedAccountId;
      SESSION.payoutLoadError='';

      // V161: show last verified payout ledger immediately on mobile.
      npHydratePayoutCacheV161();

      // Financial ledger is the priority request.
      try{
        const pj=await safeFetchJson(
          API+'/trader_payout_history?trader_id='+encodeURIComponent(tid)+'&limit=200&_t='+Date.now()+authQS,
          {cache:'no-store'}, 5500, false
        );
        const rows=Array.isArray(pj)?pj:(pj&&(pj.payouts||pj.data||[]))||[];
        if(rows.length){
          const payoutMap=new Map();
          [...(SESSION.payouts||[]),...rows].forEach(p=>{
            const key=String(p.id||[p.trader_id,p.mt5_login,p.amount,p.requested_at||p.created_at].join('|'));
            payoutMap.set(key,{...(payoutMap.get(key)||{}),...p});
          });
          SESSION.payouts=Array.from(payoutMap.values());
          npStorePayoutCacheV161();
          if(SESSION.currentTab==='payouts') renderApp();
        }
      }catch(e){
        if(!(SESSION.payouts||[]).length){
          SESSION.payoutLoadError='Payout history could not be refreshed. Please retry.';
        }
        console.warn('V161 payout ledger deferred',e?.message||e);
      }

      // Full account enrichment must never hold up payout history.
      safeFetchJson(
        API+'/trader_accounts?trader_id='+encodeURIComponent(tid)+'&limit=200&_t='+Date.now()+authQS,
        {cache:'no-store'}, 7000, true
      ).then(aj=>{
        let accounts=Array.isArray(aj)?aj:(aj&&(aj.data||aj.trader_accounts||aj.accounts||[]))||[];
        accounts=accounts.filter(a=>String(a.trader_id||'')===String(tid));
        if(!accounts.length) return;

        SESSION.allAccounts=npMergeAccountRows(
          SESSION.allAccounts||[],
          SESSION.data?.current_account ? [SESSION.data.current_account] : [],
          SESSION.data?.pending_replacements||[],
          accounts
        );
        SESSION.accounts=SESSION.allAccounts;

        const authorityId=String(SESSION.lifecycleAccountId||SESSION.data?.current_account?.id||'');
        const exact=authorityId ? accounts.find(a=>String(a.id||'')===authorityId) : null;
        if(exact) SESSION.data.current_account={...(SESSION.data.current_account||{}),...exact};

        npApplyAccountDisplaySafety();
        npEnforceFundedAuthorityLockV142();

        if(payoutSelectedAccountId){
          const keep=npGlobalSelectableAccounts().find(x=>String(x.id||'')===payoutSelectedAccountId);
          if(keep){
            SESSION.selectedAccountId=payoutSelectedAccountId;
            SESSION.userSelectedAccountId=payoutUserSelected;
            SESSION.data.current_account=keep;
          }
        }
        if(SESSION.currentTab==='payouts') renderApp();
      }).catch(e=>console.warn('V161 payout account enrichment deferred',e?.message||e));
    }
    if(tab === 'announcements'){
      npRefreshAnnouncementsV159({rerender:true}).catch(()=>{});
      safeFetchJson(API+'/private_offers_for_trader?trader_id='+encodeURIComponent(tid)
        +'&email='+encodeURIComponent(t.email||'')
        +'&phone='+encodeURIComponent(t.phone||'')
        +'&account_reference='+encodeURIComponent(t.account_reference||'')
        +'&fresh='+Date.now()+authQS,
        {cache:'no-store'},5000,true
      ).then(o=>{
        const incoming=Array.isArray(o)?o:(o&&(o.offers||o.data||[]))||[];
        if(incoming.length){
          const m=new Map();
          [...(SESSION.offers||[]),...incoming].forEach(x=>m.set(String(x.id||[x.subject||x.title,x.created_at].join('|')),x));
          SESSION.offers=Array.from(m.values());
          if(SESSION.currentTab==='announcements') renderApp();
        }
      }).catch(()=>{});
    }
    if(tab === 'timeline'){
      const rows = await safeFetchJson(API+'/monitoring_snapshots?trader_id='+encodeURIComponent(tid)+'&limit=200'+authQS, {}, 12000, true);
      SESSION.snapshots = Array.isArray(rows) ? rows : (rows&&(rows.snapshots||rows.data||[]))||[];
    }
    if(tab === 'offers'){
      const o=await safeFetchJson(
        API+'/private_offers_for_trader?trader_id='+encodeURIComponent(tid)
        +'&email='+encodeURIComponent(t.email||'')
        +'&phone='+encodeURIComponent(t.phone||'')
        +'&account_reference='+encodeURIComponent(t.account_reference||'')
        +'&fresh='+Date.now()+authQS,
        {cache:'no-store'},5000,true
  );

      const incomingOffers=Array.isArray(o)
        ? o
        : (o&&(o.offers||o.data||[]))||[];

      // The Offers-tab request must never erase an offer already loaded by the
      // dashboard just because a slower or differently-filtered response is empty.
      // Replace only when the endpoint returns rows, or when no prior authority
      // exists in memory.
      if(incomingOffers.length || !(SESSION.offers||[]).length){
        SESSION.offers=incomingOffers;
      }
    }
    if(tab === 'support'){
      const sj = await safeFetchJson(API+'/trader_support_tickets?trader_id='+encodeURIComponent(tid)+'&_t='+Date.now()+authQS, {cache:'no-store'}, 12000, true);
      const tickets = Array.isArray(sj) ? sj : (sj && (sj.tickets || sj.support_tickets || sj.data || [])) || [];
      SESSION.tickets = tickets.filter(x=>String(x.trader_id||'')===String(tid) || !x.trader_id);
    }
    SESSION.moduleLoaded[tab] = true;
  }catch(e){
    // V123: a recoverable Payout refresh failure must resolve the loading state.
    // Preserve the last verified ledger/accounts and expose a retry state instead of infinite buffering.
    if(tab==='payouts'){
      SESSION.payoutLoadError=SESSION.payoutLoadError || 'Payout information could not be refreshed. Please retry.';
      SESSION.moduleLoaded[tab]=true;
      console.warn('Payout module refresh failed', e?.message||e);
      return;
    }
    throw e;
  }finally{
    SESSION.moduleLoading[tab] = false;
  }
}


async function npWaitForSupabaseRealtimeV163(maxMs=5000){
  const started=Date.now();
  while(Date.now()-started<maxMs){
    if(window.supabase && typeof window.supabase.createClient==='function') return true;
    await new Promise(r=>setTimeout(r,100));
  }
  return false;
}

async function npStartAnnouncementRealtimeV163(){
  if(SESSION.__announcementRealtimeV163) return;

  const ready=await npWaitForSupabaseRealtimeV163();
  if(!ready){
    console.warn('V163 announcement realtime client unavailable; one-time refreshes remain active.');
    return;
  }

  try{
    const client=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{
      auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false},
      realtime:{params:{eventsPerSecond:2}}
    });

    const channel=client
      .channel('nairapips-announcements-v163')
      .on(
        'postgres_changes',
        {event:'*',schema:'public',table:'announcements'},
        ()=>{
          // Realtime event is only the wake-up signal.
          // Fetch the authenticated trader-safe announcement feed for actual content.
          npRefreshAnnouncementsV159({rerender:true}).catch(()=>{});
        }
      )
      .subscribe((status)=>{
        if(status==='SUBSCRIBED'){
          // One catch-up read when the socket connects/reconnects.
          npRefreshAnnouncementsV159({rerender:true}).catch(()=>{});
        }
      });

    SESSION.__announcementRealtimeV163={client,channel};
  }catch(e){
    console.warn('V163 announcement realtime start failed',e?.message||e);
  }
}

function npStartAnnouncementPollingV159(){
  // V163: no timed polling. Announcements are event-driven.
  // Keep the old function name so the rest of the dashboard does not need changing.
  npStartAnnouncementRealtimeV163().catch(()=>{});
}

function startPolling(){
  // V163: renderApp() can run many times. Realtime subscriptions and the normal
  // dashboard refresh timer must be created once, not recreated on every paint.
  if(!SESSION.__announcementTimerV159){
    npStartAnnouncementPollingV159();
  }
  if(!SESSION.refreshTimer){
    SESSION.refreshTimer=setInterval(async()=>{
      try{
        await lightweightRefresh();
      }catch(e){console.warn('poll failed',e.message);}
    },90000);
  }
}

/* ====== APP ====== */
// Single, idempotent auto-pop orchestrator. Call as many times as you want —
// internal cool-down + per-offer "already shown" tracker guarantee one popup
// per offer per 24h, regardless of how many polls / re-renders fire.
const _NP_POP_COOLDOWN_MS = 60_000;             // second call within 60s = no-op
const _NP_SHOWN_TTL_MS    = 24 * 60 * 60_000;   // remember dismissed offers for 24h
const _NP_POP_DEFER_MS    = 1200;               // let dashboard frame paint first
const _np_shown_key       = '__np_shown_offers_v3';
let   _np_last_pop_attempt = 0;

function _np_load_shown(){
  const out = new Set();
  try{
    const now = Date.now();
    const raw = localStorage.getItem(_np_shown_key);
    if(!raw) return out;
    const obj = JSON.parse(raw);
    const cleaned = {};
    for(const [id, ts] of Object.entries(obj)){
      if(now - ts < _NP_SHOWN_TTL_MS){ out.add(id); cleaned[id] = ts; }
    }
    localStorage.setItem(_np_shown_key, JSON.stringify(cleaned));
  }catch(e){}
  return out;
}
function _np_mark_shown(id){
  if(!id) return;
  try{
    const raw = localStorage.getItem(_np_shown_key) || '{}';
    const obj = JSON.parse(raw);
    obj[id] = Date.now();
    localStorage.setItem(_np_shown_key, JSON.stringify(obj));
  }catch(e){}
}

async function _np_maybe_pop_offer(){
  try{
    const now = Date.now();
    // (1) global debounce — duplicate triggers inside the window are no-ops
    if(now - _np_last_pop_attempt < _NP_POP_COOLDOWN_MS) return;
    _np_last_pop_attempt = now;
    // (2) bail if a modal is already on screen
    if(document.querySelector('.modal-bg')) return;
    if(window.__np_offer_modal_opened && (now - window.__np_offer_modal_opened) < 5000) return;

    // (3) sequential: AWAIT the fetch — never fire-and-forget, never race the cache
    await fetchTargetedOffers();

    // (4) re-check modal state after the await (something else may have popped during fetch)
    if(document.querySelector('.modal-bg')) return;

    if(!SESSION.targetedOffers || !SESSION.targetedOffers.length) return;
    const t = SESSION.data?.trader;
    if(!t) return;

    // (5) build redeemed set (includes partner_code + referral_code)
    const redeemed = new Set();
    if(SESSION.purchases && Array.isArray(SESSION.purchases)){
      for(const p of SESSION.purchases){
        if(p && p.payment_status === 'approved'){
          const code = (p.promo_code || p.affiliate_code || p.partner_code || p.referral_code || '').toString().toUpperCase();
          if(code) redeemed.add(code);
        }
      }
    }

    // (6) pick newest UNREDEEMED + NOT-ALREADY-SHOWN offer
    const shown = _np_load_shown();
    const candidates = (SESSION.targetedOffers || [])
      .filter(o => {
        if(!o || !o.id) return false;
        if(!npOfferIsUsable(o)) return false;
        if(shown.has(o.id)) return false;
        const code = (o.offer_code || o.promo_code || '').toString().toUpperCase();
        if(code && redeemed.has(code)) return false;
        return true;
      })
      .sort((a,b) => new Date(b.created_at||0) - new Date(a.created_at||0));
    if(!candidates.length) return;
    const o = candidates[0];

    // (7) mark BEFORE the deferred pop so re-entrant renders can't trigger again
    _np_mark_shown(o.id);

    // (8) UX stagger: let the dashboard paint first
    setTimeout(()=>{
      if(document.querySelector('.modal-bg')) return;
      try{ showOfferDetails(o.id); }
      catch(e){ console.warn('autopop suppressed:', e); }
    }, _NP_POP_DEFER_MS);
  }catch(e){
    console.warn('autopop suppressed:', e);
  }
}

  safeFetchJson(API+'/trader/league_accounts', {}, 4000, true).then(j=>{

    const acc = list.find(x => String(x.id||x.season_id||'') === String(accountId) || String(x.season_id||'') === String(accountId)) || list[0];

function npExplicitAttachedReplacementAccounts(){
  const rows=npMergeAccountRows(
    SESSION.data?.all_accounts||[],
    SESSION.data?.accounts||[],
    SESSION.data?.active_accounts||[],
    SESSION.allAccounts||[]
  ).filter(Boolean);

  const byId=new Map(rows.map(a=>[String(a.id||'').trim(),a]));
  const result=[];
  const seen=new Set();

  const acceptChild=(child, sourceId='')=>{
    if(!child) return;
    const id=String(child.id||'').trim();
    const login=String(child.mt5_login||child.login||'').trim();
    if(!id || !login || seen.has(id)) return;

    const blob=[
      child.account_status,child.status,child.lifecycle_state,child.challenge_state,
      child.archive_reason,child.breach_reason
    ].join(' ').toLowerCase();
    const terminal =
      !!child.breached_at || !!child.breach_at ||
      !!child.mt5_access_disabled ||
      blob.includes('breach') ||
      blob.includes('closed') ||
      blob.includes('disabled');
    if(terminal) return;

    const source=sourceId ? byId.get(sourceId) : null;
    const stage=String(
      child.stage||child.phase||source?.stage||source?.phase||''
    ).toLowerCase();
    const normalized={
      ...child,
      _np_original_account_status:child.account_status||child.status||'',
      _np_explicit_attached_replacement:true,
      _np_replacement_source_account_id:sourceId||''
    };
    if(stage.includes('funded')){
      normalized.stage='funded';
      normalized.account_status='funded_active';
      normalized.status='funded_active';
      normalized.lifecycle_state='funded_active';
    }else if(stage.includes('phase2')){
      normalized.stage='phase2';
      normalized.account_status='phase2_active';
      normalized.status='phase2_active';
      normalized.lifecycle_state='phase2_active';
    }else{
      normalized.stage='phase1';
      normalized.account_status='phase1_active';
      normalized.status='phase1_active';
      normalized.lifecycle_state='phase1_active';
    }
    seen.add(id);
    result.push(normalized);
  };

  // V131 PRIMARY: child -> source fields written by the assignment backend.
  for(const child of rows){
    const sourceIds=[
      child?.replaces_trader_account_id,
      child?.previous_trader_account_id,
      child?.reset_source_account_id,
      child?.source_account_id,
      child?.replaces_account_id
    ].map(v=>String(v||'').trim()).filter(Boolean);

    for(const sourceId of sourceIds){
      if(byId.has(sourceId)) acceptChild(child, sourceId);
    }
  }

  // Compatibility: source -> child fields used by later consumption markers.
  for(const source of rows){
    const ids=[
      source?.reset_replacement_account_id,
      source?.replacement_account_id,
      source?.successor_account_id
    ].map(v=>String(v||'').trim()).filter(Boolean);

    for(const id of ids){
      acceptChild(byId.get(id), String(source.id||'').trim());
    }
  }

  // V140: old Funded reset rows may be missing link columns even though the
  // replacement already exists. A unique later same-size Funded MT5 takes over.
  for(const wait of (SESSION.data?.pending_replacements||[])){
    const child=npUniqueFundedSuccessorForWaitingV140(wait);
    const id=String(child?.id||'').trim();
    if(child && id && !seen.has(id)){
      seen.add(id);
      result.push(child);
    }
  }

  return result;
}

function npExplicitPayoutRenewalWaitingOpportunity(){
  const ops=npAllResetOpportunities();
  const explicit=ops.find(op=>{
    const blob=[
      op?.kind,op?.reason,op?.title,op?.subtitle,
      op?.authority,op?.authority_source,op?.state
    ].join(' ').toLowerCase();
    return (
      blob.includes('post_payout_renewal') ||
      blob.includes('payout renewal') ||
      blob.includes('payout_renewal')
    );
  });
  if(explicit && !npRecoveryEntitlementAlreadyFulfilled(explicit)) return explicit;

  // Bootstrap may carry the same verified obligation directly as a pending row.
  const pending=(SESSION.data?.pending_replacements||[]).find(row=>{
    const blob=[
      row?.reason,row?.archive_reason,row?.admin_note,row?._source,
      row?.account_status,row?.status,row?.lifecycle_state
    ].join(' ').toLowerCase();
    return (
      blob.includes('post_payout_renewal') ||
      blob.includes('payout renewal') ||
      blob.includes('payout_renewal')
    ) && !npRecoveryEntitlementAlreadyFulfilled(row);
  });
  return pending || null;
}

function npTraderWaitingForFreshFundedMt5(){

    if(npIsPassed(a) || npIsBreached(a) || npIsResetArchive(a) || npIsTerminalHistory(a)) return false;
    if(
      s==='archived' ||
      s.startsWith('archived_') ||
      s.includes('breach') ||
      s.includes('reset') ||
      s.includes('closed') ||
      s.includes('completed')
    ) return false;

    const bucket=mt5Bucket(a);
    return bucket==='active' || bucket==='funded';
  });

  // Breached/reset source accounts remain in PREVIOUS/HISTORY.
  // Only live/current/waiting lifecycles belong in the active account selector.
  const merged=[
    ...attachedReplacementRows,
    ...liveBase,
    ...explicitWaiting,
    ...(paidCycleBridge ? [paidCycleBridge] : [])
  ];
  const byId=new Map();
  for(const row of merged){
    const id=String(row?.id||'').trim();
    if(!id) continue;
    if(!byId.has(id)) byId.set(id,row);
  }
  return npSortOverviewAccounts([...byId.values()]);
}

function npAccountContextLabel(a){

  const stage=String(a.waiting_for_stage||a._np_display_stage||a.stage||'phase1').toUpperCase().replace(/_/g,' ');

  const size=Number(a.account_size||a.start_balance||0);
  const moneyLabel=size ? fmt.money(size) : 'SIZE PENDING';
  if(npV121ConfirmedValidDashboardMt5(a) || a._np_explicit_attached_replacement){
    const label=stage.includes('FUNDED')?'FUNDED':'ACTIVE';
    return `🟢 ${label} · ${moneyLabel} · MT5 ${login}`;
  }
  if(a._np_reset_action_source){

    const state=k==='payment_pending'?'RESET PAYMENT UNDER REVIEW':k==='waiting'?'RESET APPROVED · WAITING FOR MT5':'RESET PAYMENT REQUIRED';
    return `🔴 ${stage} BREACHED · ${state} · ${moneyLabel} · MT5 ${login||'PENDING'}`;

  if(String(a._source||'')==='frontend_paid_cycle_waiting_bridge') return `✅ PAYOUT CYCLE CLOSED · FUNDED · ${moneyLabel} · WAITING FOR FRESH MT5`;
  if(npIsResetWaiting(a)) return `🟠 RESET · ${stage} · ${moneyLabel} · WAITING FOR FRESH MT5${a.previous_mt5_login?' · REPLACES MT5 '+a.previous_mt5_login:''}`;
  if(npIsWaitingAccount(a)){
    const wait=String(a.lifecycle_state||a.challenge_state||a.account_status||'WAITING').toUpperCase().replace(/_/g,' ');
    return `🟡 ${wait} · ${stage} · ${moneyLabel}${login?' · MT5 '+login:''}`;

  if(npIsPassed(a)){ const ps=npPassedStageLabel(a), nx=npNextWaitingLabel(a)||'WAITING FOR NEXT STAGE'; return `🔵 ${String(ps).toUpperCase()} · ${String(nx).toUpperCase()} · ${moneyLabel} · MT5 ${login||'PENDING'}`; }
  if(String(a.account_status||a.status||'').toLowerCase().includes('profit_protected')) return `🟡 FUNDED · PAYOUT UNDER REVIEW · ${moneyLabel} · MT5 ${login||'PENDING'}`;

  if(bucket==='funded') return `🟢 FUNDED · ${moneyLabel} · MT5 ${login||'PENDING'}`;
  return `🔵 ${stage} ACTIVE · ${moneyLabel} · MT5 ${login||'PENDING'}`;
}

      if(p.payment_status === 'approved'){

        if(code) redeemedCodes.add(code);

async function fetchTargetedOffers(){

          if(code) redeemedCodes.add(code);
        }

    const filterOffers = (arr) => {
      // Dedupe by code, keeping newest

      for(const o of (Array.isArray(arr) ? arr : [])){
        const code = (o.offer_code || o.promo_code || o.id || '').toString();

        if(!existing || new Date(o.created_at||0) > new Date(existing.created_at||0)){

      return Array.from(deduped.values()).filter(o => {

        if(segment === 'single' && String(o.target_trader_id||'') !== String(t.id)) return false;
        if(o.show_on_dashboard === false || o.delivery_dashboard === false) return false;
        const code = (o.offer_code || o.promo_code || '').toString().toUpperCase();
        if(code && redeemedCodes.has(code)) return false;
        return true;
      });
    };
    
    // Cache for 5s + versioned
    const now = Date.now();
    const cacheKey = '__offer_cache_v6_expiry_' + t.id;
    const cached = localStorage.getItem(cacheKey);
    if(cached){
      try{

        if(parsed.ts && (now - parsed.ts) < 5000 && Array.isArray(parsed.data)){
          SESSION.targetedOffers = filterOffers(parsed.data);
          return;
        }
      }catch(e){}
    }
    
    if(_offer_fetch_inflight) return _offer_fetch_inflight;
    
    _offer_fetch_inflight = (async ()=>{

function npBootstrapLifecycle(){
  const lc=(SESSION.data && SESSION.data.lifecycle_authority) || null;
  if(!lc) return null;

  // V8 REPLACEMENT TAKEOVER AUTHORITY:
  // A stale Second-Life waiting lifecycle must stop being the visible authority
  // once the exact entitlement has already produced a real descendant MT5.
  // The replacement/descendant account inherits the journey display position.
  if(
    lc.journey==='second_life' &&
    String(lc.state||'').toLowerCase()==='life2_waiting_mt5'
  ){
    const replacement=npEntitlementReplacementAccount(lc);
    if(replacement){
      if(!SESSION.userSelectedAccountId && replacement.id){
        SESSION.lifecycleAccountId=replacement.id;
        SESSION.selectedAccountId=replacement.id;
        if(SESSION.data) SESSION.data.current_account=replacement;
      }
      return null;
    }
  }
  return lc;
}

// ACCOUNT-SELECTION AUTHORITY — 2026-09-09
// lifecycle_authority is trader-wide bootstrap metadata. It must never override
// a deliberately selected live account from another purchase.
//
// A Second-Life waiting panel may render only when:
//   1) the selected row itself has no usable live MT5, AND
//   2) the lifecycle belongs to that selected purchase/source,
//      OR there is no concrete selected account and no live account at all.
function npLifecycleAppliesToSelectedAccount(lc, selected){
  if(!lc) return false;
  const a=selected||{};

  const login=String(a.mt5_login||'').trim();
  const status=String(a.account_status||a.status||'').toLowerCase();
  const dead=['breach','archive','closed','locked','disabled'].some(x=>status.includes(x));
  const liveStatus=['assigned_active','active','current_active','phase1_active','phase2_active','funded_active','live_active','live','funded','approved_active'].includes(status);
  const selectedIsLive=!!(login && liveStatus && !dead);

  // A real selected MT5 always wins over trader-wide waiting metadata.
  if(selectedIsLive) return false;

  const selectedId=String(a.id||'').trim();
  const selectedPurchase=String(a.purchase_id||a.challenge_purchase_id||'').trim();
  const lcPurchase=String(lc.purchase_id||lc.challenge_purchase_id||'').trim();
  const lcSource=String(lc.source_account_id||lc.trader_account_id||'').trim();

  if(selectedPurchase && lcPurchase) return selectedPurchase===lcPurchase;
  if(selectedId && lcSource) return selectedId===lcSource;

  if(lcSource){
    const source=(SESSION.allAccounts||[]).find(x=>String(x.id||'')===lcSource)||{};
    const sourcePurchase=String(source.purchase_id||source.challenge_purchase_id||'').trim();
    if(selectedPurchase && sourcePurchase) return selectedPurchase===sourcePurchase;
  }

  // Fallback only for a trader who truly has no live MT5 anywhere.
  const anyLive=(SESSION.allAccounts||[]).some(x=>{
    const xs=String(x.account_status||x.status||'').toLowerCase();
    const xl=String(x.mt5_login||'').trim();
    const xd=['breach','archive','closed','locked','disabled','reset'].some(k=>xs.includes(k));
    const xa=['assigned_active','active','current_active','phase1_active','phase2_active','funded_active','live_active','live','funded','approved_active'].includes(xs);
    return !!(xl && xa && !xd);
  });
  return !selectedId && !anyLive;
}

function npRecoveryAccount(){
  const rows=[...(SESSION.allAccounts||[])];
  const breached=rows.filter(a=>npIsBreached(a)).sort((x,y)=>new Date(y.breached_at||y.breach_at||y.updated_at||y.created_at||0)-new Date(x.breached_at||x.breach_at||x.updated_at||x.created_at||0));
  return breached[0]||null;
}
function npActiveSecondLifeContext(){
  const lc=npBootstrapLifecycle();
  if(lc && lc.journey==='second_life'){
    if(lc.state==='second_life_available') return {state:'available',lc};
    if(lc.state==='life2_waiting_mt5') return {state:'waiting',lc};
    if(lc.state==='life2_active') return {state:'active',lc};
  }
  const purchases=SESSION.data?.purchases||SESSION.data?.challenge_purchases||SESSION.purchases||[];
  const accounts=[...(SESSION.allAccounts||[]),...(SESSION.data?.accounts||[]),...(SESSION.data?.all_accounts||[])];
  for(const p of purchases||[]){
    const enabled=p.second_life_enabled===true || ['1','true','yes','enabled','active'].includes(String(p.second_life_enabled||'').toLowerCase());
    const used=p.second_life_used===true || ['1','true','yes'].includes(String(p.second_life_used||'').toLowerCase());
    const lifeNum=Number(p.life_number||1);
    if(!enabled || !used || lifeNum<2) continue;
    const pid=String(p.id||'');
    const linked=accounts.filter(a=>String(a.purchase_id||a.challenge_purchase_id||'')===pid && String(a.stage||a.phase||'').toLowerCase()==='phase1');
    const active=linked.find(a=>{
      const st=String(a.account_status||a.status||'').toLowerCase();
      const has=!!String(a.mt5_login||'').trim();
      const dead=['breach','archive','closed','locked','disabled','reset'].some(x=>st.includes(x));
      return has && !dead && (st.includes('active') || st==='assigned_active' || st==='current_active' || st==='approved_active');
    });
    if(active) return {state:'active',purchase:p,account:active};
    const sls=String(p.second_life_status||'').toLowerCase();
    if(['life2_waiting_mt5','waiting_mt5','activated'].includes(sls)) return {state:'waiting',purchase:p};
  }
  return null;
}
function npEntitlementReplacementAccount(bo){
  if(!bo) return null;

  const rows=npMergeAccountRows(
    SESSION.data?.all_accounts||[],
    SESSION.data?.active_accounts||[],
    SESSION.data?.accounts||[],
    SESSION.allAccounts||[],
    SESSION.data?.current_account ? [SESSION.data.current_account] : [],
    Array.isArray(SESSION.data?.archives) ? SESSION.data.archives : []
  ).filter(Boolean);

  const sourceId=String(
    bo.source_account_id||bo.sourceId||bo.trader_account_id||bo.previous_trader_account_id||''
  ).trim();
  const sourceLogin=String(
    bo.source_mt5_login||bo.sourceLogin||bo.previous_mt5_login||bo.replaces_mt5_login||bo.old_mt5_login||''
  ).trim();

  const source=rows.find(a=>
    (sourceId && String(a.id||'').trim()===sourceId) ||
    (sourceLogin && String(a.mt5_login||a.login||'').trim()===sourceLogin)
  ) || {};

  const purchaseId=String(
    bo.purchase_id||bo.purchaseId||bo.challenge_purchase_id||
    source.purchase_id||source.challenge_purchase_id||''
  ).trim();

  const sourceTime=new Date(
    source.archived_at||source.reset_at||source.breached_at||source.updated_at||source.assigned_at||source.created_at||0
  ).getTime()||0;

  const sourceStage=String(
    bo.stage||bo.phase||source.stage||source.phase||'phase1'
  ).toLowerCase();
  const stageRank=v=>{
    const x=String(v||'').toLowerCase();
    if(x.includes('funded')||x==='live') return 3;
    if(x.includes('phase2')) return 2;
    return 1;
  };
  const minRank=stageRank(sourceStage);

  const isLive=a=>{
    const login=String(a.mt5_login||a.login||'').trim();
    if(!login) return false;
    if(sourceLogin && login===sourceLogin) return false;
    if(sourceId && String(a.id||'').trim()===sourceId) return false;
    const blob=[
      a.account_status,a.status,a.lifecycle_state,a.challenge_state,
      a.risk_zone,a.archive_reason,a.breach_reason
    ].join(' ').toLowerCase();
    if(['breach','archived','closed','locked','disabled','waiting_mt5','waiting_for_mt5','awaiting_mt5'].some(x=>blob.includes(x))) return false;
    return stageRank(a.stage||a.phase)>=minRank;
  };

  const directIdRefs=a=>[
    a.replaces_trader_account_id,a.replacement_for_account_id,a.replaced_account_id,
    a.source_account_id,a.previous_trader_account_id,a.parent_account_id,
    a.reset_trader_account_id,a.entitlement_source_account_id
  ].map(v=>String(v||'').trim()).filter(Boolean);

  const directLoginRefs=a=>[
    a.replaces_mt5_login,a.previous_mt5_login,a.source_mt5_login,
    a.old_mt5_login,a.replaced_mt5_login,a.previous_login
  ].map(v=>String(v||'').trim()).filter(Boolean);

  // V125 SOURCE->CHILD TAKEOVER:
  // Some valid replacements are attached on the archived reset SOURCE row
  // rather than repeated on the child row. Resolve that exact child first.
  const sourceRow=sourceId
    ? rows.find(a=>String(a.id||'').trim()===sourceId)
    : null;
  const explicitChildIds=[
    sourceRow?.reset_replacement_account_id,
    sourceRow?.replacement_account_id,
    sourceRow?.successor_account_id,
    bo.reset_replacement_account_id,
    bo.replacement_account_id,
    bo.successor_account_id
  ].map(v=>String(v||'').trim()).filter(Boolean);

  for(const childId of explicitChildIds){
    const child=rows.find(a=>String(a.id||'').trim()===childId);
    if(child && isLive(child)) return child;
  }

  const candidates=rows.filter(isLive).map(a=>{
    const pid=String(a.purchase_id||a.challenge_purchase_id||'').trim();
    const at=new Date(a.assigned_at||a.started_at||a.created_at||a.updated_at||0).getTime()||0;
    const directById=!!(sourceId && directIdRefs(a).includes(sourceId));
    const directByLogin=!!(sourceLogin && directLoginRefs(a).includes(sourceLogin));
    const samePurchase=!!(purchaseId && pid===purchaseId);
    const later=!sourceTime || !at || at>=sourceTime;
    let score=0;
    if(directById) score+=1000;
    if(directByLogin) score+=1000;
    if(samePurchase) score+=500;
    if(later) score+=100;
    score+=stageRank(a.stage||a.phase)*10;
    return {a,score,at,directById,directByLogin,samePurchase,later};
  }).filter(x=>
    x.directById || x.directByLogin || (x.samePurchase && x.later)
  );

  if(!candidates.length) return null;
  candidates.sort((x,y)=> (y.score-x.score) || (y.at-x.at));
  return candidates[0].a || null;
}

function npRecoveryEntitlementAlreadyFulfilled(bo){
  if(npEntitlementReplacementAccount(bo)) return true;
  if(!bo) return false;

  const rows=npMergeAccountRows(
    SESSION.data?.all_accounts||[],
    SESSION.data?.active_accounts||[],
    SESSION.data?.accounts||[],
    SESSION.allAccounts||[],
    Array.isArray(SESSION.data?.archives)?SESSION.data.archives:[]
  ).filter(Boolean);

  const sourceId=String(
    bo.source_account_id||bo.sourceId||bo.trader_account_id||
    bo.replaces_trader_account_id||bo.completed_account_id||''
  ).trim();
  const sourceLogin=String(
    bo.source_mt5_login||bo.sourceLogin||bo.previous_mt5_login||
    bo.replaces_mt5_login||bo.old_mt5_login||''
  ).trim();

  const source=rows.find(a=>
    (sourceId && String(a.id||'').trim()===sourceId) ||
    (sourceLogin && String(a.mt5_login||a.login||'').trim()===sourceLogin)
  ) || null;

  const sourceBlob=[
    source?.archive_reason,source?.admin_note,source?.status,source?.account_status,
    bo.archive_reason,bo.admin_note,bo.status,bo.account_status
  ].join(' ').toLowerCase();

  // Permanent completion markers from any historical assignment path.
  if(
    source?.reset_consumed_at ||
    source?.reset_replacement_account_id ||
    sourceBlob.includes('reset_consumed replacement_account_id=') ||
    sourceBlob.includes('np_consumed:paid_reset:') ||
    sourceBlob.includes('[np_reset_consumed:')
  ) return true;

  const childIds=[
    source?.reset_replacement_account_id,
    source?.replacement_account_id,
    source?.successor_account_id,
    bo.reset_replacement_account_id,
    bo.replacement_account_id,
    bo.successor_account_id
  ].map(v=>String(v||'').trim()).filter(Boolean);

  if(childIds.some(id=>{
    const child=rows.find(a=>String(a.id||'').trim()===id);
    return !!(child && String(child.mt5_login||child.login||'').trim());
  })) return true;

  // Strong fallback: same exact purchase + same reset stage + a later real MT5
  // permanently consumes the old waiting obligation, even if that replacement
  // later passed, breached, reset or archived.
  const purchaseId=String(
    bo.purchase_id||bo.purchaseId||bo.challenge_purchase_id||
    source?.purchase_id||source?.challenge_purchase_id||''
  ).trim();
  const stage=String(bo.stage||bo.waiting_for_stage||source?.stage||source?.phase||'').toLowerCase();
  const sourceTime=new Date(
    source?.archived_at||source?.reset_at||source?.updated_at||source?.created_at||0
  ).getTime()||0;

  if(purchaseId && stage){
    const rank=v=>{
      const s=String(v||'').toLowerCase();
      if(s.includes('funded')||s==='live') return 'funded';
      if(s.includes('phase2')) return 'phase2';
      return 'phase1';
    };
    const wanted=rank(stage);
    const laterSibling=rows.some(a=>{
      if(sourceId && String(a.id||'').trim()===sourceId) return false;
      const login=String(a.mt5_login||a.login||'').trim();
      if(!login || (sourceLogin && login===sourceLogin)) return false;
      const pid=String(a.purchase_id||a.challenge_purchase_id||'').trim();
      if(pid!==purchaseId || rank(a.stage||a.phase)!==wanted) return false;
      const at=new Date(a.assigned_at||a.started_at||a.created_at||a.updated_at||0).getTime()||0;
      return !sourceTime || !at || at>=sourceTime;
    });
    if(laterSibling) return true;
  }

  return false;
}
function npResetTruthy(v){
  return [true,1,'1','true','yes','on','used'].includes(
    typeof v==='string'?v.toLowerCase():v
  );
}

function npResetPriceFromPurchase(p,stage='funded'){
  p=p||{};

  // V151 CURRENT PRICE REGIME:
  // Historical purchase/reset prices are never the display authority.
  // Use today's active challenge plan for this product/size only.
  const plans=[
    ...(SESSION.plansList||[]),
    ...(SESSION.plans||[]),
    ...(SESSION.data?.plans||[]),
    ...(SESSION.data?.challenge_plans||[])
  ].filter(Boolean);

  const size=Number(
    p.account_size ||
    p._purchase_size ||
    p.size ||
    0
  );

  const purchaseName=String(
    p.plan_name ||
    p.selected_plan ||
    p.plan ||
    ''
  ).trim().toLowerCase();

  const active=plans.filter(x=>{
    const status=String(x.status||'active').trim().toLowerCase();
    const activeRow=!['inactive','disabled','archived','deleted'].includes(status);
    const planSize=Number(x.account_size||x.size||0);
    return activeRow && size>0 && Math.abs(planSize-size)<0.01;
  });

  const rowName=x=>String(x.name||x.plan_name||'').trim().toLowerCase();
  const recency=x=>String(x.updated_at||x.created_at||'');

  let rows=active.filter(x=>purchaseName && rowName(x)===purchaseName);
  if(!rows.length) rows=active.slice();
  rows.sort((a,b)=>recency(b).localeCompare(recency(a)));

  const plan=rows[0]||null;
  if(!plan) return 0;

  const isFunded=String(stage||'').toLowerCase().includes('funded');

  if(isFunded){
    const fee=Number(String(
      plan.fee ?? plan.price ?? plan.challenge_fee ?? plan.plan_fee ?? ''
    ).replace(/[₦,\s]/g,''));
    return Number.isFinite(fee)&&fee>0 ? fee*2 : 0;
  }

  const n=Number(String(plan.reset_fee??'').replace(/[₦,\s]/g,''));
  return Number.isFinite(n)&&n>0 ? n : 0;
}

function npLocalFundedResetOpportunities(){
  const accounts=(SESSION.allAccounts||SESSION.data?.all_accounts||SESSION.data?.accounts||[]).filter(Boolean);
  const purchases=(SESSION.data?.purchases||SESSION.data?.challenge_purchases||SESSION.purchases||[]).filter(Boolean);
  const timeOf=a=>new Date(
    a?.breached_at||a?.breach_at||a?.assigned_at||a?.started_at||
    a?.archived_at||a?.updated_at||a?.created_at||0
  ).getTime()||0;
  const blobOf=a=>[
    a?.account_status,a?.status,a?.risk_zone,a?.display_risk_zone,
    a?.archive_reason,a?.reset_reason,a?.breach_reason,a?.admin_note,
    a?.message,a?.lifecycle_state,a?.challenge_state
  ].join(' ').toLowerCase();
  const isBreached=a=>{
    const b=blobOf(a);
    return b.includes('breach')
      || String(a?.risk_zone||'').toLowerCase()==='breached'
      || !!a?.breached_at || !!a?.breach_at
      || Number(a?.dd_used_percent||a?.max_drawdown_used||0)>=100;
  };
  const funded=accounts.filter(a=>
    String(a.stage||a.phase||'').trim().toLowerCase()==='funded'
  );

  const byPurchase=new Map();
  funded.forEach(a=>{
    const pid=String(a.purchase_id||a.challenge_purchase_id||'').trim();
    if(!pid) return;
    if(!byPurchase.has(pid)) byPurchase.set(pid,[]);
    byPurchase.get(pid).push(a);
  });

  const out=[];
  for(const [pid,rows] of byPurchase.entries()){
    const breached=[...rows].filter(isBreached).sort((a,b)=>timeOf(b)-timeOf(a));
    const source=breached[0];
    if(!source) continue;

    const sourceTime=timeOf(source);
    const purchase=purchases.find(p=>String(p.id||'')===pid)||null;
    if(!purchase) continue; // never infer a paid right without exact root purchase

    // Old breach already followed by a later Funded MT5 -> historical only.
    if(rows.some(a=>
      String(a.id||'')!==String(source.id||'')
      && !!String(a.mt5_login||'').trim()
      && timeOf(a)>sourceTime
    )) continue;

    // Funded reset already consumed -> do not reopen.
    if(npResetTruthy(purchase.funded_reset_used)) continue;
    const exactConsumed=rows.some(rs=>{
      const b=blobOf(rs);
      const marker=
        b.includes('np_entitlement:funded_reset_paid')
        || b.includes('np_funded_breach_reset_consumed')
        || b.includes('funded_reset_paid')
        || b.includes('funded reset paid')
        || String(rs.reset_kind||'').toLowerCase()==='funded_reset_paid';
      if(!marker) return false;
      const rt=timeOf(rs);
      return rows.some(child=>
        String(child.id||'')!==String(rs.id||'')
        && !!String(child.mt5_login||'').trim()
        && timeOf(child)>rt
      );
    });
    if(exactConsumed) continue;

    const base={
      eligible:true,
      stage:'funded',
      account_size:Number(source.account_size||source.start_balance||purchase.account_size||0),
      source_account_id:String(source.id||''),
      source_mt5_login:String(source.mt5_login||''),
      purchase_id:pid,
      authority:'TRADER_LOCAL_VERIFIED_DISPLAY_FALLBACK'
    };

    const order=npLocalResetOrderForSource(source.id);
    if(order){
      const st=String(order.payment_status||order.status||'').trim().toLowerCase();
      const amount=Number(order.fee||order.amount_due||order.amount||0)
        || npResetPriceFromPurchase(purchase);
      if(['approved','paid','completed','assigned','approved_reset_waiting_mt5','reset_assigning'].includes(st)){
        out.push({...base,
          kind:'waiting',
          reason:'reset_payment_approved',
          title:'Funded Reset Approved — Fresh Funded MT5 Pending',
          subtitle:'Your exact reset payment is approved. Do not pay again. One fresh Funded MT5 is due.',
          reset_order_id:order.id,
          price:amount
        });
        continue;
      }
      if(!['rejected','cancelled','canceled','failed','expired'].includes(st)){
        out.push({...base,
          kind:'payment_pending',
          reason:'reset_payment_under_review',
          title:'Funded Reset Payment Under Review',
          subtitle:'Your payment proof has been submitted. Admin approval is required before a fresh Funded MT5 is issued.',
          reset_order_id:order.id,
          price:amount
        });
        continue;
      }
    }

    const price=npResetPriceFromPurchase(purchase,'funded');
    if(price<=0) continue; // fail closed; never display a zero/free Funded reset
    out.push({...base,
      kind:'paid_funded',
      reason:'funded_reset_payment_required',
      title:'One Funded Reset Available',
      subtitle:'This exact Funded account breached and this journey has not consumed its one Funded Reset. Payment and Admin approval are required before one fresh Funded MT5 is issued.',
      price
    });
  }

  return out.sort((a,b)=>{
    const aa=accounts.find(x=>String(x.id||'')===String(a.source_account_id||''));
    const bb=accounts.find(x=>String(x.id||'')===String(b.source_account_id||''));
    return timeOf(bb)-timeOf(aa);
  });
}

function npMergeResetOpportunities(serverRows){
  const rows=(Array.isArray(serverRows)?serverRows:[]).filter(Boolean);
  const local=npLocalFundedResetOpportunities();
  const byKey=new Map();
  const key=op=>[
    String(op?.kind||'').toLowerCase(),
    String(op?.source_account_id||op?.sourceId||''),
    String(op?.purchase_id||op?.purchaseId||''),
    String(op?.reset_order_id||'')
  ].join('|');

  rows.forEach(op=>byKey.set(key(op),op));
  local.forEach(op=>{
    // Exact local Funded workflow replaces a stale server opinion for SAME source.
    for(const [k,v] of [...byKey.entries()]){
      if(String(v?.source_account_id||v?.sourceId||'')===String(op.source_account_id||'')){
        byKey.delete(k);
      }
    }
    byKey.set(key(op),op);
  });

  const merged=[...byKey.values()];
  const priority={payment_pending:120,paid_funded:115,paid_challenge:110,free_second_life:105,waiting:80,review:40,terminal:30};
  return merged.sort((a,b)=>
    (priority[String(b?.kind||'').toLowerCase()]||0)
    -(priority[String(a?.kind||'').toLowerCase()]||0)
  );
}


SESSION.__resetPriceCacheV153 = SESSION.__resetPriceCacheV153 || {};

function npCachedResetPriceV153(accountId){
  const row=SESSION.__resetPriceCacheV153[String(accountId||'')];
  if(!row) return 0;
  if(Date.now()-Number(row.at||0) > 5*60*1000) return 0;
  return Number(row.price||0);
}

async function npFetchResetPriceV153(accountId, rerender=true){
  const id=String(accountId||'').trim();
  const t=SESSION.data?.trader||SESSION.trader||{};
  if(!id || !t?.id) return 0;

  const cached=npCachedResetPriceV153(id);
  if(cached>0) return cached;

  if(SESSION.__resetPriceInflightV153[id]){
    try{return await SESSION.__resetPriceInflightV153[id];}
    catch(_e){return 0;}
  }

  const promise=(async()=>{
    try{
      const token=encodeURIComponent(SESSION.auth_token||'');
      const qs=new URLSearchParams({
        account_id:id,
        trader_id:String(t.id),
        auth_token:String(SESSION.auth_token||''),
        _t:String(Date.now())
      });
      const r=await safeFetchJson(
        API+'/trader/reset_price_v153?'+qs.toString(),
        {cache:'no-store'},
        8000,
        false
      );
      const d=r?.data||r||{};
      const price=Number(d.price||0);
      if(price>0){
        SESSION.__resetPriceCacheV153[id]={
          price,
          at:Date.now(),
          stage:d.stage||'',
          plan_id:d.plan_id||'',
          current_challenge_fee:Number(d.current_challenge_fee||0)
        };
        if(rerender && SESSION.currentTab==='dashboard'){
          setTimeout(()=>renderApp(),0);
        }
        return price;
      }
      return 0;
    }catch(e){
      console.warn('V153 reset price lookup failed',e?.message||e);
      return 0;
    }finally{
      delete SESSION.__resetPriceInflightV153[id];
    }
  })();

  SESSION.__resetPriceInflightV153[id]=promise;
  return await promise;
}

  if(code==='PAYMENT_REQUIRED'){
    return `<button class="btn btn-gold ${compact?'btn-sm':''}" onclick="event.stopPropagation();npOpenResetPayment('${esc(String(accountId))}')">💳 RESET THIS ACCOUNT${price?` · ${fmt.money(price)}`:' · CHECKING PRICE…'}</button>`;

  return '';

      // V7 EXACT TAKEOVER FIX — a fulfilled Second-Life entitlement must hand its
      // dashboard slot to the real replacement account. The explicit recovery
      // branch already performs this check; the bootstrap lifecycle branch did not.
      // That mismatch caused a stale "Second Life Activated / Waiting for Fresh MT5"
      // card to remain underneath a real live replacement MT5.
      const fulfilledProbe={
        source_account_id:lc.source_account_id||'',
        purchase_id:lc.purchase_id||'',

      };

  const recoveryNow=npRecoveryAccount();

    recoveryNow?.purchase_id||recoveryNow?.challenge_purchase_id||''
  ).trim();

  if(recoveryPid){
    const sameJourney=(SESSION.allAccounts||[]).filter(x=>
      String(x?.purchase_id||x?.challenge_purchase_id||'').trim()===recoveryPid
    );

    const resetUsed=sameJourney.some(x=>{

        x?.archive_reason,x?.reset_reason,x?.admin_note,x?.account_status,
        x?.status,x?.lifecycle_state,x?.challenge_state,
        x?.reset_consumed_at,x?.reset_replacement_account_id

      return blob.includes('np_entitlement:funded_reset_paid')
          || blob.includes('np_funded_breach_reset_consumed')
          || blob.includes('funded_reset_paid')
          || blob.includes('funded reset paid')
          || blob.includes('funded reset already used')
          || !!x?.reset_consumed_at
          || !!x?.reset_replacement_account_id;
    });

    const latestFunded=[...sameJourney]
      .filter(x=>String(x?.stage||x?.phase||'').toLowerCase()==='funded')
      .sort((a,b)=>npProgTime(b)-npProgTime(a))[0] || null;

    if(resetUsed && latestFunded){
      const b=[
        latestFunded?.account_status,latestFunded?.status,
        latestFunded?.risk_zone,latestFunded?.archive_reason,
        latestFunded?.breach_reason
      ].join(' ').toLowerCase();

      const breached=b.includes('breach') || !!latestFunded?.breached_at;

      if(breached){
        return {
          kind:'terminal',
          title:'Journey Complete — New Challenge Required',

          sourceLogin:latestFunded?.mt5_login||'',
          price:0,
          cta:'START NEW CHALLENGE'
        };
      }
    }
  }

  // No paid-reset promotion here.
  return null;
}

function npProgTime(x){return new Date(x?.assigned_at||x?.started_at||x?.passed_at||x?.breached_at||x?.reset_at||x?.archived_at||x?.updated_at||x?.created_at||0).getTime()||0;}
function npProgBlob(x){return [x?.account_status,x?.status,x?.risk_zone,x?.archive_reason,x?.breach_reason,x?.phase_pass_status,x?.lifecycle_state,x?.challenge_state,x?.admin_note].join(' ').toLowerCase();}
function npProgState(x){
  const b=npProgBlob(x);
  if(b.includes('wrong_assignment_recalled')||b.includes('legacy_dead_account'))return 'HISTORY';
  if(b.includes('np_payout_renewal_completed')||b.includes('post_payout_renewal_consumed'))return 'PAYOUT RENEWED';
  if(b.includes('breach')||x?.breached_at)return 'BREACHED';
  if(b.includes('progression_consumed'))return 'COMPLETED';
  if(b.includes('archived_phase')||b.includes('passed')||String(x?.risk_zone||'').toLowerCase()==='passed')return 'PASSED';
  if(b.includes('waiting')||b.includes('pending_assignment')||b.includes('awaiting_mt5'))return 'WAITING';
  if(b.includes('archived_reset'))return (x?.reset_consumed_at||x?.reset_replacement_account_id)?'RESET COMPLETED':'RESET SOURCE';
  if(['active','funded'].includes(mt5Bucket(x)))return 'ACTIVE';
  return 'HISTORY';
}
function npProgPurchase(current){
  const pid=String(current?.purchase_id||current?.challenge_purchase_id||'').trim();
  return (SESSION.purchases||[]).find(p=>String(p.id||'')===pid) || SESSION.data?.active_purchase || {};
}
function npProgBool(v){return v===true||['true','1','yes','on'].includes(String(v||'').toLowerCase());}
function npProgModel(p,rows){
  const prog=[p?.programme_type,p?.program_type,p?.source,p?.purchase_type,...(rows||[]).map(x=>x?.programme_type)].join(' ').toLowerCase();
  if(prog.includes('league')||prog.includes('competition'))return {label:'TRADERS LEAGUE / COMPETITION',challenge:'N/A',funded:'N/A',payout:'N/A'};
  const second=npProgBool(p?.second_life_enabled), secondUsed=npProgBool(p?.second_life_used);
  const j=[p?.challenge_journey,p?.journey_stages,p?.route,p?.progression_route].join(' ').toLowerCase();
  const hasP2=j.includes('two_phase')||j.includes('two-phase')||j.includes('phase2')||j.includes('phase 2')||Number(p?.phase2_target||0)>0||(rows||[]).some(x=>String(x.stage||x.phase||'').toLowerCase()==='phase2');
  if(second)return {label:'1-PHASE · 2 LIVES',challenge:secondUsed?'USED':'FREE ONCE',funded:npProgBool(p?.funded_reset_used)?'USED':'PAID ONCE',payout:'UNLIMITED'};
  return {label:hasP2?'LEGACY · 2-PHASE':'1-PHASE',challenge:npProgBool(p?.challenge_reset_used)?'USED':'PAID ONCE',funded:npProgBool(p?.funded_reset_used)?'USED':'PAID ONCE',payout:'UNLIMITED'};
}
function npProgressionStrip(current){
  const all=(SESSION.allAccounts||[]).filter(Boolean);if(!all.length)return '';
  const pid=String(current?.purchase_id||current?.challenge_purchase_id||'').trim();
  let rows=pid?all.filter(x=>String(x.purchase_id||x.challenge_purchase_id||'').trim()===pid):[];
  if(!rows.length&&current?.id)rows=[current];
  rows=rows.filter(x=>{const b=npProgBlob(x);return !b.includes('wrong_assignment_recalled')&&!b.includes('legacy_dead_account');}).sort((x,y)=>npProgTime(x)-npProgTime(y));
  if(!rows.length)return '';
  const purchase=npProgPurchase(current),model=npProgModel(purchase,rows),children=new Map();
  rows.forEach(x=>{const p=String(x.previous_trader_account_id||x.replaces_trader_account_id||'').trim();if(p){if(!children.has(p))children.set(p,[]);children.get(p).push(x);}});
  const steps=rows.map(x=>{
    let state=npProgState(x);const kids=(children.get(String(x.id||''))||[]).sort((m,n)=>npProgTime(m)-npProgTime(n));
    if((state==='PASSED'||state==='RESET SOURCE')&&kids.length)state=state==='PASSED'?'COMPLETED':'RESET COMPLETED';
    const stage=String(x.stage||x.phase||'phase1').toUpperCase().replace('PHASE1','PHASE 1').replace('PHASE2','PHASE 2');
    const cls=state==='ACTIVE'?'live':(state==='WAITING'?'wait':(state==='BREACHED'?'bad':'done'));
    return `<div class="np-prog-step ${cls}"><small>${esc(stage)}</small><b>${esc(state)}</b><span>MT5 ${esc(x.mt5_login||'Pending')}</span></div>`;
  }).join('<div class="np-prog-arrow">→</div>');
  return `<section class="np-prog-strip">
    <div class="np-prog-head"><div><b>JOURNEY PROGRESSION</b><span>${esc(model.label)} · linked account history</span></div><span class="np-prog-safe">LINKED</span></div>
    <div class="np-prog-flow">${steps}</div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;font-size:9px">
      <span class="pill pill-gold">Challenge reset: ${esc(model.challenge)}</span>
      <span class="pill pill-gold">Funded breach reset: ${esc(model.funded)}</span>
      <span class="pill pill-blue">Payout renewal: ${esc(model.payout)}</span>
    </div>
  </section>`;
}

function npValidateResetProofFile(file){
  if(!file) return {ok:false,error:'Upload your payment receipt first.'};

  const allowedTypes=[
    'image/jpeg',
    'image/png',
    'image/webp',
    'application/pdf'
  ];
  const fileName=String(file.name||'').toLowerCase();
  const allowedByName=/\.(jpe?g|png|webp|pdf)$/.test(fileName);

  if((file.type && !allowedTypes.includes(String(file.type).toLowerCase())) && !allowedByName){
    return {ok:false,error:'Receipt must be JPG, PNG, WEBP or PDF.'};
  }

  const size=Number(file.size||0);
  if(size<=0){
    return {ok:false,error:'The selected receipt file is empty.'};
  }
  if(size>10*1024*1024){
    return {ok:false,error:'Receipt is too large. Maximum size is 10MB.'};
  }

  return {ok:true};
}

function npResetProofSelected(input){
  const file=input?.files?.[0]||null;
  const status=document.getElementById('np-reset-proof-status');
  if(!status) return;

  if(!file){
    status.textContent='Accepted: JPG, PNG, WEBP or PDF · Maximum 10MB.';
    status.style.color='var(--t3)';
    return;
  }

  const valid=npValidateResetProofFile(file);
  if(!valid.ok){
    status.textContent=valid.error;
    status.style.color='#f87171';
    return;
  }

  const mb=(Number(file.size||0)/(1024*1024)).toFixed(2);
  status.textContent=`Ready to upload: ${file.name} · ${mb}MB`;
  status.style.color='#86efac';
}

    });
