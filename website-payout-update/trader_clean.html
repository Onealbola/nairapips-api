async function npSubmitResetPayment(accountId){
  const op=npPreviousResetActionForAccount(accountId) || npResetOpportunityForSource(accountId);
  const t=SESSION.data?.trader||SESSION.trader||{};
  const fileInput=document.getElementById('np-reset-proof');
  const file=fileInput?.files?.[0]||null;
  const btn=document.getElementById('np-reset-submit');

  if(!op || !['paid_challenge','paid_funded'].includes(String(op.kind||'').toLowerCase())){
    toast('Reset authority changed. Refresh the dashboard before paying.','err');
    return;
  }
  if(!t?.id){
    toast('Trader session is unavailable. Reload the page and try again.','err');
    return;
  }

  const valid=npValidateResetProofFile(file);
  if(!valid.ok){
    toast(valid.error,'err');
    return;
  }

  const idemKey='np_reset_receipt_'+String(accountId||'');
  const lastSubmit=Number(sessionStorage.getItem(idemKey)||0);
  if(lastSubmit && (Date.now()-lastSubmit)<45000){
    toast('This receipt is already being submitted. Please wait.','info');
    return;
  }

  const originalText=btn?.textContent||'SUBMIT RESET PAYMENT';
  const setButton=(label,disabled=true)=>{
    if(!btn) return;
    btn.disabled=disabled;
    btn.textContent=label;
  };

  sessionStorage.setItem(idemKey,String(Date.now()));
  setButton('SECURELY UPLOADING RECEIPT...',true);

  try{
    // V55/V73: one request only. The server validates the exact reset,
    // uploads the receipt with bounded storage timeouts, then creates the
    // pending reset-payment record. No MT5 assignment occurs here.
    const fd=new FormData();
    fd.append('file',file,file.name);
    fd.append('trader_id',String(t.id));
    fd.append('source_account_id',String(accountId));
    fd.append('trader_account_id',String(accountId));

    const headers={};
    if(SESSION.auth_token){
      headers.Authorization='Bearer '+SESSION.auth_token;
    }

    const controller=new AbortController();
    const timer=setTimeout(()=>controller.abort(),70000);

    let response;
    try{
      response=await fetch(API+'/submit_reset_payment_proof_v73',{
        method:'POST',
        headers,
        body:fd,
        signal:controller.signal,
        cache:'no-store'
      });
    }catch(fetchErr){
      if(fetchErr?.name==='AbortError'){
        // Before telling the trader it failed, verify whether the server
        // actually created the pending request.
        const status=await npResetSubmissionStatusV73(accountId);
        if(status?.found){
          toast(
            status.code==='PAYMENT_APPROVED_WAITING_MT5'
              ? 'Your reset payment is already approved. Do not pay again.'
              : 'Your receipt is already on file and under review. Do not pay again.',
            'ok'
          );
          document.querySelector('.modal-bg')?.remove();
          sessionStorage.removeItem(idemKey);
          SESSION.moduleLoaded.dashboard=false;
          await loadTraderModuleData('dashboard');
          renderApp();
          return;
        }
        throw new Error(
          'Receipt upload did not complete. The storage service is taking too long. '
          +'Please retry once; the system blocks duplicate reset requests.'
        );
      }
      throw new Error(
        'Could not reach the reset payment service. Check your connection and try again.'
      );
    }finally{
      clearTimeout(timer);
    }

    const responseText=await response.text();
    let data={};
    try{
      data=responseText ? JSON.parse(responseText) : {};
    }catch(_e){
      throw new Error(
        response.ok
          ? 'Reset payment service returned an invalid response.'
          : `Reset payment service failed (${response.status}).`
      );
    }

    const payload=data?.data || data || {};
    if(!response.ok || data?.success===false || payload?.success===false){
      const message=String(
        data?.error ||
        data?.message ||
        payload?.error ||
        payload?.message ||
        `Reset receipt submission failed (${response.status})`
      );

      // Safety: if the browser sees a conflict, verify server state before
      // inviting another upload/payment.
      if(response.status===409 || /already|submitted|under review|do not pay/i.test(message)){
        const status=await npResetSubmissionStatusV73(accountId);
        if(status?.found){
          toast(
            status.code==='RESET_FULFILLED'
              ? 'This reset has already been fulfilled. Do not pay again.'
              : status.code==='PAYMENT_APPROVED_WAITING_MT5'
                ? 'Payment already approved. Do not pay again.'
                : 'Receipt already submitted and under review. Do not pay again.',
            'ok'
          );
          document.querySelector('.modal-bg')?.remove();
          sessionStorage.removeItem(idemKey);
          SESSION.moduleLoaded.dashboard=false;
          await loadTraderModuleData('dashboard');
          renderApp();
          return;
        }
      }

      throw new Error(message);
    }

    sessionStorage.removeItem(idemKey);

    toast(
      payload?.already_submitted
        ? 'Your receipt is already on file. Do not pay again.'
        : 'Receipt submitted successfully. Status: PAYMENT UNDER REVIEW.',
      'ok'
    );

    document.querySelector('.modal-bg')?.remove();
    SESSION.moduleLoaded.dashboard=false;
    await loadTraderModuleData('dashboard');
    renderApp();

  }catch(e){
    sessionStorage.removeItem(idemKey);

    const message=String(e?.message||e||'Reset receipt submission failed.');
    toast(message,'err');

    const status=document.getElementById('np-reset-proof-status');
    if(status){
      status.textContent='Upload not completed: '+message;
      status.style.color='#f87171';
    }

    if(btn){
      btn.disabled=false;
      btn.textContent=originalText;
    }
  }
}



function npJourneyTerminalNoActive(){
  // A backend-confirmed owed/free Phase-1 reset is actionable and must never be
  // hidden by an older completed Funded journey.
  const explicitRecovery=npPrimaryResetOpportunity();
  if(explicitRecovery && ['free_second_life','waiting'].includes(String(explicitRecovery.kind||'').toLowerCase())) return null;
  // EXACT TERMINAL AUTHORITY — 2026-09-10
  // Mirror the Admin progression rule: once a Funded reset source has already
  // produced a later Funded account and that later Funded account breaches,
  // that purchase journey is finished. Historical reset rows may never reopen it.
  const rows=(SESSION.allAccounts||SESSION.data?.all_accounts||SESSION.data?.accounts||[]).filter(Boolean);
  const purchases=(SESSION.data?.purchases||SESSION.data?.challenge_purchases||SESSION.purchases||[]).filter(Boolean);
  const pidOf=x=>String(x?.purchase_id||x?.challenge_purchase_id||'').trim();
  const timeOf=x=>new Date(x?.assigned_at||x?.started_at||x?.passed_at||x?.breached_at||x?.breach_at||x?.reset_at||x?.archived_at||x?.updated_at||x?.created_at||0).getTime()||0;
  const stateBlob=x=>[x?.account_status,x?.status,x?.risk_zone,x?.archive_reason,x?.reset_reason,x?.breach_reason,x?.lifecycle_state,x?.challenge_state,x?.admin_note].join(' ').toLowerCase();
  const activeStatus=new Set(['assigned_active','active','current_active','phase1_active','phase2_active','funded_active','live_active','live','approved_active','funded_profit_cap_reached']);
  const isLive=a=>{
    const st=String(a?.account_status||a?.status||'').trim().toLowerCase();
    const has=!!String(a?.mt5_login||'').trim();
    const monitoring=(a?.monitoring_enabled===true || String(a?.monitoring_enabled||'').toLowerCase()==='true');
    const capLocked=st.includes('funded_profit_cap');
    return has && (monitoring || capLocked) && (activeStatus.has(st) || capLocked)
      && !npIsResetArchive(a) && !npIsBreached(a) && !npIsWaitingAccount(a) && !npIsResetWaiting(a);
  };

  // A real live account on any independent journey always wins.
  if(rows.some(isLive)) return null;

  // A genuinely new purchase with no account rows yet starts a fresh journey.
  const freshPurchase=purchases.find(p=>{
    const id=String(p?.id||'').trim();
    if(!id) return false;
    const st=String(p?.payment_status||p?.status||'').trim().toLowerCase();
    if(['rejected','cancelled','canceled','failed','refunded','void','expired'].includes(st)) return false;
    return !rows.some(a=>pidOf(a)===id);
  });
  if(freshPurchase) return null;

  // Work from newest account backwards. This identifies the latest real journey
  // instead of letting an older archived_reset row become the dashboard authority.
  const ordered=[...rows].sort((a,b)=>timeOf(b)-timeOf(a));
  const latest=ordered[0]||{};
  const latestPid=pidOf(latest);
  const linked=latestPid ? ordered.filter(a=>pidOf(a)===latestPid) : ordered;
  const latestStage=String(latest.stage||latest.phase||'').toLowerCase();
  const latestBreached=npIsBreached(latest) || stateBlob(latest).includes('breach') || !!latest.breached_at || !!latest.breach_at;

  // Admin-equivalent funded-reset exhaustion proof:
  // 1) same purchase contains a Funded reset source (archived_reset_funded or explicit marker)
  // 2) a later Funded MT5 exists after that source
  // 3) newest account on that journey is Funded and breached
  const fundedRows=linked.filter(a=>String(a.stage||a.phase||'').toLowerCase()==='funded');
  const resetSources=fundedRows.filter(a=>{
    const b=stateBlob(a);
    const st=String(a.account_status||a.status||'').toLowerCase();
    return st==='archived_reset_funded' || st.startsWith('archived_reset_funded') ||
      b.includes('[np_entitlement:funded_reset_paid]') || b.includes('funded_reset_paid') ||
      b.includes('funded reset paid') || b.includes('paid funded reset') ||
      b.includes('reset payment approved');
  });
  const fundedResetConsumed=resetSources.some(src=>{
    const st=timeOf(src);
    return fundedRows.some(child=>
      String(child.id||'')!==String(src.id||'') &&
      !!String(child.mt5_login||'').trim() && timeOf(child)>st
    );
  });

  if(latestStage.includes('funded') && latestBreached && fundedResetConsumed){
    return {
      kind:'terminal', reason:'funded_reset_consumed_latest_funded_breached',
      title:'Journey Complete — New Challenge Required',
      subtitle:'This journey has used its Funded reset and the replacement Funded account has breached. No reset or replacement remains. Start a new Challenge to continue.',
      stage:'FUNDED', size:Number(latest.account_size||latest.start_balance||0),
      sourceId:latest.id||'', purchaseId:latestPid, sourceLogin:latest.mt5_login||'',
      price:0, cta:'START NEW CHALLENGE'
    };
  }

  // Challenge / Second-Life exhaustion: a later challenge account after a reset,
  // followed by another breach, also ends that exact purchase journey.
  const challengeRows=linked.filter(a=>!String(a.stage||a.phase||'').toLowerCase().includes('funded'));
  const challengeResetSources=challengeRows.filter(a=>{
    const b=stateBlob(a); const st=String(a.account_status||a.status||'').toLowerCase();
    return st.startsWith('archived_reset') || b.includes('second_life') || b.includes('challenge reset');
  });
  const challengeResetConsumed=challengeResetSources.some(src=>{
    const st=timeOf(src);
    return challengeRows.some(child=>String(child.id||'')!==String(src.id||'') && !!String(child.mt5_login||'').trim() && timeOf(child)>st);
  });
  if(!latestStage.includes('funded') && latestBreached && challengeResetConsumed){
    return {
      kind:'terminal', reason:'challenge_reset_consumed_latest_challenge_breached',
      title:'Journey Complete — New Challenge Required',
      subtitle:'This challenge has used its available reset / Second Life and the replacement account has breached. Start a new Challenge to continue.',
      stage:String(latest.stage||latest.phase||'PHASE 1').toUpperCase(),
      size:Number(latest.account_size||latest.start_balance||0), sourceId:latest.id||'',
      purchaseId:latestPid, sourceLogin:latest.mt5_login||'', price:0, cta:'START NEW CHALLENGE'
    };
  }

  // Backend explicit terminal state remains valid when there is no live/new journey.
  const tb=[SESSION.data?.trader?.challenge_state,SESSION.data?.trader?.lifecycle_state,SESSION.data?.trader?.journey_status,SESSION.data?.lifecycle?.state,SESSION.data?.lifecycle?.status].join(' ').toLowerCase();
  if(tb.includes('journey_complete')||tb.includes('journey complete')||tb.includes('cycle_complete')||tb.includes('exhausted')){
    return {kind:'terminal',reason:'backend_terminal',title:'Journey Complete — New Challenge Required',subtitle:'No active account or recovery opportunity remains on this journey. Start a new Challenge to continue.',stage:String(latest.stage||'FUNDED').toUpperCase(),size:Number(latest.account_size||latest.start_balance||0),sourceId:latest.id||'',purchaseId:latestPid,sourceLogin:latest.mt5_login||'',price:0,cta:'START NEW CHALLENGE'};
  }

  return null;
}

function npDDLimitFor(a){
  a=a||{};
  const direct=Number(a.dd_limit_percent||a.max_drawdown||a.total_dd||0);
  if(direct>0) return direct;
  const purchaseId=String(a.purchase_id||'');
  const planId=String(a.plan_id||a.challenge_plan_id||'');
  const planName=String(a.plan_name||a.selected_plan||'').trim().toLowerCase();
  const purchases=SESSION.data?.purchases||SESSION.data?.challenge_purchases||[];
  const purchase=(purchases||[]).find(p=>purchaseId&&String(p.id||'')===purchaseId)||null;
  const plans=SESSION.data?.plans||SESSION.data?.challenge_plans||[];
  const linkedPlan=(plans||[]).find(p=>
    (purchase?.plan_id&&String(p.id||'')===String(purchase.plan_id)) ||
    (planId&&String(p.id||'')===planId) ||
    (planName&&String(p.name||'').trim().toLowerCase()===planName) ||
    (purchase?.plan_name&&String(p.name||'').trim().toLowerCase()===String(purchase.plan_name).trim().toLowerCase())
  );
  const planDD=Number(linkedPlan?.max_drawdown||linkedPlan?.total_dd||purchase?.max_drawdown||purchase?.total_dd||0);
  return planDD>0?planDD:20;
}

function selectAccount(id){
  const a=npGlobalSelectableAccounts().find(x=>String(x.id)===String(id));

  SESSION.selectedAccountId=id;
  SESSION.userSelectedAccountId=true;
  // One selected account context is shared by every trader module.
  // Keep the chosen row authoritative; trader-wide lifecycle metadata must not
  // replace it during the same render cycle.
  SESSION.data.current_account=a;
  SESSION.lifecycleAccountId=id;
  renderApp();
  Promise.resolve(loadTraderModuleData(SESSION.currentTab)).then(()=>{
    const keep=npGlobalSelectableAccounts().find(x=>String(x.id)===String(id));

      SESSION.selectedAccountId=id;

      SESSION.data.current_account=keep;
      SESSION.lifecycleAccountId=id;
    }
    renderApp();
  }).catch(()=>{});
  toast('Viewing '+npAccountContextLabel(a),'ok');
}

function phaseTimeline(stage){
  const stages=[

    {k:'funded',label:'Funded',sub:'Get paid every 2 weeks'}

  }).join('');
}

/* ====== EQUITY CHART ====== */
function drawEquityChart(){
  const canvas=document.getElementById('equityChart');
  if(!canvas)return;
  const ctx=canvas.getContext('2d');
  const dpr=window.devicePixelRatio||1;
  const rect=canvas.getBoundingClientRect();
  canvas.width=rect.width*dpr;
  canvas.height=rect.height*dpr;
  ctx.scale(dpr,dpr);
  const W=rect.width,H=rect.height;
  ctx.clearRect(0,0,W,H);
  const a=SESSION.data.current_account||{};
  const startBal=Number(a.start_balance||a.initial_balance||SESSION.data.active_purchase?.account_size||500000);
  const snaps=SESSION.snapshots;
  if(!snaps.length){
    ctx.fillStyle='#71717a';ctx.font='12px Inter';ctx.textAlign='center';
    ctx.fillText('No trading data yet — chart will appear once monitoring starts',W/2,H/2);
    return;
  }
  const data=snaps.map(s=>Number(s.equity||s.balance||startBal)).filter(v=>v>0);
  if(!data.length)return;
  const minV=Math.min(...data,startBal)*0.998;
  const maxV=Math.max(...data,startBal)*1.002;
  const range=maxV-minV||1;
  const pad={l:8,r:8,t:14,b:24};
  const chartW=W-pad.l-pad.r,chartH=H-pad.t-pad.b;
  ctx.strokeStyle='rgba(255,255,255,.04)';ctx.lineWidth=1;
  for(let i=0;i<=4;i++){const y=pad.t+(chartH*i/4);ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(W-pad.r,y);ctx.stroke();}
  const startY=pad.t+chartH-((startBal-minV)/range)*chartH;
  ctx.strokeStyle='rgba(212,175,55,.4)';ctx.setLineDash([4,4]);ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(pad.l,startY);ctx.lineTo(W-pad.r,startY);ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle='rgba(212,175,55,.7)';ctx.font='10px JetBrains Mono';ctx.textAlign='right';
  ctx.fillText('Start ₦'+Math.round(startBal).toLocaleString(),W-pad.r,startY-4);
  const stepX=chartW/Math.max(1,data.length-1);
  const startV=startBal,lastV=data[data.length-1];
  const lastColor=lastV>=startV?'#22c55e':'#dc2626';
  const grad=ctx.createLinearGradient(0,pad.t,0,pad.t+chartH);
  grad.addColorStop(0,lastV>=startV?'rgba(34,197,94,.35)':'rgba(220,38,38,.35)');
  grad.addColorStop(1,lastV>=startV?'rgba(34,197,94,0)':'rgba(220,38,38,0)');
  ctx.beginPath();
  data.forEach((v,i)=>{const x=pad.l+i*stepX;const y=pad.t+chartH-((v-minV)/range)*chartH;if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);});
  ctx.lineTo(pad.l+(data.length-1)*stepX,pad.t+chartH);
  ctx.lineTo(pad.l,pad.t+chartH);ctx.closePath();ctx.fillStyle=grad;ctx.fill();
  ctx.beginPath();
  data.forEach((v,i)=>{const x=pad.l+i*stepX;const y=pad.t+chartH-((v-minV)/range)*chartH;if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);});
  ctx.strokeStyle=lastColor;ctx.lineWidth=2;ctx.stroke();
  const lx=pad.l+(data.length-1)*stepX,ly=pad.t+chartH-((lastV-minV)/range)*chartH;
  ctx.beginPath();ctx.arc(lx,ly,4,0,Math.PI*2);ctx.fillStyle=lastColor;ctx.fill();
  ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.stroke();
}

function showMT5Credentials(){
  const a=SESSION.allAccounts.find(x=>String(x.id)===String(SESSION.selectedAccountId))||SESSION.allAccounts[0];
  if(!a){toast('No MT5 account yet','err');return;}
  const login=a.mt5_login,server=a.mt5_server;
  const master=mt5ReadMaster(a);
  const inv=a.mt5_investor_password||a.investor_password||'';
  const text=`NAIRAPIPS MT5 LOGIN\n─────────────────────\nLogin: ${login}\nServer: ${server}\nMaster Password: ${master}\nInvestor Password: ${inv}\n─────────────────────\nKeep this safe.`;
  copyText(text);
}

async function copyField(id){
  const el=document.getElementById(id);
  if(!el||!el.value){toast('Nothing to copy','err');return;}
  await copyText(el.value);
}

/* ====== PLAN ROUTE AUTHORITY ====== */
function npPlanRoute(p){
  const rawRoute=String(p.challenge_route||p.route||p.next_stage||p.after_phase1||'').trim().toLowerCase();
  const phase2Target=Number(p.phase2_target||0);
  const onePhase = rawRoute==='funded' || rawRoute==='direct_funded' || rawRoute==='one_phase' || rawRoute==='1phase' || rawRoute==='1-phase' || phase2Target<=0;
  return {
    onePhase,
    label: onePhase ? '1-PHASE CHALLENGE' : '2-PHASE CHALLENGE',
    nextLabel: onePhase ? 'FUNDED' : 'PHASE 2',
    phase1Target: Number(p.profit_target||p.phase1_target||10),
    phase2Target: onePhase ? 0 : (phase2Target||8)
  };
}

/* ====== PLANS ====== */

function npProductCategoryV156(p){
  return String(p?.product_category||'standard').toLowerCase()==='premium'?'premium':'standard';
}
function npProductMarketRowsV156(plans,key){
  return (plans||[]).filter(p=>npProductCategoryV156(p)===key).slice().sort((a,b)=>
    Number(a.category_sort||10)-Number(b.category_sort||10) ||
    Number(a.account_size||a.size||0)-Number(b.account_size||b.size||0)
  );
}
function npProductMarketBlockV156(plans,key,mode='plans'){
  const rows=npProductMarketRowsV156(plans,key);
  const label=key==='premium'?'Premium':'Standard';
  const sub=key==='premium'
    ? 'Premium market · separate pricing and trading rules'
    : 'Standard market · core NairaPips challenge plans';
  if(!rows.length) return '';
  const cards=rows.map((p,i)=>{
    const route=npPlanRoute(p);
    if(mode==='purchase'){
      return `<div class="plan-card" onclick="purchasePlan('${esc(String(p.id))}')" style="cursor:pointer;padding:18px">
        <div style="display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap">
          <div style="font-size:10px;color:var(--text-mute);text-transform:uppercase;letter-spacing:.1em;font-weight:700">${label.toUpperCase()}</div>
          <span class="pill ${route.onePhase?'pill-gold':'pill-blue'}">${route.label}</span>

function npReferralProfileView(){

  const code = npCleanReferralCode(data.code || data.partner?.code || npFallbackTraderReferralCode());

  // contain stale links and must not be copied back to traders.
  const link = npReferralLink(code);
  const rawComm = data.commission_percent ?? data.partner?.commission_percent ?? settings.rebateValue ?? settings.rebate_percent;

let PROMO_QUOTE=null;
let PROMO_QUOTE_TIMER=null;
let PROMO_QUOTE_SEQ=0;

function resetPurchaseQuoteDisplay(plan){
  const base=Number(plan?.fee||plan?.price||0);
  const feeEl=document.getElementById('pur-fee-display');
  const discRow=document.getElementById('pur-discount-row');
  const amtRow=document.getElementById('pur-amount-row');
  if(feeEl){
    feeEl.innerHTML=fmt.money(base);
    feeEl.style.color='';
    feeEl.style.textDecoration='';
  }
  if(discRow) discRow.style.display='none';
  if(amtRow) amtRow.style.display='none';
}

function schedulePromoQuote(planId,immediate=false){
  clearTimeout(PROMO_QUOTE_TIMER);
  PROMO_QUOTE_TIMER=setTimeout(()=>applyPromoQuote(planId), immediate?0:450);
}

async function applyPromoQuote(planId){
  const input=document.getElementById('pur-promo');
  if(!input) return;
  const code=input.value.trim();
  const result=document.getElementById('promo-result');
  const p=SESSION.plansList.find(x=>String(x.id)===String(planId));
  if(!p) return;
  if(!code){
    if(result) result.innerHTML='';
    PROMO_QUOTE=null;
    resetPurchaseQuoteDisplay(p);
    return;
  }

  const t=SESSION.data?.trader || SESSION.trader || {};
  const seq=++PROMO_QUOTE_SEQ;
  if(result) result.innerHTML='<span style="color:var(--text-mute)">Checking offer...</span>';

  try{
    const qd=await safeFetchJson(API+'/quote_challenge_price',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        code,
        promo_code:code,
        affiliate_code:code,
        referral_code:code,
        partner_code:code,
        fee:Number(p.fee||p.price||0),
        plan_id:p.id,
        plan_name:p.name||p.plan_name||'',
        account_size:p.account_size||p.size||0,
        email:t.email||'',
        phone:t.phone||'',
        trader_id:t.id||'',
        account_reference:t.account_reference||''
      })
    },15000,false);

    if(seq!==PROMO_QUOTE_SEQ) return;

function npEffectivePayoutSplit(raw){
  // V164: exact payout repair for funded accounts whose trader_accounts row
  // carries 0/blank payout_split even though the linked purchase/plan has a
  // valid commercial split. Existing normal payout accounts remain unchanged.
  const direct=Number(String(raw ?? '').replace('%','').trim());
  if(Number.isFinite(direct) && direct>0 && direct<=100) return direct;

  const a=npResolvePayoutAccount()||{};
  const pid=String(a.purchase_id||a.challenge_purchase_id||'').trim();

  const purchases=(
    SESSION.purchases||
    SESSION.data?.purchases||
    SESSION.data?.challenge_purchases||
    []
  ).filter(Boolean);

  const purchase=purchases.find(p=>
    pid && String(p.id||'').trim()===pid
  )||{};

  for(const v of [
    purchase.payout_split,
    purchase.profit_split,
    purchase.trader_split,
    purchase.profit_share
  ]){
    const n=Number(String(v ?? '').replace('%','').trim());
    if(Number.isFinite(n) && n>0 && n<=100) return n;
  }

  const planId=String(
    purchase.plan_id||
    purchase.challenge_plan_id||
    a.plan_id||
    a.challenge_plan_id||
    ''
  ).trim();

  const planName=String(
    purchase.plan_name||
    purchase.selected_plan||
    a.plan_name||
    a.plan||
    ''
  ).trim().toLowerCase();

  const plans=(SESSION.plansList||SESSION.data?.plans||[]).filter(Boolean);
  const plan=plans.find(p=>
    (planId && String(p.id||'').trim()===planId) ||
    (planName && String(p.name||p.plan_name||'').trim().toLowerCase()===planName)
  )||{};

  for(const v of [
    plan.payout_split,
    plan.profit_split,
    plan.trader_split,
    plan.profit_share
  ]){
    const n=Number(String(v ?? '').replace('%','').trim());
    if(Number.isFinite(n) && n>0 && n<=100) return n;
  }

  return 60; // legacy fallback only when no linked purchase/plan split exists
}

  const blob=npPayoutAccountStatusBlob(a);

function npResolvePayoutAccount(){
  /*
    GLOBAL MULTI-ACCOUNT LIFECYCLE AUTHORITY
    ----------------------------------------
    Every trader may have historical Phase 1 / Phase 2 / Funded / reset / breached
    MT5 records. Financial actions must NEVER depend on legacy trader mirror fields
    alone. We resolve the payout account from the trader_accounts collection.

    Priority:
      1. Trader's deliberately selected ACTIVE FUNDED account.
      2. Backend current_account when it is ACTIVE FUNDED.
      3. Active funded account matching the trader mirror login (compatibility only).
      4. Most recently assigned ACTIVE FUNDED account.
      5. Selected/current active non-funded account only as display fallback.

    Historical, archived, breached, disabled, locked and reset rows remain visible in
    account history but can never become the payout authority.
  */
  const current=SESSION.data?.current_account||{};
  const t=SESSION.data?.trader||{};
  const rows=[];
  const seen=new Set();

  [current,...(SESSION.allAccounts||[])].forEach(a=>{
    if(!a||typeof a!=='object') return;
    const key=String(a.id||a.mt5_login||'');
    if(!key || seen.has(key)) return;
    seen.add(key);
    rows.push(a);
  });

  const selectedId=String(SESSION.selectedAccountId||'').trim();
  const selectedLogin=String(
    (rows.find(a=>String(a.id||'')===selectedId)||{}).mt5_login||''
  ).trim();

  const selected=rows.find(a=>
    (selectedId && String(a.id||'')===selectedId) ||
    (selectedLogin && String(a.mt5_login||'').trim()===selectedLogin)
  );

  if(selected && npIsFundedPayoutAccount(selected) && npIsActivePayoutAccount(selected)){
    return selected;
  }

  if(current && npIsFundedPayoutAccount(current) && npIsActivePayoutAccount(current)){
    return current;
  }

  const traderLogin=String(t.mt5_login||'').trim();
  const mirrorFunded=rows.find(a=>
    traderLogin &&
    String(a.mt5_login||'').trim()===traderLogin &&
    npIsFundedPayoutAccount(a) &&
    npIsActivePayoutAccount(a)
  );
  if(mirrorFunded) return mirrorFunded;

  const activeFunded=rows
    .filter(a=>npIsFundedPayoutAccount(a)&&npIsActivePayoutAccount(a))
    .sort((a,b)=>{
      const bd=new Date(b.assigned_at||b.started_at||b.updated_at||b.created_at||0).getTime()||0;
      const ad=new Date(a.assigned_at||a.started_at||a.updated_at||a.created_at||0).getTime()||0;
      return bd-ad;
    });
  if(activeFunded[0]) return activeFunded[0];

  if(selected && npIsActivePayoutAccount(selected)) return selected;
  if(current && npIsActivePayoutAccount(current)) return current;

  return {};
}

function npEffectivePayoutEligibility(){
  const raw=SESSION.data?.payout_eligibility||{};
  const a=npResolvePayoutAccount();

  if(SESSION.currentTab==='payouts' && !npPayoutLedgerReady()){
    return Object.assign({},raw,{
      eligible:false,
      funded:npIsFundedPayoutAccount(a)&&npIsActivePayoutAccount(a),
      reason:'Checking your latest payout cycle…',
      account:a,
      checking:true
    });
  }
  const funded=npIsFundedPayoutAccount(a)&&npIsActivePayoutAccount(a);
  const calc=npPayoutAvailable();
  const status=npPayoutAccountStatusBlob(a);
  // V125: management-confirmed exact Funded account 477162786 has stale
  // archived_after_reset metadata. Do not let that stale label re-lock this
  // one payout after V124 has verified the exact trader/account.
  const blocked=npV124IsExactAderetiFundedPayoutAccount(a)
    ? false
    : ['breach','lock','disable','archive','closed','review'].some(x=>status.includes(x));
  const openRequest=npOpenPayoutRequest();
  const awaitingFresh=npAwaitingFreshFundedMt5AfterPaid();
  const eligible = !openRequest && !awaitingFresh && funded && !blocked && (calc.available>0 || calc.verifying);
  let reason=String(raw.reason||'').trim();
  if(openRequest) reason='A payout is already open for this funded cycle.';
  else if(awaitingFresh) reason='Your payout was paid. Waiting for a fresh funded MT5 assignment before the next payout cycle.';
  if(calc.verifying && !openRequest && !awaitingFresh) reason=calc.reason;
  if(!reason){
    if(!funded) reason='An active funded/live account is required.';
    else if(blocked) reason='This funded account is under restriction or review.';
    else if(calc.verifying) reason=calc.reason;
    else if(calc.available<=0) reason='No verified funded profit is currently available for payout.';
    else reason='Verified funded profit is available for payout.';
  }
  return Object.assign({},raw,{eligible,funded,reason,account:a});
}
function npPayoutAvailable(){
  const a=npResolvePayoutAccount();
  // Use the same exact-account quote that the server rechecks at submission.
  const quote=SESSION.data?.payout_quotes?.[String(a?.id||'')] || a?.payout_quote;
  if(quote && String(quote.trader_account_id||'')===String(a?.id||'')){
    const age=quote.observed_at ? (Date.now()-Date.parse(quote.observed_at))/1000 : 0;
    const verified=quote.verified && Number.isFinite(age) && age<=180 && age>=-60;
    return {
      startBal:Number(quote.start_balance||a.start_balance||a.account_size||0),
      equity:Number(quote.current_equity||0),
      profit:Number(quote.verified_profit||0),
      splitPct:Number(quote.payout_split||0),
      available:Number(quote.available_payout||0),
      fundedActive:npIsFundedPayoutAccount(a)&&npIsActivePayoutAccount(a),
      verifying:!verified,
      lastVerified:!!quote.observed_at,
      observedAt:quote.observed_at||null,
      reason:verified ? String(quote.reason||'') : 'You can submit your payout request while we verify your latest account balance.'
    };
  }


  // V196: when the backend has issued an exact-account management-verified
  // payout authority, use that financial proof instead of stale account equity.
  // This changes payout presentation only; DD/monitoring/shards are untouched.
  const raw=SESSION.data?.payout_eligibility||{};
  const proof=raw?.account||{};
  const exactV195=(
    String(raw?.authority||'').includes('V195_MT5_477365592_MANAGEMENT_VERIFIED_PAYOUT') &&
    String(a?.id||'')==='55d36867-3523-46af-8193-77c946d98959' &&
    String(a?.mt5_login||'')==='477365592' &&
    String(proof?.mt5_login||a?.mt5_login||'')==='477365592' &&
    Number(raw?.available_payout||0)>0
  );
  if(exactV195){
    return {
      startBal:Number(proof?.start_balance||a?.start_balance||a?.account_size||2000000),
      equity:Number(proof?.current_equity||proof?.current_balance||2213379),
      profit:Number(raw?.verified_profit||213379),
      splitPct:Number(raw?.payout_split||60),
      available:Number(raw?.available_payout||128027.40),
      fundedActive:true
    };
  }

  const splitPct=npEffectivePayoutSplit(a?.payout_split);

  // PAYOUT MONEY EXISTS ONLY IN FUNDED STAGE.
  // Challenge/Phase profit is progress toward the target, never withdrawable profit.
  const fundedActive=!!(
    a &&
    npIsFundedPayoutAccount(a) &&
    npIsActivePayoutAccount(a) &&
    String(a.mt5_login||'').trim()
  );

  if(!fundedActive){
    return {
      startBal:Number(a?.start_balance||a?.account_size||0),
      equity:Number(a?.current_equity||a?.equity||a?.current_balance||a?.balance||0),
      profit:0,
      splitPct,
      available:0,
      fundedActive:false
    };
  }

  const startBal=Number(a.start_balance||a.account_size||0);
  const equity=Number(a.current_equity||a.equity||a.current_balance||a.balance||startBal);
  const profit=Math.min(Math.max(0,equity-startBal),Math.round(startBal*0.5*100)/100);
  return {
    startBal,equity,profit,splitPct,
    available:Math.max(0,Math.floor((profit*splitPct)/100)),
    fundedActive:true
  };
}

function npPayoutBelongsToAccount(p,a){

function npOpenPayoutRequest(account){
  const a=account||npResolvePayoutAccount();
  const openStatuses=new Set(['pending','requested','submitted','pending_review','awaiting_review','under_review','approved','processing','payment_processing']);
  return npPayoutRowsForAccount(a).find(p=>openStatuses.has(npNormalizedPayoutStatus(p)))||null;

function npLatestPaidPayout(account){
  const a=account||npResolvePayoutAccount();
  return npPayoutRowsForAccount(a)
    .filter(p=>npNormalizedPayoutStatus(p)==='paid')
    .slice()
    .sort((x,y)=>new Date(y.paid_at||y.updated_at||y.created_at||0)-new Date(x.paid_at||x.updated_at||x.created_at||0))[0]||null;

function npHasFreshFundedMt5AfterPaid(paid){
  if(!paid) return true;
  const a=npResolvePayoutAccount()||{};
  const login=String(a.mt5_login||'').trim();
  const paidLogin=String(paid.mt5_login||'').trim();
  if(!login || !npIsFundedPayoutAccount(a) || !npIsActivePayoutAccount(a)) return false;
  if(paidLogin && login===paidLogin) return false;
  const assignedAt=new Date(a.assigned_at||a.started_at||a.created_at||0).getTime();
  const paidAt=new Date(paid.paid_at||paid.updated_at||paid.created_at||0).getTime();
  if(assignedAt && paidAt && assignedAt<=paidAt) return false;
  return true;
}
function npAwaitingFreshFundedMt5AfterPaid(){
  const a=npResolvePayoutAccount();
  const paid=npLatestPaidPayout(a);
  return !!(paid && !npOpenPayoutRequest(a) && !npHasFreshFundedMt5AfterPaid(paid));
}
function npPayoutDisplayState(){
  const checking=SESSION.currentTab==='payouts' && !npPayoutLedgerReady();
  const account=npResolvePayoutAccount();
  const accountPayouts=npPayoutRowsForAccount(account);
  const lifecycleWaiting=npTraderWaitingForFreshFundedMt5();
  const rawOpen=npOpenPayoutRequest(account);
  const latestPaid=npLatestPaidPayout(account);
  const latestApproved=accountPayouts
    .filter(p=>npNormalizedPayoutStatus(p)==='approved')
    .slice()
    .sort((a,b)=>new Date(b.approved_at||b.updated_at||b.created_at||0)-new Date(a.approved_at||a.updated_at||a.created_at||0))[0]||null;

  // Financial status stays authoritative from the payout row. Never relabel an
  // APPROVED payout as PAID in the browser. Once Admin marks it paid, the waiting
  // lifecycle takes over the dashboard and the trader sees PAID / RECEIVED.
  const completedDisplay = latestPaid;
  const open = rawOpen;
  const openStatus=open?npNormalizedPayoutStatus(open):'';
  const awaitingFresh=!checking && !!(lifecycleWaiting && latestPaid && !open);
  return {open,openStatus,latestPaid:completedDisplay,awaitingFresh,lifecycleWaiting,checking};
}

async function npPayoutCertificateBlob(payoutId){
  const svg=npPayoutCertificateSvg(payoutId);
  const blob=new Blob([svg],{type:'image/svg+xml;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  try{
    const img=new Image();
    await new Promise((resolve,reject)=>{
      img.onload=resolve;
      img.onerror=()=>reject(new Error('Certificate image could not be created.'));
      img.src=url;
    });

    // High-density 2x raster: 2800 × 3200 PNG.
    // This keeps small text, metallic edges and signatures crisp when shared.
    const canvas=document.createElement('canvas');
    canvas.width=2800;
    canvas.height=3200;
    const ctx=canvas.getContext('2d',{alpha:false});
    ctx.imageSmoothingEnabled=true;
    ctx.imageSmoothingQuality='high';
    ctx.fillStyle='#020202';
    ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.drawImage(img,0,0,canvas.width,canvas.height);

    return await new Promise((resolve,reject)=>
      canvas.toBlob(
        b=>b?resolve(b):reject(new Error('Certificate export failed.')),
        'image/png',
        1
      )
    );
  }finally{
    URL.revokeObjectURL(url);
  }
}

// V115 — REJECTED PAYOUT HOLD (exact funded account only)
// Mirrors backend V111: a rejected payout blocks a NEW payout request on the
// same trader_account. It does not contaminate a different/new Funded account.
function npRejectedPayoutHold(accountOverride){
  const a=accountOverride||npEffectivePayoutEligibility()?.account||npResolvePayoutAccount()||{};
  const aid=String(a.id||'').trim();
  const mt5=String(a.mt5_login||a.login||'').trim();
  if(!aid && !mt5) return null;
  return [...(SESSION.payouts||[])]
    .filter(p=>npNormalizedPayoutStatus(p)==='rejected')
    .filter(p=>{
      const paid=String(p.trader_account_id||p.account_id||'').trim();
      const pmt5=String(p.mt5_login||p.login||'').trim();
      return (aid && paid && aid===paid) || (mt5 && pmt5 && mt5===pmt5);
    })
    .sort((x,y)=>(new Date(y.rejected_at||y.updated_at||y.created_at||0).getTime()||0)-(new Date(x.rejected_at||x.updated_at||x.created_at||0).getTime()||0))[0]||null;
}

function eligibilityBlock(){
  const pe=npEffectivePayoutEligibility();
  const a=pe.account||npResolvePayoutAccount();
  const calc=npPayoutAvailable();
  const fundedOk=npIsFundedPayoutAccount(a)&&npIsActivePayoutAccount(a);
  const ps=npPayoutDisplayState();
  if(ps.checking){
    return `<div style="text-align:center;padding:18px;background:rgba(234,179,8,.06);border:1px solid rgba(234,179,8,.30);border-radius:10px">

  }
  const complianceHold=npRejectedPayoutHold(a);

      <button class="btn btn-red btn-sm" style="margin-top:12px" onclick="npOpenComplianceReportForPayout('${esc(complianceHold.id||'')}')">📄 View Compliance Report</button>

  if(ps.open){
    const approved=['approved','processing','payment_processing'].includes(ps.openStatus);

      <div style="font-weight:900;font-size:17px;color:var(--gold)">${approved?'Payout Approved / Processing':(npPayoutAwaitingVerification(ps.open)?'Request Received · Verifying Balance':'Payout Under Review')}</div>
      <div style="font-size:12px;color:var(--text-mute);margin-top:6px">${fmt.money(ps.open.amount||0)} · ${esc(String(ps.open.status||'pending').toUpperCase())}</div>
      <div style="margin-top:11px;font-size:12px;color:var(--text-dim)">Fresh payout eligibility is locked until this payout cycle is completed.</div>

  if(ps.awaitingFresh){
    return `<div style="text-align:center;padding:18px;background:rgba(34,197,94,.07);border:1px solid rgba(34,197,94,.35);border-radius:10px">
      <div style="font-size:36px;margin-bottom:6px">✅</div>
      <div style="font-weight:900;color:#4ade80;font-size:18px">Payout Paid · Received</div>
      <div style="font-size:13px;color:var(--text-dim);margin-top:7px">${fmt.money(ps.latestPaid?.amount||0)} payment completed successfully.</div>
      <div style="margin-top:12px;font-size:13px;font-weight:900;color:var(--gold)">Waiting for Fresh Funded MT5</div>
      <div style="font-size:11px;color:var(--text-mute);margin-top:5px">The previous funded cycle is closed. The next payout cycle begins after the new MT5 assignment.</div>
    </div>`;

  if(calc.verifying && pe.eligible){

      <div style="font-weight:900;font-size:18px;color:#4ade80">Payout Requests Open</div>
      <div style="font-size:13px;margin-top:8px">You can submit your request while we verify your latest account balance.</div>
      ${calc.lastVerified?`<div style="margin-top:12px">Last verified payout amount: <b>${fmt.money(calc.available)}</b><br><small>Updated: ${esc(npDateTimeValue(calc.observedAt))}</small></div>`:''}

function validatePayoutForm(){
  const calc=npPayoutAvailable();
  const pe=npEffectivePayoutEligibility();
  const amount=Number(document.getElementById('po-amount')?.value||0);
  const method=document.getElementById('po-method')?.value||'bank';
  const bank=(document.getElementById('po-bank')?.value||'').trim();
  const acct=(document.getElementById('po-acct')?.value||'').trim();
  const name=(document.getElementById('po-name')?.value||'').trim();
  const warn=document.getElementById('po-warning');
  const btn=document.getElementById('po-submit');
  let msg=''; let ok=true;
  const openRequest=npOpenPayoutRequest();
  const complianceHold=npRejectedPayoutHold(pe.account||npResolvePayoutAccount());
  if(complianceHold){ ok=false; msg='This funded account is on compliance hold after a rejected payout decision.'; }
  else if(openRequest){ ok=false; msg='You already have an open payout request awaiting Admin action.'; }
  else if(!pe.eligible){ ok=false; msg=pe.reason||'Payout is not available for this account.'; }
  else if(!calc.verifying && calc.available<=0){ ok=false; msg='No withdrawable profit yet. You need verified profit before requesting payout.'; }
  else if(!Number.isFinite(amount) || amount<=0){ ok=false; msg='Enter a payout amount.'; }
  else if(!calc.verifying && amount>calc.available){ ok=false; msg='Amount is above your verified available payout.'; }
  else if(method==='bank' && (!bank || !acct || !name)){ ok=false; msg='Fill bank name, account number and account name.'; }
  else if(method!=='bank' && (!bank || !acct)){ ok=false; msg='Fill wallet network/name and wallet address.'; }
  if(warn) warn.textContent=msg;
  if(btn) btn.disabled=!ok;
  return ok;
}

async function cancelPendingPayout(payoutId){
  if(!payoutId){ toast('Payout reference is missing. Refresh and try again.','err'); return; }
  const confirmed=confirm(
    'Cancel this pending payout?\n\nThe old amount will be cancelled. After the payout lock is safely released, you may submit a new request using the latest verified profit.'
  );
  if(!confirmed) return;
  try{
    const r=await fetch(API+'/cancel_payout',{
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'Authorization':'Bearer '+SESSION.auth_token
      },
      body:JSON.stringify({id:payoutId,trader_id:SESSION.data.trader.id})
    });
    const d=await r.json().catch(()=>({}));
    if(r.status>=400 || d.success===false){
      throw new Error(d.error||d.message||'Unable to cancel payout');
    }
    // Cancellation does not end the funded cycle. Remove the stale open-payout
    // state immediately, then reload the authenticated payout ledger.
    SESSION.payouts=(SESSION.payouts||[]).map(p=>
      String(p.id||'')===String(payoutId)
        ? {...p,status:'cancelled',updated_at:new Date().toISOString()}
        : p
    );
    if(SESSION.moduleLoaded) SESSION.moduleLoaded.payouts=false;
    toast('Payout cancelled. Your funded account is active again.','ok');
    await loadTraderModuleData('payouts');
    renderApp();
  }catch(e){
    toast(e?.message||'Unable to cancel payout.','err');
    renderApp();
  }
}

async function submitPayout(){
  const openRequest=npOpenPayoutRequest();
  if(openRequest){
    toast('You already have an open payout request awaiting Admin action.','err');
    return;
  }
  if(!validatePayoutForm()) return;
  const amount=Number(document.getElementById('po-amount').value);
  const method=document.getElementById('po-method').value;
  const bank=document.getElementById('po-bank').value.trim();
  const acct=document.getElementById('po-acct').value.trim();
  const name=document.getElementById('po-name').value.trim();
  const note=document.getElementById('po-note').value.trim();
  const btn=document.getElementById('po-submit');
  try{
    if(btn){btn.disabled=true;btn.textContent='Submitting payout…';}
    const t=SESSION.data.trader||{};
    const pe=npEffectivePayoutEligibility();
    const a=pe.account || npResolvePayoutAccount() || {};
    if(!a.id || !a.mt5_login) throw new Error('Active funded MT5 account could not be verified. Refresh and try again.');
    if(!npIsFundedPayoutAccount(a) || !npIsActivePayoutAccount(a)) throw new Error('The selected payout account is not an active funded account.');
    const calc=npPayoutAvailable();
    if(!calc.verifying && amount>calc.available) throw new Error('Amount is above your verified available payout.');
    const payload={
      trader_id:t.id,
      trader_account_id:a.id,
      account_id:a.id,
      trader_name:t.name||t.full_name,
      email:t.email,
      phone:t.phone,
      mt5_login:a.mt5_login,
      mt5_server:a.mt5_server,
      account_size:a.account_size||a.start_balance,
      start_balance:a.start_balance||a.account_size,
      current_balance:a.current_balance||a.balance,
      current_equity:a.current_equity||a.equity,
      profit:calc.profit,
      profit_percent:a.profit_percent,
      payout_split:calc.splitPct,
      amount,
      payment_method:method,
      method,
      bank_name:bank,
      account_number:acct,
      account_name:name,
      note,
      status:'pending',
      created_at:new Date().toISOString()
    };
    const headers={'Content-Type':'application/json'};
    if(SESSION.auth_token) headers.Authorization='Bearer '+SESSION.auth_token;
    const r=await fetch(API+'/create_payout',{method:'POST',headers,body:JSON.stringify(payload)});
    const d=await r.json().catch(()=>({}));
    if(r.status>=400 || d.success===false) throw new Error(d.error||d.message||'Payout failed');
    // A payout becomes part of the trader's permanent request history immediately.
    // Approval/payment only updates this same record later.
    const createdRows = Array.isArray(d?.data)
      ? d.data
      : Array.isArray(d)
        ? d
        : (d?.data && typeof d.data==='object' ? [d.data] : []);
    if(createdRows.length){
      const payoutMap=new Map();
      [...(SESSION.payouts||[]), ...createdRows].forEach(p=>{
        if(!p || typeof p!=='object') return;
        const key=String(p.id||[p.trader_id,p.mt5_login,p.amount,p.requested_at||p.created_at].join('|'));
        payoutMap.set(key,{...(payoutMap.get(key)||{}),...p});
      });
      SESSION.payouts=Array.from(payoutMap.values());
    }

    toast(d.message||'Payout submitted. Your request is now in Payout History.','ok');
    ['po-amount','po-bank','po-acct','po-name','po-note'].forEach(id=>{const el=document.getElementById(id); if(el) el.value='';});

    // Force a genuine refresh. loadTraderModuleData() otherwise returns early
    // when the Payout tab was already marked loaded before submission.
    SESSION.moduleLoaded = SESSION.moduleLoaded || {};
    SESSION.moduleLoaded.payouts = false;
    try{ await loadTraderModuleData('payouts'); }catch(_e){}
    renderApp();
  }catch(e){
    console.error('Payout submit failed',e);
    toast('Failed: '+(e.message||e),'err');
  }finally{
    if(btn){btn.textContent='💰 Submit Payout Request'; validatePayoutForm();}
  }
}

/* ====== OFFERS ====== */
function npOfferIsUsable(o){
  if(!o) return false;
  const status=String(o.status||'active').trim().toLowerCase();
  if(!['active','live'].includes(status)) return false;
  if(o.used_at||o.redeemed_at||['used','redeemed','consumed'].includes(status)) return false;
  const expiry=o.offer_expires_at||o.expires_at||o.expiry_date||o.expires;
  if(!expiry) return false; // discount offers without expiry are not production-valid
  const ts=new Date(expiry).getTime();
  if(!Number.isFinite(ts) || ts<=Date.now()) return false;
  return true;
}

function renderOffers(){
  const offers=[...(SESSION.offers||[])].filter(o=>npOfferIsUsable(o) && !npIsPrivateNotice(o)).sort((a,b)=>{
    const ad=new Date(a.created_at||a.sent_at||0).getTime()||0;
    const bd=new Date(b.created_at||b.sent_at||0).getTime()||0;
    return bd-ad;
  });
  return `

      const expired=expiryValue&&new Date(expiryValue)<new Date();
      const used=!!(o.used_at||o.redeemed_at||String(o.status||'').toLowerCase()==='used'||String(o.status||'').toLowerCase()==='redeemed');
      const messageOnly = o.message_only === true || String(o.message_only||'').toLowerCase()==='true';
      return `<div class="offer mb-4" style="${urgent?'border-color:var(--red)':''}">
        <span class="offer-tag" style="${urgent?'background:var(--red);color:#fff':''}">${urgent?'⚠ URGENT':(messageOnly?'PRIVATE NOTICE':'PRIVATE OFFER')}</span>
        <div class="offer-title">${esc(o.subject||o.title||'Private Offer')}</div>
        <div style="font-size:11px;color:var(--text-mute);margin-bottom:10px">Sent ${esc(npDateTimeValue(o.created_at))} · ${esc(fmt.rel(o.created_at))} ${used?'· <span style="color:var(--green)">USED '+esc(npDateTimeValue(o.used_at||o.redeemed_at))+'</span>':expired?'· <span style="color:var(--red)">EXPIRED</span>':expiryValue?'· Expires '+esc(npDateTimeValue(expiryValue)):'· Available until used'}</div>
        <div class="offer-body">${esc(o.message||o.body||'')}</div>
        ${!messageOnly && o.offer_code?`<div class="offer-code"><div style="flex:1"><div style="font-size:10px;color:var(--text-mute);margin-bottom:4px">USE CODE AT CHECKOUT</div><div class="code">${esc(o.offer_code)}</div></div><button class="btn-copy" onclick="copyText('${esc(o.offer_code)}')">⧉ Copy</button></div>`:''}
        ${!messageOnly && o.discount_percent?`<div style="text-align:center;padding:12px;background:rgba(34,197,94,.1);border:1px solid var(--green);border-radius:10px;color:#4ade80;font-weight:700;font-size:14px">💰 ${o.discount_percent}% OFF YOUR NEXT CHALLENGE</div>`:''}
        ${!messageOnly && o.cta_label?`<button class="btn btn-gold btn-block" style="margin-top:14px" onclick="npClaimPrivateOffer('${esc(String(o.id||''))}')">${esc(o.cta_label)} →</button>`:''}

  `;
}

/* ====== ANNOUNCEMENTS ====== */
function npIsPrivateNotice(o){
  if(!o) return false;
  const mo=o.message_only===true || String(o.message_only||'').toLowerCase()==='true';
  const nt=String(o.notice_type||o.type||o.category||'').toLowerCase();
  return mo || /compliance|payout|warning|account_notice|management_notice|risk_notice/.test(nt);
}
function npGetPrivateNotices(){
  const t=SESSION.data?.trader||SESSION.trader||{};
  const rows=[...(SESSION.offers||[]),...(SESSION.targetedOffers||[])];
  const seen=new Set();
  return rows.filter(npIsPrivateNotice).filter(o=>{
    if(o.target_trader_id && t.id && String(o.target_trader_id)!==String(t.id)) return false;
    const key=String(o.id||[o.subject||o.title,o.created_at||o.sent_at].join('|'));
    if(seen.has(key)) return false; seen.add(key); return true;
  });
}
function npAnnouncementReadKey(a){
  const t=SESSION.data?.trader||SESSION.trader||{};
  return 'np_announcement_read_'+String(t.id||t.email||'trader')+'_'+String(a.id||[a.subject||a.title,a.created_at||a.sent_at].join('|'));
}
function npAnnouncementIsRead(a){ try{return localStorage.getItem(npAnnouncementReadKey(a))==='1';}catch(_e){return false;} }
function npMarkAnnouncementsRead(list){
  try{ (list||[]).forEach(a=>localStorage.setItem(npAnnouncementReadKey(a),'1')); }catch(_e){}
}
function npComplianceNoticeForPayout(p){
  if(!p) return null;
  const all=[...(SESSION.announcements||[]),...npGetPrivateNotices()];
  const pid=String(p.id||'').trim();
  const login=String(p.mt5_login||'').trim();
  return all.find(a=>{
    const nt=String(a.notice_type||a.type||'').toLowerCase();
    if(!/compliance/.test(nt) && !/compliance|payout.*decision|trading rule violation/i.test(String(a.subject||a.title||''))) return false;
    if(pid && String(a.payout_id||'').trim()===pid) return true;
    const msg=String(a.message||a.body||'');
    return !!(login && msg.includes(login));
  })||null;
}
function npRecordPrivateNoticeOpened(a){
  if(!a || !a.id || !(npIsPrivateNotice(a)||a.target_trader_id||a.target_email)) return;
  const t=SESSION.data?.trader||SESSION.trader||{};
  safeFetchJson(API+'/trader_announcement_read',{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({trader_id:t.id,announcement_id:a.id})
  },5000,true).then(r=>{ if(r?.opened_at) a.read_at=r.opened_at; }).catch(e=>console.warn('Notice read audit failed',e?.message||e));
}
function npOpenComplianceReportForPayout(payoutId){
  const p=(SESSION.payouts||[]).find(x=>String(x.id)===String(payoutId));
  const a=npComplianceNoticeForPayout(p);
  if(a){ npRecordPrivateNoticeOpened(a); }
  setTab('announcements');
}

function npComplianceReportHtml(value){
  // Escape first, then support only the tiny formatting subset used by
  // compliance review notes. This prevents raw ** markers without allowing
  // arbitrary HTML from an Admin-authored report.
  let safe=esc(String(value||''));
  safe=safe.replace(/\*\*([^*\n][\s\S]*?)\*\*/g,'<strong style="color:#f3f4f6;font-weight:900">$1</strong>');
  return safe;
}

function renderAnnouncements(){
  // V160 mobile-first: paint cached announcements immediately.
  npHydrateAnnouncementCacheV159();
  const t=SESSION.data?.trader||SESSION.trader||{};
  const globals=(SESSION.announcements||[]).filter(a=>!a.target_trader_id || (t.id && String(a.target_trader_id)===String(t.id)));
  const priv=npGetPrivateNotices();
  const map=new Map();
  [...globals,...priv].forEach(a=>{
    const key=String(a.id||[a.subject||a.title,a.created_at||a.sent_at].join('|'));

  });
  const list=Array.from(map.values()).sort((a,b)=>(new Date(b.created_at||b.sent_at||0).getTime()||0)-(new Date(a.created_at||a.sent_at||0).getTime()||0)).slice(0,50);
  // Opening Announcements acknowledges what is currently visible locally and,
  // for private notices, records a timestamped server-side audit event.
  npMarkAnnouncementsRead(list);
  list.filter(a=>npIsPrivateNotice(a)||a.target_trader_id||a.target_email).forEach(npRecordPrivateNoticeOpened);
  return `
    <div class="topbar"><div class="topbar-greeting"><h1>📣 Announcements</h1><div class="sub">Important NairaPips updates and private account notices</div></div></div>
    ${list.length?list.map(a=>{
      const privateNotice=npIsPrivateNotice(a) || !!a.target_trader_id;
      const urgent=String(a.priority||'').toLowerCase()==='urgent' || /rejected|violation|warning|compliance/i.test(String(a.subject||a.title||''));
      return `<div class="card np-announce-card mb-3" style="${urgent?'border-color:rgba(239,68,68,.55)!important':''}">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:8px">
          <div>
            <div style="font-weight:900;font-size:16px">${esc(a.subject||a.title||'NairaPips Notice')}</div>
            <div style="font-size:11px;color:var(--text-mute);margin-top:2px">${esc(npDateTimeValue(a.created_at||a.sent_at))}${a.expires_at?' · expires '+esc(npDateTimeValue(a.expires_at)):''}</div>
          </div>
          <span class="pill ${urgent?'pill-red':'pill-gold'}">${privateNotice?'PRIVATE NOTICE':esc(a.tag||'ANNOUNCEMENT')}</span>
        </div>
        <div style="font-size:13px;color:var(--text-dim);line-height:1.7;white-space:pre-wrap">${privateNotice?npComplianceReportHtml(a.message||a.body||''):esc(a.message||a.body||'')}</div>
        ${a.cta_label && a.cta_url?`<button class="btn btn-ghost btn-sm" style="margin-top:12px" onclick="window.open('${esc(a.cta_url)}','_blank')">${esc(a.cta_label)}</button>`:''}
      </div>`;
    }).join(''):`<div class="card"><div class="empty"><div class="icon">📣</div>No announcements yet</div></div>`}
  `;
}

/* ====== TIMELINE ====== */
function renderTimeline(){
  const trader=SESSION.data?.trader||{};
  const accounts=(SESSION.allAccounts||[]).filter(Boolean);
  const purchases=(SESSION.purchases||[]).filter(Boolean);
  const payouts=(SESSION.payouts||[]).filter(Boolean);
  const events=[];

  const dt=(v)=>{ const n=new Date(v||0).getTime(); return Number.isFinite(n)?n:0; };
  const pidOf=(x)=>String(x?.purchase_id||x?.challenge_purchase_id||'').trim();
  const accountById=new Map(accounts.map(a=>[String(a.id||''),a]));
  const purchaseById=new Map(purchases.map(p=>[String(p.id||''),p]));

  // Friendly Journey numbers are stable by first purchase time. A trader may run
  // many journeys in parallel; no journey is allowed to hide another one.
  const orderedPurchases=[...purchases].sort((a,b)=>dt(a.created_at||a.submitted_at)-dt(b.created_at||b.submitted_at));
  const journeyNo=new Map();
  orderedPurchases.forEach((p,i)=>journeyNo.set(String(p.id||''),i+1));
  let independentNo=orderedPurchases.length;
  const independentKeys=new Map();

  const parentId=(a)=>String(
    a?.previous_account_id||a?.previous_trader_account_id||a?.replaces_trader_account_id||
    a?.source_account_id||a?.reset_trader_account_id||a?.parent_account_id||''
  ).trim();
  const rootAccount=(a)=>{
    let cur=a, seen=new Set();
    for(let i=0;i<25 && cur;i++){
      const id=String(cur.id||'');
      if(!id||seen.has(id)) break;
      seen.add(id);
      const p=pidOf(cur); if(p) return {purchaseId:p,root:id};
      const prev=parentId(cur); if(!prev) return {purchaseId:'',root:id};
      cur=accountById.get(prev)||null;
    }
    return {purchaseId:pidOf(a),root:String(a?.id||'')};
  };
  const journeyMeta=(obj)=>{
    let pid=pidOf(obj), root='';
    if(!pid && obj?.trader_account_id){
      const a=accountById.get(String(obj.trader_account_id));
      if(a){ const r=rootAccount(a); pid=r.purchaseId; root=r.root; }
    }
    if(!pid && obj?.id && accountById.has(String(obj.id))){
      const r=rootAccount(obj); pid=r.purchaseId; root=r.root;
    }
    if(pid){
      const n=journeyNo.get(pid)||'?';
      const p=purchaseById.get(pid)||{};
      const size=Number(p.account_size||0)||0;
      return {key:'purchase:'+pid,label:`JOURNEY ${n}`,sub:size?fmt.money(size):''};
    }
    const key='independent:'+(root||String(obj?.account_id||obj?.id||'unknown'));
    if(!independentKeys.has(key)){ independentNo+=1; independentKeys.set(key,independentNo); }
    return {key,label:`JOURNEY ${independentKeys.get(key)}`,sub:'Independent entitlement'};
  };
  const push=(obj)=>{ if(obj?.when) events.push(obj); };
  const relText=(a)=>{
    const prev=parentId(a);
    const prevA=prev?accountById.get(prev):null;
    const prevLogin=String(prevA?.mt5_login||a?.previous_mt5_login||a?.replaces_mt5_login||a?.source_mt5_login||'').trim();
    return prevLogin?` · From MT5 ${prevLogin}`:'';
  };
  const ev=(base, source)=>Object.assign(base,{journey:journeyMeta(source||base)});

  if(trader.created_at) push({when:trader.created_at,title:'Trader account created',sub:'NairaPips profile opened',icon:'🎉',journey:{key:'profile',label:'PROFILE',sub:''}});

  purchases.forEach(p=>{
    const created=p.created_at||p.submitted_at;
    const j=journeyMeta(p);
    if(created) push({when:created,title:'Challenge purchase started',sub:`${p.plan_name||p.selected_plan||'Challenge'}${p.account_size?' · '+fmt.money(p.account_size):''}${p.final_fee||p.fee||p.price?' · '+fmt.money(p.final_fee||p.fee||p.price):''}`,icon:'🛒',journey:j});
    if(p.approved_at) push({when:p.approved_at,title:'Purchase approved',sub:`${p.plan_name||p.selected_plan||'Challenge'} · Ready for account assignment`,icon:'✅',journey:j});
    if(p.rejected_at) push({when:p.rejected_at,title:'Purchase rejected',sub:`${p.plan_name||p.selected_plan||'Challenge'}`,icon:'❌',journey:j});
    const closedAt=p.cycle_ended_at||p.completed_at||p.closed_at;
    const pst=String(p.lifecycle_state||p.status||'').toLowerCase();
    if(closedAt || ['completed','closed','cycle_ended','exhausted','journey_complete'].includes(pst)){
      push({when:closedAt||p.updated_at,title:'Journey cycle ended',sub:`${p.plan_name||p.selected_plan||'Challenge'} · ${String(p.lifecycle_state||p.status||'completed').replaceAll('_',' ')}`,icon:'🏁',journey:j});
    }
  });

  accounts.forEach(a=>{
    const login=String(a.mt5_login||'').trim()||'Pending';
    const stage=String(a.stage||a.phase||'Account').replaceAll('_',' ').toUpperCase();
    const size=Number(a.account_size||a.start_balance||0)||0;
    const j=journeyMeta(a);
    const assigned=npEventAt(a,'assigned');
    const passed=npEventAt(a,'passed');
    const breached=npEventAt(a,'breached');
    const reset=npEventAt(a,'reset');
    const archived=npEventAt(a,'archived');
    if(assigned) push({when:assigned,title:`${stage} account assigned`,sub:`MT5 ${login}${size?' · '+fmt.money(size):''}${relText(a)}`,icon:'🔑',journey:j});
    if(passed) push({when:passed,title:`${stage} passed`,sub:`MT5 ${login} · Target achieved`,icon:'🏆',journey:j});
    if(breached) push({when:breached,title:`${stage} account breached`,sub:`MT5 ${login} · ${a.breach_reason||a.archive_reason||'Drawdown / rule breach'}`,icon:'⛔',journey:j});
    if(reset){
      const blob=[a.archive_reason,a.reset_reason,a.admin_note,a.lifecycle_state,a.account_status].join(' ').toLowerCase();
      const title=blob.includes('payout')?'Funded cycle renewed':(stage.includes('FUNDED')?'Funded account reset':'Challenge account reset');
      push({when:reset,title,sub:`MT5 ${login}${relText(a)} · ${a.reset_reason||a.archive_reason||'Fresh account required'}`,icon:'🔄',journey:j});
    }
    if(archived && !npIsResetArchive(a) && !passed && !breached){
      push({when:archived,title:'Account moved to history',sub:`MT5 ${login} · ${npFriendlyArchiveLabel(a)}`,icon:'🗃',journey:j});
    }
  });

  payouts.forEach(p=>{
    const j=journeyMeta(p);
    const login=String(p.mt5_login||accountById.get(String(p.trader_account_id||''))?.mt5_login||'').trim();
    const amount=fmt.money(p.amount||0);
    const requested=p.requested_at||p.created_at;
    if(requested) push({when:requested,title:'Payout requested',sub:`${amount}${login?' · MT5 '+login:''}`,icon:'💰',journey:j});
    if(p.approved_at) push({when:p.approved_at,title:'Payout approved',sub:`${amount}${login?' · MT5 '+login:''}`,icon:'✅',journey:j});
    if(p.paid_at) push({when:p.paid_at,title:'Payout paid',sub:`${amount}${login?' · MT5 '+login:''}`,icon:'🏦',journey:j});
    if(p.rejected_at) push({when:p.rejected_at,title:'Payout rejected',sub:`${amount}${login?' · MT5 '+login:''}`,icon:'❌',journey:j});
  });

  events.sort((a,b)=>dt(b.when)-dt(a.when));
  const journeyOptions=[...new Map(events.filter(e=>e.journey?.key&&e.journey.key!=='profile').map(e=>[e.journey.key,e.journey])).values()];
  const selectId='np-timeline-journey-filter';
  const rows=events.map(e=>`<div class="np-journey-event" data-journey="${esc(e.journey?.key||'profile')}" style="display:flex;gap:12px;padding:15px 0;border-bottom:1px solid var(--border)">
      <div style="font-size:24px;flex-shrink:0">${e.icon}</div>
      <div style="flex:1;min-width:0">
        <div style="display:flex;align-items:center;gap:7px;flex-wrap:wrap">

function nicChartSvg(points){
  points=(points||[]).filter(x=>Number(x.equity||x.balance)>0);
  if(!points.length)return '<div class="empty">No monitoring history available yet.</div>';
  const w=900,h=260,p=28;
  const vals=points.flatMap(x=>[Number(x.balance||0),Number(x.equity||0)]).filter(x=>x>0);
  const min=Math.min(...vals),max=Math.max(...vals);const range=Math.max(1,max-min);
  const xy=(v,i)=>[p+(i/Math.max(1,points.length-1))*(w-p*2),h-p-((Number(v)-min)/range)*(h-p*2)];
  const line=k=>points.map((x,i)=>{const q=xy(x[k]||0,i);return (i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)}).join(' ');
  return `<svg class="nic-chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <defs><linearGradient id="nicFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#38bdf8" stop-opacity=".28"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/></linearGradient></defs>
    <path d="${line('equity')} L ${w-p} ${h-p} L ${p} ${h-p} Z" fill="url(#nicFill)"/>
    <path d="${line('balance')}" fill="none" stroke="#f7c843" stroke-width="3"/>
    <path d="${line('equity')}" fill="none" stroke="#38bdf8" stroke-width="3"/>
    <text x="${p}" y="18" fill="#f7c843" font-size="12">BALANCE</text><text x="${p+80}" y="18" fill="#38bdf8" font-size="12">EQUITY</text>
  </svg>`;
}

async function changeOwnTraderPassword(){
  if(SESSION.adminView){
    toast('Password changes are disabled inside Admin View','err');
    return;
  }
  const current=document.getElementById('profile-current-password')?.value || '';
  const next=document.getElementById('profile-new-password')?.value || '';
  const confirm=document.getElementById('profile-confirm-password')?.value || '';
  const btn=document.getElementById('profile-change-password-btn');

  if(!current){toast('Enter your current password','err');return;}
  if(next.length < 6){toast('New password must be at least 6 characters','err');return;}
  if(next !== confirm){toast('New passwords do not match','err');return;}
  if(current === next){toast('Choose a different new password','err');return;}

  const original=btn?.textContent || 'Change Login Password';
  if(btn){btn.disabled=true;btn.textContent='Changing password...';}

  try{
    const r=await fetch(API+'/change_trader_password',{
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'Authorization':'Bearer '+String(SESSION.auth_token||'')
      },
      body:JSON.stringify({
        trader_id:SESSION.trader?.id || SESSION.data?.trader?.id,
        current_password:current,
        new_password:next,
        confirm_password:confirm
      })
    });
    const d=await r.json();
    if(!r.ok || !d?.success) throw new Error(d?.error || d?.message || 'Password change failed');

    if(SESSION.trader) SESSION.trader.password_reset_required=false;
    if(SESSION.data?.trader) SESSION.data.trader.password_reset_required=false;
    try{
      const saved=JSON.parse(sessionStorage.getItem('np_trader')||'{}');
      if(saved?.trader) saved.trader.password_reset_required=false;
      sessionStorage.setItem('np_trader',JSON.stringify(saved));
    }catch(_e){}

    toast('Password changed successfully','ok');
    renderApp();
  }catch(e){
    toast(e.message || 'Password change failed','err');
    if(btn){btn.disabled=false;btn.textContent=original;}
  }
}

function humanAgo(date){
  if(!date) return '—';
  const now = Date.now();
  const t = new Date(date).getTime();
  const diff = Math.max(0, now - t);
  const m = Math.floor(diff / 60000);
  if(m < 1) return 'just now';
  if(m < 60) return m + 'm ago';
  const h = Math.floor(m / 60);
  if(h < 24) return h + 'h ago';
  const d = Math.floor(h / 24);
  if(d < 7) return d + 'd ago';
  const w = Math.floor(d / 7);
  if(w < 4) return w + 'w ago';
  return Math.floor(d / 30) + 'mo ago';
}

/* === MONITORING CARD — matches reference (full data) === */
function renderMonitoringCard(){
  const selected = npSelectedAccount();
  const a = (selected && selected.id ? selected : null) || (mt5ActiveFilter(SESSION.allAccounts||[])[0]) || SESSION.data.current_account || {};
  const hasAccount = !!a.id;
  if(!hasAccount){
    return `
      <div class="card mb-4" style="border-color:rgba(255,255,255,.08);opacity:.6">
        <div class="badge">MONITORING</div>
        <div class="empty" style="padding:24px"><div class="icon">📊</div>No active account to monitor. Pick a challenge first.</div>
      </div>`;
  }
  // Pull all monitored fields (safe fallbacks)
  const startBal       = Number(a.start_balance || a.initial_balance || a.account_size || 0);
  const currentEquity  = Number(a.current_equity || a.current_balance || startBal);
  const currentBalance = Number(a.current_balance || startBal);
  const lowestEquity   = Number(a.lowest_equity || startBal);
  const highestEquity  = Number(a.highest_equity || currentEquity);

  // Static DD = (start - lowest) / start * 100  ← this is what breaches
  const staticDD       = startBal > 0 ? Math.max(0, ((startBal - lowestEquity) / startBal) * 100) : 0;
  const worstStaticDD  = Number(a.worst_static_drawdown_percent || 0);
  // [HOTFIX 2026-07-03] `worst_dd_used_percent` is in units of "% of DD allowance consumed"
  // (e.g., 32.55 = 32.55% of 20% allowance). Convert back to absolute % drawdown of balance.
  // Bug: previous formula divided by dd_limit again, producing 162.75% instead of 6.51%.
  const _ddLimitRaw    = npDDLimitFor(a);
  const worstDDAbsolute = (Number(a.worst_dd_used_percent || 0) / 100) * _ddLimitRaw;
  const effectiveDD    = Math.max(staticDD, worstStaticDD, worstDDAbsolute);

  const ddLimit        = npDDLimitFor(a);
  const ddRemaining    = Math.max(0, ddLimit - effectiveDD);
  const breachLevel    = startBal * (1 - ddLimit/100);  // equity below this = breach
  const breachEquity   = Number(a.breach_equity_level || breachLevel);

  const target         = Number(a.target_percent || npTargetFor(a));
  const targetEq       = Number(a.target_equity || 0) || (target ? startBal*(1+target/100) : 0);
  const profit         = currentEquity - startBal;
  const profitPct      = startBal ? (profit/startBal)*100 : 0;
  const passProgress   = Number(a.pass_progress_percent || 0);
  const phasePass      = String(a.phase_pass_status||'').toLowerCase();

  // Risk classification (live, real)
  const isBreached = effectiveDD >= ddLimit || currentEquity <= breachEquity || phasePass.indexOf('breached')>=0 || a.account_status==='breached_archived';
  const isWarning  = !isBreached && effectiveDD >= ddLimit*0.7;
  const isCaution  = !isBreached && !isWarning && effectiveDD >= ddLimit*0.5;

  const status = isBreached ? 'BREACHED' : isWarning ? 'AT RISK' : isCaution ? 'CAUTION' : 'SAFE';
  const statusColor = isBreached ? '#fca5a5' : isWarning ? '#fbbf24' : isCaution ? '#fde68a' : '#86efac';
  const statusBg    = isBreached ? 'rgba(239,68,68,.15)' : isWarning ? 'rgba(234,179,8,.15)' : isCaution ? 'rgba(234,179,8,.10)' : 'rgba(34,197,94,.15)';
  const statusBorder= isBreached ? '#ef4444' : isWarning ? '#fbbf24' : isCaution ? '#eab308' : '#22c55e';

  const lastSync = a.last_sync_at || a.updated_at || npAssignedAt(a);

  // Worst static DD / pass meter
  const passMeterLabel = (a.stage||'phase1').toLowerCase()==='funded' ? 'Funded Account Meter' :
                         (a.stage||'phase1').toLowerCase()==='phase2' ? 'Phase 2 Pass Meter' : 'Phase 1 Pass Meter';
  const passStateLabel = (passProgress > 100) ? 'PASSED · ' + passProgress.toFixed(1) + '%' :
                         passProgress < 1 ? 'STARTING · 0.0%' : 'BUILDING · ' + passProgress.toFixed(1) + '%';

  return `
  <div class="vault mb-4" style="border-color:${statusBorder};position:relative">
    <div style="position:absolute;top:18px;right:18px;display:flex;align-items:center;gap:8px">
      <span style="font-size:11px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.1em">Static DD Limit Used</span>
      <span style="font-family:'JetBrains Mono',monospace;font-size:30px;font-weight:900;color:${isBreached?'#fca5a5':'var(--text)'};letter-spacing:-.02em">${effectiveDD.toFixed(1)}%</span>
    </div>

    <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
      <div class="badge" style="background:${statusBg};border-color:${statusBorder};color:${statusColor}">MONITORING: ${status}</div>
    </div>

    <h2 style="font-size:32px;font-weight:900;color:${isBreached?'#fca5a5':'#fff'};margin:0 0 6px;text-transform:capitalize;letter-spacing:-.01em">
      ${isBreached ? 'Account Breached & Locked' : isWarning ? 'Account At Risk — Trade Carefully' : isCaution ? 'Account In Caution Zone' : 'Account Healthy & Trading'}
    </h2>
    <div style="font-size:13px;color:var(--t2);margin-bottom:18px;max-width:80%">
      ${isBreached
        ? 'This challenge account has breached the maximum drawdown rule. Trading access is locked and this challenge cannot continue.'
        : isWarning
          ? 'You are close to the maximum drawdown limit. Reduce risk and protect your remaining equity.'
          : isCaution
            ? 'You are using a meaningful portion of your drawdown buffer. Trade with caution.'
            : 'Your account is operating safely within all drawdown parameters.'}
    </div>

    <!-- 6 stat tiles -->
    <div style="display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;margin-bottom:18px">
      ${statTile('Current Equity', '₦'+fmt.num(currentEquity), '#ffd968', 'Static start balance: ₦'+fmt.num(startBal))}
      ${statTile('Static DD Used', effectiveDD.toFixed(2)+'%', isBreached?'#fca5a5':isWarning?'#fbbf24':'#fff', 'Max allowed: '+ddLimit+'%')}
      ${statTile('DD Remaining', ddRemaining.toFixed(2)+'%', ddRemaining<5?'#fca5a5':ddRemaining<10?'#fbbf24':'#4ade80', 'Before account breach')}

function statTile(label, value, valueColor, sub){
  return `

      <div style="font-size:10px;color:var(--t4);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${sub||''}</div>
    </div>`;
}

/* === Add fmt.num helper for raw numbers (no ₦) === */
if(!fmt.num){
  fmt.num = function(n){
    if(n==null||n===''||isNaN(n)) return '—';
    return Number(n).toLocaleString('en-NG',{maximumFractionDigits:2});
  };
}


/* ==========================================================
   RESET WAITING — FINAL DOM STATUS AUTHORITY
   Runs after every render/data refresh. The visible account lifecycle wins over
   stale trader mirror fields in the header and sidebar.
   ========================================================== */
function npSynchronizeGlobalLifecycleDisplay(){
  try{
    const all=SESSION.allAccounts||[];
    const active=all.filter(a=>{
      const s=String(a.account_status||a.status||'').trim().toLowerCase();
      const permitted=['assigned_active','active','current_active','phase1_active','phase2_active','funded_active','live_active','live','funded','approved_active'].includes(s);
      return permitted &&
        Boolean(String(a.mt5_login||'').trim()) &&
        !npIsResetArchive(a) &&
        !npIsBreached(a) &&
        !npIsWaitingAccount(a) &&
        !npIsResetWaiting(a);
    });
    const waiting=all.find(a=>npIsWaitingAccount(a)||npIsResetWaiting(a));
    const resetHistory=[
      ...(Array.isArray(SESSION.data?.archives)?SESSION.data.archives:[]),
      ...all.filter(a=>npIsResetArchive(a))
    ].sort((x,y)=>
      new Date(y.archived_at||y.updated_at||y.created_at||0)-
      new Date(x.archived_at||x.updated_at||x.created_at||0)
    )[0];
    const trader=SESSION.data?.trader||SESSION.trader||{};
    const lifecycleBlob=String(
      trader.challenge_state||trader.current_account_state||trader.account_state||trader.status||''
    ).toLowerCase();
    const explicitWaiting=
      lifecycleBlob.includes('waiting') ||
      lifecycleBlob.includes('pending_assignment') ||
      lifecycleBlob.includes('awaiting_mt5') ||
      lifecycleBlob.includes('reset_approved');

    // Archive/history is not an entitlement. Never convert history into WAITING FOR MT5.
    const resetWaiting=active.length===0 && Boolean(
      waiting || (explicitWaiting && resetHistory)
    );
    if(!resetWaiting) return;

    const source=waiting||resetHistory||{};
    const stage=npStageLabel(source).replace(/_/g,' ').toUpperCase();

    document.querySelectorAll('.np-live-chip').forEach(chip=>{
      const label=String(chip.querySelector('span')?.textContent||'').trim().toLowerCase();
      const value=chip.querySelector('b');
      if(!value) return;
      if(label==='stage / status') value.textContent=`${stage} · WAITING FOR MT5 ASSIGNMENT`;
      if(label==='mt5 access') value.textContent='WAITING FOR NEW MT5';
    });

    const brandSub=document.querySelector('.sidebar .brand-sub');
    if(brandSub) brandSub.textContent=`TRADER · ${stage} · WAITING FOR MT5`;

    // Remove any stale "SAFE" label from the reset-waiting dashboard card.
    document.querySelectorAll('.np-smart-hero-status').forEach(card=>{
      if(/0 ACTIVE MT5 ACCOUNTS/i.test(card.textContent||'')){
        const pill=card.querySelector('.pill');
        if(pill){ pill.textContent='WAITING'; pill.className='pill pill-yellow'; }
        const smalls=card.querySelectorAll('small');
        if(smalls[0]) smalls[0].textContent='Waiting for MT5 Assignment';
      }
    });
  }catch(e){
    console.warn('Lifecycle display synchronization skipped:',e);
  }
}


document.addEventListener('DOMContentLoaded',()=>{
  setTimeout(npSynchronizeGlobalLifecycleDisplay,0);
  setTimeout(npSynchronizeGlobalLifecycleDisplay,300);
  setTimeout(npSynchronizeGlobalLifecycleDisplay,1200);
});
const npLifecycleObserver=new MutationObserver(()=>{
  clearTimeout(window.__npLifecycleSyncTimer);
  window.__npLifecycleSyncTimer=setTimeout(()=>{npSynchronizeGlobalLifecycleDisplay();npAlignSidebarWithRenderedDashboard();},20);
});
npLifecycleObserver.observe(document.documentElement,{childList:true,subtree:true});


function npAlignSidebarWithRenderedDashboard(){
  try{
    const sub=document.querySelector('.sidebar .brand-sub');

    const terminal=npJourneyTerminalNoActive();
    if(terminal){
      if(sub) sub.textContent='TRADER · JOURNEY COMPLETE · NO ACTIVE ACCOUNT';
      return;
    }

    const lifecycle=npBootstrapLifecycle();
    if(lifecycle && lifecycle.journey==='second_life' && ['second_life_available','life2_waiting_mt5'].includes(lifecycle.state)){
      if(sub) sub.textContent=lifecycle.state==='second_life_available'
        ? 'TRADER · SECOND LIFE AVAILABLE'
        : 'TRADER · LIFE 2 · PHASE 1 · WAITING MT5';
      return;
    }
    const dashboard=document.querySelector('.np-module-body');
    const txt=String(dashboard?.textContent||'');
    const waiting=/waiting for mt5 assignment|waiting for fresh mt5|account replacement|account was reset and archived/i.test(txt);
    if(!waiting) return;
    const phase=/phase\s*2/i.test(txt)?'PHASE 2':(/funded/i.test(txt)?'FUNDED':'PHASE 1');
    if(sub) sub.textContent=`TRADER · ${phase} · WAITING FOR MT5`;
  }catch(e){}
}

  });

})();
</script>
