<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="nairapips-trader-release" content="V163_ANNOUNCEMENT_PUSH_REALTIME_2026_10_06">
<title>NairaPips Trader — Lifecycle Coordinated R2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap');
:root{
  --bg:#000000;
  --card:#0a0a0a;
  --card-2:#111111;
  --line:#1f1f1f;
  --line-2:#2a2a2a;
  --line-gold:rgba(212,175,55,.35);
  --gold:#f7c843;
  --gold-2:#ffd968;
  --gold-deep:#c89a25;
  --green:#22c55e;
  --green-deep:#1f8a3a;
  --green-text:#4ade80;
  --red:#ef4444;
  --red-deep:#c2292c;
  --red-text:#f87171;
  --yellow:#fbbf24;
  --blue:#38bdf8;
  --info-text:#7dd3fc;
  --purple:#a78bfa;
  --t1:#ffffff;
  --t2:#e5e5e5;
  --t3:#a1a1aa;
  --t4:#71717a;
  --t5:#52525b;
}

*{box-sizing:border-box;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
html,body{margin:0;background:var(--bg);color:var(--t1);font-family:'Inter',-apple-system,system-ui,sans-serif;font-size:14px;line-height:1.5}
button{cursor:pointer;font-family:inherit}
.mono{font-family:'JetBrains Mono',monospace}
.gold{color:var(--gold)}

/* App shell */
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh;background:var(--bg)}
.sidebar{position:sticky;top:0;height:100vh;overflow-y:auto;background:#000;border-right:1px solid var(--line)}
.brand{padding:18px;border-bottom:1px solid var(--line)}
.brand-name{font-weight:900;font-size:17px;letter-spacing:.02em;color:#fff;text-transform:uppercase}
.brand-name span{color:var(--gold)}
.brand-sub{font-size:10px;color:var(--t4);letter-spacing:.18em;text-transform:uppercase;margin-top:3px;font-weight:600}
.nav-section{padding:14px 18px 4px;color:var(--t4);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.18em}
.nav-item{display:flex;align-items:center;gap:9px;width:auto;margin:0 8px;padding:7px 11px;color:var(--t2);font-weight:500;font-size:13px;background:transparent;border:0;text-align:left;cursor:pointer;font-family:inherit;line-height:1.2;border-radius:6px;transition:background .1s linear}
.nav-item .ico{width:14px;font-size:12px;flex-shrink:0;color:var(--t4)}
.nav-item:hover{background:#161616;color:var(--gold)}
.nav-item:hover .ico{color:var(--gold)}
.nav-item.active{background:rgba(247,200,67,.12);color:var(--gold);font-weight:600}
.nav-item.active .ico{color:var(--gold)}

.sidebar-foot{padding:14px;border-top:1px solid var(--line);margin-top:auto}
.user-card{display:flex;align-items:center;gap:10px;padding:8px;border-radius:8px;background:#161616;margin-bottom:8px}
.user-avatar{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,var(--gold),var(--gold-deep));color:#000;display:grid;place-items:center;font-weight:900;font-size:12px;flex-shrink:0}
.user-info{flex:1;min-width:0}
.user-name{font-weight:700;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user-email{font-size:10px;color:var(--t4);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn-signout{padding:8px;background:transparent;border:1px solid var(--line);color:var(--t2);border-radius:6px;font-size:11px;font-weight:600;width:100%}

/* Main area */
.main{padding:22px}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:12px}
.topbar-greeting h1{font-size:22px;font-weight:800;letter-spacing:.005em;color:#fff;text-transform:uppercase;margin:0}
.topbar-greeting .sub{font-size:12px;color:var(--t3);margin-top:3px}
.topbar-right{display:flex;gap:8px;align-items:center}
.live-pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;background:rgba(34,197,94,.10);border:1px solid rgba(34,197,94,.3);border-radius:8px;font-size:11px;color:var(--green-text);font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.live-dot{width:6px;height:6px;background:var(--green);border-radius:50%;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* Cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;position:relative}
.card-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.card-title{font-size:11px;text-transform:uppercase;letter-spacing:.14em;font-weight:700;color:var(--t3)}
.card-link{font-size:11px;color:var(--gold);font-weight:700;cursor:pointer}
.card-link:hover{text-decoration:underline}

/* Section headers (same as admin) */
.sec-title{font-size:22px;font-weight:800;color:var(--gold);margin:0 0 4px;letter-spacing:.005em;text-transform:uppercase;line-height:1.2}
.sec-sub{color:var(--t3);font-size:13px;margin-bottom:14px}

/* Stat blocks (Account Size / Profit / Drawdown / MT5 Access) — copy from admin */
.stat-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media(max-width:900px){.stat-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.stat-label{color:var(--t3);font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase}
.stat-value{font-family:'JetBrains Mono',monospace;font-size:24px;font-weight:800;color:var(--gold);margin-top:6px;letter-spacing:-.02em;line-height:1.1;text-transform:uppercase}
.stat-value.long{color:var(--green-text)}
.stat-value.short{color:var(--red-text)}
.stat-value.info{color:var(--info-text)}
.stat-sub{font-size:11px;color:var(--t3);margin-top:4px}

/* KPI */
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;position:relative;overflow:hidden}
.kpi::before{content:'';position:absolute;top:0;left:0;width:100%;height:1px;background:linear-gradient(90deg,var(--gold) 0%,transparent 60%);opacity:.4}
.kpi-label{color:var(--t3);font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase}
.kpi-value{font-family:'JetBrains Mono',monospace;font-size:22px;font-weight:800;color:#fff;margin-top:6px;letter-spacing:-.02em}
.kpi-value.gold{color:var(--gold)}
.kpi-value.green{color:var(--green-text)}
.kpi-value.red{color:var(--red-text)}
.kpi-sub{font-size:11px;color:var(--t3);margin-top:5px}

/* Layout */
.grid{display:grid;gap:14px}
.g-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-23{grid-template-columns:2fr 1fr}
.g-32{grid-template-columns:1fr 2fr}
.mb-2{margin-bottom:8px}.mb-3{margin-bottom:12px}.mb-4{margin-bottom:16px}.mb-6{margin-bottom:24px}

@media(max-width:900px){
  .app{grid-template-columns:1fr}
  .sidebar{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;border-top:1px solid var(--line-gold);border-right:0;z-index:100;display:flex;flex-direction:row}
  .sidebar-foot,.brand,.nav-section{display:none}
  .nav-section{display:none}
  .main{padding:14px;padding-bottom:90px}
  .g-2,.g-3,.g-4,.g-23,.g-32{grid-template-columns:1fr}
  .stat-grid{grid-template-columns:repeat(2,1fr)}
  /* mobile bottom nav */
  .sidebar::before{content:''}
  .nav{padding:6px;display:flex;gap:4px;overflow-x:auto;flex:1}
  .nav-item{flex:0 0 auto;flex-direction:column;gap:2px;padding:8px 10px;font-size:10px;text-align:center}
  .nav-item.active{background:rgba(247,200,67,.12)}
}

/* Pills — same as admin */
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:6px;font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;border:1px solid transparent}
.pill-gold{background:rgba(247,200,67,.10);color:var(--gold);border-color:rgba(247,200,67,.35)}
.pill-green{background:rgba(34,197,94,.10);color:var(--green-text);border-color:rgba(34,197,94,.35)}
.pill-red{background:rgba(239,68,68,.10);color:var(--red-text);border-color:rgba(239,68,68,.35)}
.pill-blue{background:rgba(56,189,248,.10);color:var(--info-text);border-color:rgba(56,189,248,.35)}
.pill-yellow{background:rgba(234,179,8,.10);color:#fde68a;border-color:rgba(234,179,8,.35)}
.pill-purple{background:rgba(168,85,247,.10);color:#d8b4fe;border-color:rgba(168,85,247,.35)}
.pill-gray{background:rgba(113,113,122,.10);color:var(--t2);border-color:rgba(113,113,122,.35)}

/* Tags (admin style) */
.tag{display:inline-block;padding:3px 9px;border-radius:6px;font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;border:1px solid transparent}
.tag-gold{background:rgba(247,200,67,.10);color:var(--gold);border-color:rgba(247,200,67,.35)}
.tag-blue{background:rgba(56,189,248,.10);color:var(--info-text);border-color:rgba(56,189,248,.35)}
.tag-green{background:rgba(34,197,94,.10);color:var(--green-text);border-color:rgba(34,197,94,.35)}
.tag-red{background:rgba(239,68,68,.10);color:var(--red-text);border-color:rgba(239,68,68,.35)}
.tag-yellow{background:rgba(234,179,8,.10);color:#fde68a;border-color:rgba(234,179,8,.35)}
.tag-gray{background:rgba(113,113,122,.10);color:var(--t3);border-color:rgba(113,113,122,.35)}

/* Progress + chart */
.prog{height:6px;background:#1a1a1f;border-radius:3px;overflow:hidden;margin-top:8px;position:relative}
.prog-fill{height:100%;border-radius:3px;transition:width .5s ease}
.prog-fill.gold{background:linear-gradient(90deg,var(--gold),var(--gold-2))}
.prog-fill.green{background:linear-gradient(90deg,#16a34a,#4ade80)}
.prog-fill.red{background:linear-gradient(90deg,#dc2626,#f87171)}
.chart-wrap{position:relative;height:220px;width:100%}
.chart{width:100%;height:100%;display:block}

/* Tables */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{padding:10px 12px;text-align:left;font-size:11px;color:var(--t3);text-transform:uppercase;letter-spacing:.1em;font-weight:700;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:hover td{background:#0f0f0f;color:#fff}
.tbl tr:last-child td{border-bottom:0}
.num{font-family:'JetBrains Mono',monospace;font-feature-settings:"tnum" 1;text-align:right}
.num.gold{color:var(--gold)}
.num.long{color:var(--green-text)}
.num.short{color:var(--red-text)}

.sym{font-weight:700;font-family:'JetBrains Mono',monospace;font-size:13px}
.sym-sub{font-size:10px;color:var(--t3);margin-top:2px}
.buy{color:#4ade80;font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.sell{color:#f87171;font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.pnl-pos{color:#4ade80;font-weight:700}
.pnl-neg{color:#f87171;font-weight:700}

/* Forms */
.input,.select,textarea.input{width:100%;padding:11px 14px;background:#000;border:1px solid var(--line);border-radius:10px;color:#fff;font-family:inherit;font-size:13px;outline:none}
.input:focus,.select:focus{border-color:var(--gold)}
textarea.input{resize:vertical;min-height:80px}
.field-label{display:block;font-size:11px;color:var(--t3);letter-spacing:.1em;text-transform:uppercase;font-weight:600;margin-bottom:5px;margin-top:10px}

/* Buttons (same as admin) */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 18px;border-radius:10px;font-weight:700;font-size:13px;border:0;cursor:pointer;transition:all .15s;font-family:inherit}
.btn:hover{filter:brightness(1.1);transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn-gold{background:linear-gradient(180deg,#ffd968,#f7c843)!important;color:#000!important;border:0!important;font-weight:800}
.btn-red{background:#dc2626!important;color:#fff!important;border:0!important}
.btn-green{background:#16a34a!important;color:#fff!important;border:0!important}
.btn-blue{background:var(--blue)!important;color:#000!important;border:0!important}
.btn-ghost{background:transparent!important;color:var(--t2)!important;border:1px solid var(--line-2)!important}
.btn-block{width:100%}
.btn-sm{padding:8px 12px;font-size:12px}
.btn-copy{padding:6px 12px;background:var(--gold);color:#000;border:0;border-radius:6px;font-weight:700;font-size:11px;cursor:pointer}
.btn:disabled{opacity:.4;cursor:not-allowed}

/* Modals */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.85);backdrop-filter:blur(6px);z-index:9999;display:flex;align-items:flex-start;justify-content:center;padding:30px 16px;overflow-y:auto}
.modal-card{background:#0a0a0a;border:2px solid var(--line-gold);border-radius:18px;padding:28px;max-width:520px;width:100%;position:relative;max-height:90vh;overflow-y:auto}
.modal-card h2{font-size:20px;font-weight:900;margin-bottom:14px;text-transform:uppercase;color:#fff}

/* Toasts */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:12px 22px;border-radius:10px;font-weight:800;font-size:13.5px;z-index:99999;color:#000;background:linear-gradient(180deg,#ffd968,#f7c843);box-shadow:0 10px 30px rgba(0,0,0,.7);max-width:90vw;line-height:1.4;text-align:center;white-space:pre-wrap}
.toast-err{background:linear-gradient(180deg,#f87171,#dc2626)!important;color:#fff!important}
.toast-ok{background:linear-gradient(180deg,#86efac,#22c55e)!important;color:#052e16!important}

/* Login */
.login-bg{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:#000}
.login-card{background:#0a0a0a;border:2px solid var(--line-gold);border-radius:18px;padding:36px 28px;max-width:380px;width:100%;text-align:center}
.login-card .brand{font-size:32px;font-weight:900;letter-spacing:.1em;margin-bottom:6px}
.login-card .brand .gold{color:var(--gold)}
.login-card .sub{font-size:10px;color:var(--t4);letter-spacing:.18em;margin-bottom:24px;text-transform:uppercase}
.login-card input{margin:8px 0}
.login-card .btn{width:100%;margin-top:14px}

/* Timeline */
.timeline{position:relative;padding:10px 0}
.timeline::before{content:'';position:absolute;left:18px;top:20px;bottom:20px;width:2px;background:var(--line-gold)}
.tl-item{position:relative;padding:14px 0 14px 50px;min-height:50px}
.tl-dot{position:absolute;left:11px;top:18px;width:16px;height:16px;border-radius:50%;background:var(--bg);border:2px solid var(--gold)}
.tl-dot.done{background:var(--gold)}
.tl-dot.current{background:var(--gold);box-shadow:0 0 0 4px rgba(212,175,55,.2);animation:pulse 2s infinite}
.tl-content{font-size:13px;font-weight:600;color:#fff}
.tl-sub{font-size:11px;color:var(--t3);margin-top:2px}

/* Offer card */
.offer{border:1px solid var(--line-gold);background:linear-gradient(135deg,rgba(212,175,55,.05),rgba(212,175,55,.01));border-radius:14px;padding:20px;position:relative;overflow:hidden}
.offer-tag{display:inline-block;background:var(--gold);color:#000;padding:3px 10px;border-radius:6px;font-size:9px;font-weight:900;letter-spacing:.1em;margin-bottom:10px;text-transform:uppercase}
.offer-title{font-size:18px;font-weight:900;margin-bottom:8px;color:var(--gold)}
.offer-body{font-size:13px;color:var(--t2);line-height:1.6;margin-bottom:14px}
.offer-code{display:flex;align-items:center;gap:10px;background:#000;border:1px dashed var(--gold);border-radius:10px;padding:14px;margin-bottom:12px}
.offer-code .code{font-family:'JetBrains Mono',monospace;font-weight:900;font-size:18px;color:var(--gold);letter-spacing:.05em;flex:1}

/* Account card (trader view) */
.acct-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;position:relative;overflow:hidden}
.acct-card.selected{border-color:var(--line-gold)}
.acct-card .login{font-family:'JetBrains Mono',monospace;font-size:22px;font-weight:900;color:var(--gold);letter-spacing:.05em}

/* Plan card */
.plan-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px;position:relative;transition:all .2s}
.plan-card.popular{border-color:var(--line-gold);box-shadow:0 8px 28px rgba(212,175,55,.12)}
.plan-card .pop-badge{position:absolute;top:-10px;right:14px;background:var(--gold);color:#000;padding:4px 10px;border-radius:6px;font-size:9px;font-weight:900;letter-spacing:.1em;text-transform:uppercase}
.plan-card .name{font-size:18px;font-weight:900;margin:6px 0;color:#fff}
.plan-card .size{font-size:26px;font-weight:900;color:var(--gold);margin:8px 0;font-family:'JetBrains Mono',monospace;letter-spacing:-.02em}
.plan-card .fee{font-size:14px;color:var(--t2);margin:8px 0}

/* Section helper */
.risk-meter{height:6px;border-radius:3px;background:#1a1a1f;overflow:hidden;position:relative;margin-top:8px}
.risk-meter-fill{height:100%;transition:width .5s}
.empty{text-align:center;color:var(--t3);padding:48px 16px;font-size:13px}
.empty .icon{font-size:48px;opacity:.3;margin-bottom:12px}
.hidden{display:none!important}

/* Visible-count chip (admin parity) */
.vis-chip{background:#000;border:1px solid var(--line-gold);color:var(--gold);padding:3px 12px;border-radius:999px;font-size:11px;font-weight:800;letter-spacing:.05em;font-family:'JetBrains Mono',monospace}

.copy-row{display:flex;gap:8px;align-items:center}
.copy-row .input{flex:1;margin:0}

/* small utility */
.flex{display:flex}.flex-wrap{flex-wrap:wrap}.items-center{align-items:center}.gap-2{gap:8px}.gap-3{gap:12px}.justify-between{justify-content:space-between}
.text-sm{font-size:13px}.text-xs{font-size:11px}
.text-gray-400{color:var(--t3)}.text-gray-500{color:var(--t4)}
.font-black{font-weight:900}.font-bold{font-weight:700}
.text-center{text-align:center}.text-right{text-align:right}

.tab-content{animation:fadein .2s ease}
@keyframes fadein{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}




/* ==========================================================
   NAIRAPIPS TRADER OS 2026 — FINTECH COMPLIANCE DESIGN SYSTEM
   Production-safe visual layer only.
   No JavaScript, API endpoint, auth, MT5, Supabase or payment logic changed.
   Purpose: stop CSS fighting, remove overlaps, create one clean premium layout.
   ========================================================== */
:root{
  --np-bg:#030303;
  --np-surface:#0b0b0d;
  --np-surface-2:#121216;
  --np-surface-3:#171719;
  --np-border:rgba(255,255,255,.10);
  --np-border-soft:rgba(255,255,255,.065);
  --np-gold:#f7c843;
  --np-gold-2:#ffdf76;
  --np-gold-dark:#b98a18;
  --np-text:#f8f8f6;
  --np-muted:#a8a8ad;
  --np-muted-2:#777781;
  --np-green:#22c55e;
  --np-red:#ef4444;
  --np-blue:#38bdf8;
  --np-radius:20px;
  --np-radius-lg:28px;
  --np-shadow:0 18px 55px rgba(0,0,0,.42);
}

html,body{
  background:var(--np-bg)!important;
  color:var(--np-text)!important;
  overflow-x:hidden!important;
}
body::before{
  content:"";
  position:fixed;
  inset:0;
  z-index:-1;
  pointer-events:none;
  background:
    radial-gradient(circle at 18% 0%,rgba(247,200,67,.13),transparent 32%),
    radial-gradient(circle at 88% 7%,rgba(247,200,67,.10),transparent 30%),
    linear-gradient(135deg,#020202,#070604 52%,#000);
}
body::after{
  content:"";
  position:fixed;
  inset:0;
  z-index:-1;
  pointer-events:none;
  opacity:.12;
  background-image:linear-gradient(rgba(255,255,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.06) 1px,transparent 1px);
  background-size:48px 48px;
  mask-image:linear-gradient(to bottom,#000,transparent 82%);
}

/* Shell */
.app{
  display:grid!important;
  grid-template-columns:286px minmax(0,1fr)!important;
  min-height:100vh!important;
  background:transparent!important;
}
.sidebar{
  position:sticky!important;
  top:0!important;
  height:100vh!important;
  overflow-y:auto!important;
  background:linear-gradient(180deg,#050505,#000)!important;
  border-right:1px solid rgba(247,200,67,.16)!important;
  box-shadow:18px 0 44px rgba(0,0,0,.28)!important;
}
.sidebar .brand{
  padding:24px 20px 20px!important;
  border-bottom:1px solid rgba(247,200,67,.16)!important;
  background:linear-gradient(135deg,rgba(247,200,67,.09),transparent 62%)!important;
}
.brand-name{

.nav-item.active{background:linear-gradient(135deg,rgba(247,200,67,.23),rgba(247,200,67,.08))!important;border-color:rgba(247,200,67,.35)!important;color:#fff!important;box-shadow:0 10px 24px rgba(247,200,67,.08)!important;}
.sidebar-foot{padding:16px!important;border-top:1px solid rgba(247,200,67,.14)!important;}
.user-card{background:rgba(255,255,255,.045)!important;border:1px solid var(--np-border-soft)!important;border-radius:18px!important;padding:12px!important;}
.user-avatar{border-radius:14px!important;background:linear-gradient(135deg,var(--np-gold-2),var(--np-gold-dark))!important;color:#070707!important;}
.btn-signout{height:42px!important;border-radius:14px!important;background:#080808!important;border:1px solid var(--np-border)!important;color:#fff!important;font-weight:800!important;}

.main{

  width:100%!important;
  max-width:1500px!important;
  margin:0 auto!important;

}
.np-page-frame{width:100%!important;min-width:0!important;}
.np-module-body{display:block!important;width:100%!important;min-width:0!important;}
.hidden{display:none!important;}

/* Premium top hero generated by JS */
.np-cockpit-hero{
  position:relative!important;
  overflow:hidden!important;
  margin:0 0 22px!important;
  padding:28px!important;
  border-radius:var(--np-radius-lg)!important;
  background:
    radial-gradient(circle at 86% 18%,rgba(247,200,67,.24),transparent 34%),
    linear-gradient(135deg,rgba(255,255,255,.075),rgba(10,10,10,.92) 48%,rgba(247,200,67,.08))!important;
  border:1px solid rgba(247,200,67,.24)!important;
  box-shadow:var(--np-shadow)!important;
}
.np-cockpit-hero::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(255,255,255,.05),transparent 42%);pointer-events:none;}
.np-hero-grid{position:relative;z-index:1;display:grid!important;grid-template-columns:minmax(0,1fr) auto!important;gap:20px!important;align-items:start!important;}
.np-eyebrow{display:inline-flex;align-items:center;gap:8px;padding:7px 12px;border-radius:999px;background:rgba(247,200,67,.10);border:1px solid rgba(247,200,67,.28);color:var(--np-gold-2);font-size:10px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;}
.np-eyebrow::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--np-green);box-shadow:0 0 16px var(--np-green);}
.np-hero-title{margin:18px 0 8px!important;color:#fff!important;font-size:clamp(34px,4vw,58px)!important;line-height:.95!important;letter-spacing:-.065em!important;font-weight:950!important;max-width:940px!important;}
.np-hero-sub{color:#c9c6be!important;font-size:15px!important;line-height:1.55!important;max-width:820px!important;}
.np-hero-orb{width:66px!important;height:66px!important;border-radius:22px!important;display:grid!important;place-items:center!important;background:linear-gradient(135deg,#fff1a6,var(--np-gold),var(--np-gold-dark))!important;color:#050505!important;font-size:34px!important;box-shadow:0 18px 42px rgba(247,200,67,.20)!important;}
.np-live-strip{position:relative;z-index:1;display:grid!important;grid-template-columns:repeat(3,minmax(0,1fr))!important;gap:12px!important;margin-top:20px!important;}
.np-live-chip{min-width:0!important;background:rgba(0,0,0,.38)!important;border:1px solid var(--np-border-soft)!important;border-radius:18px!important;padding:14px 16px!important;}
.np-live-chip span{display:block!important;color:var(--np-muted)!important;font-size:10px!important;letter-spacing:.14em!important;text-transform:uppercase!important;font-weight:900!important;margin-bottom:5px!important;}
.np-live-chip b{display:block!important;color:#fff!important;font-size:13px!important;font-weight:900!important;white-space:nowrap!important;overflow:hidden!important;text-overflow:ellipsis!important;}

/* Dashboard topbar */
.topbar{display:flex!important;align-items:flex-start!important;justify-content:space-between!important;gap:16px!important;margin:0 0 18px!important;padding:22px!important;border-radius:var(--np-radius)!important;background:linear-gradient(135deg,rgba(255,255,255,.055),rgba(0,0,0,.35))!important;border:1px solid rgba(247,200,67,.18)!important;box-shadow:var(--np-shadow)!important;}
.topbar-greeting h1{margin:0!important;color:#fff!important;font-size:clamp(24px,2.8vw,38px)!important;line-height:1.05!important;letter-spacing:-.045em!important;text-transform:none!important;font-weight:950!important;}
.topbar-greeting .sub{color:#b7b4ad!important;font-size:13px!important;margin-top:8px!important;}
.topbar-right{display:flex!important;gap:8px!important;align-items:center!important;flex-wrap:wrap!important;}

/* Layout grids */
.grid{display:grid!important;gap:16px!important;min-width:0!important;}
.g-2,.grid-2{grid-template-columns:repeat(2,minmax(0,1fr))!important;}
.g-3{grid-template-columns:repeat(3,minmax(0,1fr))!important;}
.g-4,.stat-grid,.kpi-grid{display:grid!important;grid-template-columns:repeat(4,minmax(0,1fr))!important;gap:14px!important;}
.g-23{grid-template-columns:minmax(0,1.55fr) minmax(310px,.85fr)!important;}
.g-32{grid-template-columns:minmax(310px,.85fr) minmax(0,1.55fr)!important;}
.card,.stat,.kpi,.vault,.plan-card,.purchase-card,.acct-card,.offer,.np-announce-card,.np-hero-breach,.modal-card,.login-card,.empty,.tl-content{
  min-width:0!important;
  position:relative!important;
  overflow:hidden!important;
  border-radius:var(--np-radius)!important;
  background:linear-gradient(145deg,rgba(18,18,21,.88),rgba(5,5,6,.96))!important;
  border:1px solid var(--np-border)!important;
  box-shadow:var(--np-shadow)!important;
}
.card::before,.stat::before,.kpi::before,.vault::before,.plan-card::before,.purchase-card::before,.acct-card::before,.offer::before,.np-announce-card::before,.np-hero-breach::before,.modal-card::before{
  content:"";position:absolute;inset:0 0 auto;height:1px;background:linear-gradient(90deg,transparent,rgba(247,200,67,.55),transparent);opacity:.7;pointer-events:none;
}
.card,.vault,.purchase-card,.acct-card,.offer,.np-announce-card{padding:22px!important;margin-bottom:18px!important;}
.card:hover,.vault:hover,.purchase-card:hover,.acct-card:hover,.offer:hover,.plan-card:hover{border-color:rgba(247,200,67,.26)!important;}
.card-h{display:flex!important;align-items:center!important;justify-content:space-between!important;gap:12px!important;margin-bottom:15px!important;padding-bottom:13px!important;border-bottom:1px solid var(--np-border-soft)!important;}
.card-title,.sec-title{color:#fff!important;font-size:20px!important;font-weight:950!important;line-height:1.1!important;letter-spacing:-.035em!important;text-transform:none!important;margin:0!important;}
.sec-sub{color:var(--np-muted)!important;font-size:13px!important;margin-bottom:14px!important;}

/* KPI and stats */
.stat,.kpi{padding:20px!important;min-height:126px!important;}
.stat-label,.kpi-label,.field-label,.label,.rule-label{color:var(--np-muted)!important;font-size:10px!important;font-weight:900!important;letter-spacing:.13em!important;text-transform:uppercase!important;}
.stat-value,.kpi-value{font-family:'Inter',system-ui,sans-serif!important;color:#fff!important;font-size:clamp(24px,2.5vw,38px)!important;line-height:1!important;letter-spacing:-.055em!important;font-weight:950!important;margin-top:8px!important;}
.stat-value.gold,.kpi-value.gold,.gold{color:var(--np-gold)!important;}
.kpi-value.green,.stat-value.long,.pnl-pos,.num.long{color:var(--np-green)!important;}
.kpi-value.red,.stat-value.short,.pnl-neg,.num.short{color:var(--np-red)!important;}
.stat-sub,.kpi-sub,.sym-sub,.sub,.tl-sub{color:var(--np-muted)!important;font-size:12px!important;line-height:1.45!important;}

/* Buttons, badges and status */
.btn{display:inline-flex!important;align-items:center!important;justify-content:center!important;gap:7px!important;border-radius:14px!important;padding:12px 16px!important;font-size:13px!important;font-weight:900!important;border:1px solid var(--np-border)!important;box-shadow:none!important;transform:none!important;white-space:nowrap!important;}
.btn:hover{filter:brightness(1.05)!important;transform:none!important;}
.btn-gold{background:linear-gradient(135deg,var(--np-gold-2),var(--np-gold) 54%,var(--np-gold-dark))!important;color:#050505!important;border-color:rgba(255,223,118,.50)!important;}
.btn-ghost{background:rgba(255,255,255,.045)!important;color:#fff!important;border-color:var(--np-border)!important;}
.btn-red{background:linear-gradient(135deg,#ff6666,#b91c1c)!important;color:#fff!important;border:0!important;}
.btn-green{background:linear-gradient(135deg,#35e27d,#16803f)!important;color:#031507!important;border:0!important;}
.btn-blue{background:linear-gradient(135deg,#7dd3fc,#0ea5e9)!important;color:#03131a!important;border:0!important;}
.btn-sm{padding:9px 12px!important;font-size:12px!important;border-radius:12px!important;}
.btn-block{width:100%!important;}
.pill,.badge,.tag,.vis-chip,.live-pill,.np-badge-red{display:inline-flex!important;align-items:center!important;gap:6px!important;border-radius:999px!important;padding:7px 11px!important;font-size:10px!important;font-weight:900!important;letter-spacing:.10em!important;text-transform:uppercase!important;border:1px solid rgba(247,200,67,.25)!important;background:rgba(247,200,67,.10)!important;color:var(--np-gold-2)!important;}
.pill-green,.tag-green{border-color:rgba(34,197,94,.30)!important;background:rgba(34,197,94,.10)!important;color:#7ee8a0!important;}
.pill-red,.tag-red{border-color:rgba(239,68,68,.35)!important;background:rgba(239,68,68,.10)!important;color:#ff9a9a!important;}
.pill-blue,.tag-blue{border-color:rgba(56,189,248,.35)!important;background:rgba(56,189,248,.10)!important;color:#8be0ff!important;}
.pill-yellow,.tag-yellow{border-color:rgba(247,200,67,.35)!important;background:rgba(247,200,67,.10)!important;color:#ffe28a!important;}
.live-pill{background:rgba(34,197,94,.10)!important;border-color:rgba(34,197,94,.28)!important;color:#7ee8a0!important;}

/* Forms */
.input,.select,input,textarea,select{
  width:100%!important;
  min-width:0!important;
  background:rgba(0,0,0,.38)!important;
  border:1px solid var(--np-border)!important;
  color:#fff!important;
  border-radius:14px!important;
  padding:13px 14px!important;
  font-size:13px!important;
  outline:none!important;
  box-shadow:none!important;
}
textarea.input,textarea{min-height:112px!important;resize:vertical!important;}
.input:focus,.select:focus,input:focus,textarea:focus,select:focus{border-color:rgba(247,200,67,.52)!important;box-shadow:0 0 0 4px rgba(247,200,67,.08)!important;}
.copy-row{display:flex!important;align-items:center!important;gap:8px!important;min-width:0!important;}
.copy-row .input{flex:1 1 auto!important;min-width:0!important;}

/* Tables and ledgers */
.table-wrap,.trades-table-wrap,.np-table-shell{width:100%!important;max-width:100%!important;overflow:auto!important;border-radius:18px!important;background:rgba(255,255,255,.025)!important;border:1px solid var(--np-border-soft)!important;padding:8px!important;margin-bottom:18px!important;}
.tbl,.trades-table,.np-ledger-table{width:100%!important;min-width:760px!important;border-collapse:separate!important;border-spacing:0 8px!important;font-size:13px!important;}
.tbl th,.trades-table th,.np-ledger-table th{padding:4px 12px 8px!important;color:var(--np-gold-2)!important;background:transparent!important;border:0!important;font-size:10px!important;letter-spacing:.12em!important;text-transform:uppercase!important;white-space:nowrap!important;}
.tbl td,.trades-table td,.np-ledger-table td{padding:14px 12px!important;background:rgba(255,255,255,.045)!important;border-top:1px solid var(--np-border-soft)!important;border-bottom:1px solid var(--np-border-soft)!important;color:#f1f1ef!important;vertical-align:middle!important;}
.tbl tr td:first-child,.trades-table tr td:first-child,.np-ledger-table tr td:first-child{border-left:1px solid var(--np-border-soft)!important;border-radius:14px 0 0 14px!important;}
.tbl tr td:last-child,.trades-table tr td:last-child,.np-ledger-table tr td:last-child{border-right:1px solid var(--np-border-soft)!important;border-radius:0 14px 14px 0!important;}
.tbl tr:hover td,.trades-table tr:hover td,.np-ledger-table tr:hover td{background:rgba(247,200,67,.055)!important;}
.num{font-family:'JetBrains Mono',monospace!important;text-align:right!important;font-size:13px!important;letter-spacing:0!important;font-weight:800!important;}

/* Progress and monitoring */
.prog,.risk-meter{height:10px!important;background:#111!important;border:1px solid var(--np-border-soft)!important;border-radius:999px!important;overflow:hidden!important;margin-top:9px!important;}
.prog-fill,.risk-meter-fill{height:100%!important;border-radius:999px!important;}
.prog-fill.gold{background:linear-gradient(90deg,var(--np-gold-dark),var(--np-gold-2))!important;}
.prog-fill.green{background:linear-gradient(90deg,#16a34a,#4ade80)!important;}
.prog-fill.red{background:linear-gradient(90deg,#b91c1c,#f87171)!important;}
/* NAIRAPIPS PASSED / WAITING BLUE VISIBILITY PATCH */
.pill-blue,.tag-blue{
  background:linear-gradient(135deg, rgba(14,165,233,.95), rgba(56,189,248,.55))!important;
  border-color:rgba(125,211,252,.95)!important;
  color:#e0f7ff!important;
  box-shadow:0 0 0 1px rgba(56,189,248,.28), 0 0 22px rgba(56,189,248,.28)!important;
}
.prog-fill.blue{background:linear-gradient(90deg,#0284c7,#38bdf8,#7dd3fc)!important;}
.np-smart-hero-status.passed-status,
.np-smart-panel.passed-account,
.np-smart-panel.progress.passed-progress{
  border-color:rgba(56,189,248,.70)!important;
  background:linear-gradient(135deg,rgba(14,165,233,.16),rgba(0,0,0,.42) 55%,rgba(56,189,248,.08))!important;
  box-shadow:0 0 0 1px rgba(56,189,248,.18),0 20px 70px rgba(14,165,233,.14)!important;
}
.np-smart-hero-status.passed-status strong{color:#dff8ff!important;text-shadow:0 0 18px rgba(56,189,248,.45)!important;}
.np-smart-panel-head .pill-blue{font-size:10px!important;padding:7px 12px!important;}

.chart-wrap{height:240px!important;min-height:240px!important;width:100%!important;border-radius:18px!important;background:rgba(255,255,255,.025)!important;border:1px solid var(--np-border-soft)!important;padding:10px!important;}
.chart{width:100%!important;height:100%!important;display:block!important;background:transparent!important;border:0!important;}

/* Module-specific structure */
.module-dashboard .np-cockpit-hero{margin-bottom:18px!important;}
.module-dashboard .topbar{margin-bottom:18px!important;}
.module-dashboard .np-module-body{display:block!important;}
.module-mt5vault .vault,.module-accounts .acct-card,.module-purchase .purchase-card{display:block!important;}
.module-mt5vault .grid,.module-accounts .grid,.module-plans .grid,.module-offers .grid{grid-template-columns:repeat(auto-fit,minmax(310px,1fr))!important;}
.module-plans .plan-card{padding:24px!important;display:flex!important;flex-direction:column!important;gap:16px!important;min-height:360px!important;}
.plan-card .name{font-size:22px!important;font-weight:950!important;letter-spacing:-.04em!important;color:#fff!important;}
.plan-card .size{font-family:'Inter',system-ui,sans-serif!important;font-size:clamp(30px,3vw,46px)!important;line-height:1!important;letter-spacing:-.06em!important;color:var(--np-gold)!important;font-weight:950!important;}
.plan-card .fee,.fee{font-size:18px!important;font-weight:900!important;color:#fff!important;}
.rules{background:rgba(0,0,0,.30)!important;border:1px solid var(--np-border-soft)!important;border-radius:16px!important;padding:14px!important;}
.rule-value{font-weight:900!important;color:#fff!important;}
.module-support .g-32{grid-template-columns:minmax(0,1.15fr) minmax(300px,.85fr)!important;}
.module-profile .g-2{grid-template-columns:repeat(2,minmax(0,1fr))!important;}
.module-announcements .np-announce-card,.np-announce-card{background:radial-gradient(circle at 95% 0%,rgba(247,200,67,.16),transparent 35%),linear-gradient(145deg,rgba(18,18,20,.88),rgba(5,5,6,.96))!important;border-color:rgba(247,200,67,.24)!important;}
.np-announce-title{color:#fff!important;font-size:clamp(24px,2.4vw,36px)!important;line-height:1.05!important;letter-spacing:-.05em!important;font-weight:950!important;margin:14px 0 8px!important;}
.np-announce-body{color:#ddd8cf!important;font-size:15px!important;line-height:1.65!important;}
.offer{border-color:rgba(34,197,94,.22)!important;background:radial-gradient(circle at 95% 0%,rgba(34,197,94,.10),transparent 35%),linear-gradient(145deg,rgba(18,18,20,.88),rgba(5,5,6,.96))!important;}
.offer-title{font-size:22px!important;font-weight:950!important;color:#fff!important;letter-spacing:-.04em!important;}
.offer-code{display:flex!important;align-items:center!important;gap:10px!important;background:#060606!important;border:1px dashed rgba(247,200,67,.42)!important;border-radius:16px!important;padding:12px!important;}
.offer-code .code,.code{font-family:'JetBrains Mono',monospace!important;color:var(--np-gold)!important;font-weight:900!important;font-size:15px!important;}

/* Breach banner */
.np-hero-breach{padding:26px!important;background:radial-gradient(circle at 88% 0%,rgba(239,68,68,.22),transparent 35%),linear-gradient(145deg,#250707,#050505)!important;border-color:rgba(239,68,68,.42)!important;}
.np-hero-row{display:grid!important;grid-template-columns:minmax(0,1fr) 220px!important;gap:18px!important;align-items:start!important;}
.np-breach-title{font-size:clamp(34px,4vw,58px)!important;line-height:.95!important;letter-spacing:-.065em!important;color:#ff8585!important;font-weight:950!important;margin:16px 0 8px!important;}
.np-breach-sub{color:#f3d9d9!important;font-size:15px!important;line-height:1.55!important;}
.np-status-box,.np-breach-stat{background:rgba(0,0,0,.38)!important;border:1px solid rgba(255,255,255,.10)!important;border-radius:18px!important;padding:18px!important;}
.np-status-value,.np-breach-stat .value{font-size:24px!important;font-weight:950!important;color:#fff!important;letter-spacing:-.04em!important;}
.np-breach-grid{display:grid!important;grid-template-columns:repeat(3,minmax(0,1fr))!important;gap:12px!important;margin-top:16px!important;}
.np-hero-actions{display:flex!important;gap:10px!important;flex-wrap:wrap!important;margin-top:16px!important;}

/* Timeline and empty states */
.timeline{position:relative!important;padding:8px 0!important;margin-left:10px!important;}
.timeline::before{left:18px!important;background:rgba(247,200,67,.25)!important;}
.tl-item{padding:12px 0 12px 48px!important;}
.tl-dot{left:10px!important;background:var(--np-gold)!important;border-color:var(--np-gold-dark)!important;}
.tl-content{padding:16px!important;}
.empty{text-align:center!important;color:var(--np-muted)!important;padding:32px!important;border-style:dashed!important;background:rgba(247,200,67,.035)!important;}
.empty .icon{font-size:36px!important;opacity:.45!important;}

/* Login */
.login-bg{background:radial-gradient(circle at 50% 0%,rgba(247,200,67,.18),transparent 40%),#030303!important;}
.login-card{max-width:430px!important;padding:34px!important;border-color:rgba(247,200,67,.30)!important;}
.login-card .brand{font-size:34px!important;font-weight:950!important;letter-spacing:-.04em!important;background:transparent!important;border:0!important;padding:0!important;}
.login-card .sub{color:var(--np-muted)!important;}

/* Hard anti-overlap safety */
*,*::before,*::after{box-sizing:border-box!important;}
img,canvas,svg,video{max-width:100%!important;}
.card *, .vault *, .acct-card *, .purchase-card *, .plan-card *, .offer *, .np-announce-card *, .np-hero-breach *{max-width:100%;}
[style*="grid-template-columns"]{min-width:0;}
[style*="position:absolute"]{max-width:100%;}

@media(max-width:1180px){
  .app{grid-template-columns:1fr!important;}
  .sidebar{position:relative!important;height:auto!important;max-height:none!important;}
  .nav{display:grid!important;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))!important;gap:6px!important;}
  .nav-section{grid-column:1/-1!important;}
  .sidebar-foot{display:none!important;}
  .main{padding:18px!important;}
  .g-4,.stat-grid,.kpi-grid{grid-template-columns:repeat(2,minmax(0,1fr))!important;}
  .g-3,.g-2,.grid-2,.g-23,.g-32,.module-support .g-32,.module-profile .g-2{grid-template-columns:1fr!important;}
  .np-live-strip{grid-template-columns:1fr!important;}
  .np-hero-orb{display:none!important;}
  .np-hero-row{grid-template-columns:1fr!important;}
  .np-breach-grid{grid-template-columns:1fr!important;}
}

/* ====== MT5 Account status classifier — PRODUCTION SAFE ======

     funded_active        → ACTIVE
     archived_phase1      → ARCHIVED
     archived_phase2      → ARCHIVED
     breached_archived    → BREACHED + ARCHIVED

   POLICY: Multiple active accounts per trader are ALLOWED.
           A trader can run several challenges/plans simultaneously.
           Each account is independent (separate MT5 login, equity, DD, lifecycle).
           Archived/breached accounts are kept as permanent history.

function mt5LifecycleBlob(a){
  if(a && typeof a==='object') return [
    a.account_status,a.status,a.lifecycle_state,a.challenge_state,a.phase_pass_status,
    a.pass_status,a.stage,a.phase,a.waiting_for_stage,a.archive_reason,a.admin_note

  return String(a||'').toLowerCase().replace(/[-\s]+/g,'_');
}
function mt5Bucket(value){

  if(value && typeof value==='object'){
    const stage=String(value.stage||value.phase||'').toLowerCase().replace(/[-\s]+/g,'_');
    const status=String(value.account_status||value.status||'').toLowerCase().replace(/[-\s]+/g,'_');
    const liveStatus=['assigned_active','phase1_active','phase2_active','funded_active','live_active','active','current_active','assigned'].some(x=>status.includes(x));
    if((stage.includes('funded') || stage==='live') && liveStatus) return 'funded';
    if((stage.includes('phase1') || stage.includes('phase2')) && liveStatus) return 'active';

  if(s.includes('waiting') || s.includes('pending_assignment') || s.includes('awaiting_mt5')) return 'waiting';
  if(s.includes('breach') || s.includes('max_drawdown')) return 'breached';

function npMergeAccountRows(...groups){

function npProgressionSourceConsumedForever(a){

  const pid=String(a.purchase_id||a.challenge_purchase_id||'').trim();
  const sourceStage=npStageRaw(a);
  const target=String(a.next_stage||'').toLowerCase() ||
    (sourceStage.includes('phase2')?'funded':'funded');
  const sourceTime=new Date(a.passed_at||a.archived_at||a.updated_at||a.created_at||0).getTime()||0;
  const sourceSize=Number(a.account_size||a.start_balance||0)||0;

  return all.some(x=>{
    if(!x || String(x.id||'')===sourceId || !String(x.mt5_login||'').trim()) return false;
    const blob=[x.account_status,x.status,x.archive_reason,x.admin_note,x.message].join(' ').toLowerCase();
    if(blob.includes('wrong_assignment_recalled')||blob.includes('recalled_wrong_assignment')||blob.includes('admin_recall_wrong_assignment')) return false;

    const parent=String(x.previous_trader_account_id||x.replaces_trader_account_id||'').trim();
    if(parent && parent===sourceId) return true;

    const xpid=String(x.purchase_id||x.challenge_purchase_id||'').trim();
    if(pid && xpid!==pid) return false;

    const xs=npStageRaw(x);
    if(target.includes('funded') && !xs.includes('funded')) return false;
    if(target.includes('phase2') && !(xs.includes('phase2')||xs.includes('funded'))) return false;

    if(!pid){
      const sz=Number(x.account_size||x.start_balance||0)||0;

    }

    const childTime=new Date(x.assigned_at||x.started_at||x.created_at||x.updated_at||0).getTime()||0;
    if(sourceTime && childTime && childTime<=sourceTime) return false;

  if(npIsBreached(a)) return 'BREACHED';
  if(npIsPassed(a)) return npNextWaitingLabel(a) || 'PASSED';
  return npDisplayStatus(a);
}
function npFriendlyArchiveLabel(a){
  const s=String((a&&a.account_status)||'').toLowerCase();
  if(s.includes('archived_reset')) return 'RESET HISTORY';
  if(s.includes('breached')) return 'BREACHED HISTORY';
  if(s.includes('archived_phase')) return 'PASSED HISTORY';
  if(s.includes('archived')) return 'ARCHIVED HISTORY';
  return 'ACCOUNT HISTORY';
}
function npFriendlyStageStatusLine(a){
  const stage=(a&&a._np_display_stage_label)||npStageLabel(a||{});
  return `${String(stage).replace(/_/g,' ').toUpperCase()} · ${npFriendlyAccountStatus(a)}`;
}
function npDecorateDisplayAccount(a){
  const x=Object.assign({}, a||{});
  x._np_display_stage = npStageRaw(x).includes('phase2')?'phase2':(npStageRaw(x).includes('funded')?'funded':'phase1');
  x._np_display_stage_label = npStageLabel(x);
  x._np_display_passed = npIsPassed(x);
  x._np_display_status = npDisplayStatus(x);
  if(x._np_display_passed && !String(x.account_status||'').toLowerCase().includes('archived') && !String(x.account_status||'').toLowerCase().includes('passed')){
    x._np_display_status = npDisplayStatus(x);
  }
  return x;
}
function npFixDuplicateStageSameLogin(accounts){
  const rows=(accounts||[]).map(npDecorateDisplayAccount);
  // MULTI-ACCOUNT SAFETY: never compare stages across the trader's whole portfolio.
  // A funded account from one purchase must not force a newly purchased Phase 1 account
  // into PASSED/history state. Stage progression is handled only inside a proven account
  // lineage (the same MT5 login duplicate guard below), not globally across all accounts.
  const byLogin={};
  rows.forEach(a=>{ const l=String(a.mt5_login||'').trim(); if(l) (byLogin[l]||(byLogin[l]=[])).push(a); });
  const removeIds=new Set();
  Object.values(byLogin).forEach(group=>{
    const stages=[...new Set(group.map(g=>npStageRank(g.stage)))].sort((a,b)=>a-b);
    if(group.length>1 && stages.length>1){
      const phase1=group.find(g=>npStageRank(g.stage)===1);
      const next=group.find(g=>npStageRank(g.stage)>1);
      /* Same MT5 login cannot be proof of a new Phase 2/Funded assignment.
         Keep the Phase 1 row visible and treat target-hit as PASSED PHASE 1.
         Do not delete backend data; only hide duplicate next-stage display rows. */
      if(phase1 && next){
        // Copy live metrics from the duplicate row if the Phase 1 row has old/empty metrics.
        ['current_balance','current_equity','balance','equity','profit','profit_percent','dd_used_percent','absolute_drawdown_percent','max_drawdown_used','mt5_master_password','mt5_password','master_password','mt5_investor_password','investor_password','mt5_server'].forEach(k=>{
          if((phase1[k]===undefined || phase1[k]===null || phase1[k]==='' || Number(phase1[k])===0) && next[k]!==undefined && next[k]!==null && next[k]!=='') phase1[k]=next[k];
        });
        phase1.stage='phase1';
        phase1._np_display_stage='phase1';
        phase1._np_display_stage_label='PHASE 1';
        phase1._np_display_passed=npIsPassed(phase1);
        phase1._np_display_status=npDisplayStatus(phase1);
        group.forEach(g=>{ if(g!==phase1 && npStageRank(g.stage)>1) removeIds.add(String(g.id)); });
      }
    }
  });
  return rows.filter(a=>!removeIds.has(String(a.id))).map(npDecorateDisplayAccount);
}
function npOverviewPriority(a){
  if(!a || !npIsOverviewSelectable(a)) return -999;
  const bucket=mt5Bucket(a);
  const stage=npStageRank(a.waiting_for_stage||a._np_display_stage||a.stage);
  const hasLogin=!!String(a.mt5_login||'').trim();
  // Live trading accounts must always own the default Overview.
  if(bucket==='funded' && hasLogin) return 500;
  if(bucket==='active' && hasLogin && stage===2) return 400;
  if(bucket==='active' && hasLogin) return 300;
  // Genuine progression/waiting rows remain visible, but never displace live accounts.
  if(npIsPassed(a)) return 250 + stage;
  if(npIsWaitingAccount(a) && !npIsResetWaiting(a)) return 200 + stage;
  if(npIsResetWaiting(a)) return 100 + stage;
  return 0;
}
function npSortOverviewAccounts(accounts){
  return (accounts||[]).filter(npIsOverviewSelectable).slice().sort((a,b)=>{
    const d=npOverviewPriority(b)-npOverviewPriority(a);
    if(d) return d;
    return new Date(b.updated_at||b.created_at||0)-new Date(a.updated_at||a.created_at||0);
  });
}
function npChooseDisplayCurrent(current, accounts){
  const list=npFixDuplicateStageSameLogin(accounts||[]);
  const eligible=npSortOverviewAccounts(list);
  const traderPointerId=String(
    SESSION.data?.trader?.current_account_id
    || SESSION.trader?.current_account_id
    || ''
  ).trim();
  const bootstrapCurrentId=String((current&&current.id)||'').trim();
  const selectedId=String(SESSION.selectedAccountId||'').trim();

  // 1) Explicit user selection is respected only if the row is still a true
  // current/actionable lifecycle. History can never resurrect itself.
  if(SESSION.userSelectedAccountId && selectedId){
    const chosen=eligible.find(a=>String(a.id||'')===selectedId);
    if(chosen) return npDecorateDisplayAccount(chosen);
  }

  // 2) Backend current_account_id is the primary lifecycle authority.
  const authoritativeId=traderPointerId || bootstrapCurrentId;
  if(authoritativeId){
    const chosen=eligible.find(a=>String(a.id||'')===authoritativeId);
    if(chosen) return npDecorateDisplayAccount(chosen);
  }

  // 3) If there is no current pointer, only a genuinely unresolved progression
  // row (passed/waiting) or a live account may become the display account.
  return npDecorateDisplayAccount(eligible[0] || current || {});
}
function npApplyAccountDisplaySafety(){
  const bootAccounts = npMergeAccountRows(
    SESSION.allAccounts || [],
    SESSION.data?.current_account ? [SESSION.data.current_account] : [],
    SESSION.data?.active_accounts || [],
    SESSION.data?.accounts || [],
    SESSION.data?.all_accounts || [],
    SESSION.data?.pending_replacements || []
  );
  SESSION.allAccounts = npMergeAccountRows(npFixDuplicateStageSameLogin(bootAccounts));
  SESSION.accounts = SESSION.allAccounts;
  const currentCandidate=SESSION.data?.current_account||{};
  if(npHappyExactDeadDisplayRow(currentCandidate)){
    SESSION.data.current_account=null;
  }
  if(currentCandidate.id && !npHappyExactDeadDisplayRow(currentCandidate)){
    const canonical=SESSION.allAccounts.find(x=>String(x.id||'')===String(currentCandidate.id||''));
    if(canonical && !npIsOverviewSelectable(canonical)) SESSION.data.current_account=null;
    else if(canonical) SESSION.data.current_account=canonical;
  }
  const chosen = npChooseDisplayCurrent(SESSION.data?.current_account, SESSION.allAccounts);
  if(chosen && chosen.id){
    SESSION.data.current_account = chosen;

    const serverPointerId=String(
      SESSION.data?.trader?.current_account_id
      || SESSION.trader?.current_account_id
      || ''
    ).trim();
    const serverPointedRow = serverPointerId
      ? SESSION.allAccounts.find(a=>String(a.id||'')===serverPointerId && npIsLiveSelectableAccount(a))
      : null;

    // lifecycleAccountId is the server-owned default card; selectedAccountId may
    // temporarily differ only after the trader explicitly selects another account.
    SESSION.lifecycleAccountId = String(
      (serverPointedRow && serverPointedRow.id)
      || chosen.id
    );

    if(!SESSION.userSelectedAccountId || !npGlobalSelectableAccounts().some(a=>String(a.id)===String(SESSION.selectedAccountId||''))){
      SESSION.selectedAccountId = SESSION.lifecycleAccountId;
      SESSION.userSelectedAccountId = false;
      const exactDefault=npGlobalSelectableAccounts().find(a=>String(a.id)===SESSION.lifecycleAccountId);
      if(exactDefault) SESSION.data.current_account=exactDefault;
    }
  }
}
function npEnsureSelectedAccountSafe(){
  const stickyFunded=npEnforceFundedAuthorityLockV142();
  if(stickyFunded && !SESSION.userSelectedAccountId) return;

  const rows=npGlobalSelectableAccounts();
  if(!rows.length) return;

  if(SESSION.adminFocusAccountId){
    const focused=rows.find(a=>String(a.id||'')===String(SESSION.adminFocusAccountId));
    if(focused){
      SESSION.selectedAccountId=String(focused.id);
      SESSION.userSelectedAccountId=true;
      SESSION.data.current_account=focused;
      return;
    }
  }

  const selected=rows.find(a=>String(a.id)===String(SESSION.selectedAccountId||''));
  if(selected){
    SESSION.data.current_account=selected;
    return;
  }
  const chosen=rows.find(npIsLiveSelectableAccount) || rows[0];
  SESSION.selectedAccountId=String(chosen.id);
  SESSION.lifecycleAccountId=String(chosen.id);
  SESSION.userSelectedAccountId=false;
  SESSION.data.current_account=chosen;
}

const fmt = {
  money:n=>n==null||n===''?'—':'₦'+Number(n).toLocaleString('en-NG',{maximumFractionDigits:0}),
  pct:n=>n==null||n===''?'—':(Number(n).toFixed(1)+'%'),
  num:n=>n==null||n===''?'—':Number(n).toLocaleString('en-NG',{maximumFractionDigits:2}),
  date:s=>s?new Date(s).toLocaleDateString('en-NG',{day:'2-digit',month:'short',year:'numeric'}):'—',
  time:s=>s?new Date(s).toLocaleString('en-NG',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}):'—',
  rel:s=>{
    if(!s)return'—';
    const ms=Date.now()-new Date(s).getTime();
    const mins=Math.floor(ms/60000);
    if(mins<1)return'just now';
    if(mins<60)return mins+'m ago';
    const hrs=Math.floor(mins/60);
    if(hrs<24)return hrs+'h ago';
    return fmt.date(s);
  }
};


// NairaPips assignment-date display helper
// One source of truth for MT5 assignment dates across Dashboard, MT5 Accounts,
// MT5 Vault, Timeline and account cards. Uses backend display_assigned_at first,
// then safe legacy fallbacks so assignment date/time never appears blank during disputes.
function npAssignedAt(a){
  a = a || {};
  return a.display_assigned_at || a.assignment_date || a.assigned_at || a.mt5_assigned_at || a.started_at || a.mt5_updated_at || a.approved_at || a.created_at || a.updated_at || '';
}
function npAssignedDate(a){
  const d = npAssignedAt(a);
  return d ? new Date(d).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}) : '—';
}
function npAssignedTime(a){
  const d = npAssignedAt(a);
  return d ? new Date(d).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}) : '—';
}
function npAssignedDateTime(a){

  return d ? new Date(d).toLocaleString('en-GB',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}) : '—';
}
function npAssignedRel(a){

}


// NairaPips operational timestamp standard
// Every meaningful lifecycle/business event should communicate WHEN it happened.
// IMPORTANT: event-specific backend timestamps are preferred. We do not invent times.
function npDateTimeValue(v){
  if(!v) return '—';
  const d=new Date(v);
  if(Number.isNaN(d.getTime())) return '—';
  return d.toLocaleString('en-GB',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
}
function npEventAt(a,event){
  a=a||{};
  const e=String(event||'').toLowerCase();
  const first=(...vals)=>vals.find(v=>v && !Number.isNaN(new Date(v).getTime())) || '';
  if(e==='assigned') return npAssignedAt(a);
  if(e==='passed') return first(a.passed_at,a.phase_passed_at,a.challenge_passed_at,a.target_hit_at,a.completed_at);
  if(e==='breached') return first(a.breached_at,a.breach_at,a.breach_detected_at,a.breach_created_at);
  if(e==='reset') return first(a.reset_at,a.reset_requested_at,a.replaced_at,(npIsResetArchive(a)?a.archived_at:''));
  if(e==='archived') return first(a.archived_at,a.closed_at);
  if(e==='locked') return first(a.locked_at,a.mt5_access_disabled_at,a.disabled_at,a.access_disabled_at);
  if(e==='funded') return first(a.funded_at,a.funded_assigned_at,a.funded_started_at,(String(a.stage||'').toLowerCase().includes('funded')?npAssignedAt(a):''));
  if(e==='updated') return first(a.updated_at);
  if(e==='created') return first(a.created_at);
  return '';
}
function npEventStamp(a,event){
  return npDateTimeValue(npEventAt(a,event));
}
function npLifecycleTimestampRows(a){
  a=a||{};
  const rows=[];
  const push=(label,event)=>{
    const when=npEventAt(a,event);
    if(when) rows.push({label,when,text:npDateTimeValue(when)});
  };
  push('Assigned','assigned');
  if(npIsPassed(a) || npEventAt(a,'passed')) push('Passed','passed');
  if(npIsBreached(a) || npEventAt(a,'breached')) push('Breached','breached');
  if(npIsResetArchive(a) || npEventAt(a,'reset')) push('Reset','reset');
  const archived=String(a.account_status||a.status||'').toLowerCase().includes('archiv') || !!a.archived_at;
  if(archived && !npIsResetArchive(a)) push('Archived','archived');
  if(a.mt5_access_disabled && npEventAt(a,'locked')) push('Locked','locked');
  return rows;
}
function npLifecycleTimestampHtml(a,compact=false){
  const rows=npLifecycleTimestampRows(a);
  if(!rows.length) return `<div style="font-size:10px;color:var(--text-mute);margin-top:7px">Timestamp unavailable</div>`;
  if(compact){
    return `<div style="margin-top:7px;display:flex;flex-wrap:wrap;gap:5px 10px;font-size:10px;color:var(--text-mute)">`+
      rows.map(r=>`<span><b style="color:var(--t2)">${esc(r.label)}:</b> ${esc(r.text)}</span>`).join('')+
      `</div>`;
  }
  return `<div style="margin-top:10px;padding-top:9px;border-top:1px solid var(--border);display:grid;gap:5px">`+
    rows.map(r=>`<div style="display:flex;justify-content:space-between;gap:12px;font-size:10.5px"><span style="color:var(--text-mute);font-weight:800;text-transform:uppercase;letter-spacing:.06em">${esc(r.label)}</span><span class="mono" style="color:var(--t2);text-align:right">${esc(r.text)}</span></div>`).join('')+
    `</div>`;
}

async function npFetchJsonWithTimeout(url, options={}, timeoutMs=12000){
  const controller = new AbortController();
  const timeout = setTimeout(()=>controller.abort(), timeoutMs);
  try{
    const r = await fetch(url, {...options, signal: controller.signal});
    const data = await r.json().catch(()=>({success:false,error:'Invalid server response'}));
    return {r, data};
  }catch(e){
    if(e && (e.name === 'AbortError' || String(e.message||'').toLowerCase().includes('aborted'))){
      const err = new Error('NairaPips server is taking longer than expected. Retrying connection...');
      err.code = 'NP_TIMEOUT';
      throw err;
    }
    throw e;
  }finally{
    clearTimeout(timeout);
  }
}
const NP_INFLIGHT = new Map();
async function safeFetchJson(url, options={}, timeoutMs=12000, dedupe=true){
  const method = String(options.method || 'GET').toUpperCase();
  const headers = Object.assign({}, options.headers || {});
  if(SESSION.auth_token && String(url).startsWith(API)){
    headers.Authorization = 'Bearer ' + SESSION.auth_token;
  }
  options = Object.assign({}, options, {headers});
  const key = method + ' ' + url + ' ' + (options.body || '');
  if(dedupe && NP_INFLIGHT.has(key)) return NP_INFLIGHT.get(key);

  const run = (async()=>{
    let lastError = null;
    for(let attempt=1; attempt<=2; attempt++){
      try{
        const {r,data} = await npFetchJsonWithTimeout(url, options, timeoutMs);
        if(r && r.status >= 500 && attempt < 2){
          await new Promise(resolve=>setTimeout(resolve, 900));
          continue;
        }
        return data;
      }catch(e){
        lastError = e;
        const transient = e?.code === 'NP_TIMEOUT'
          || e?.name === 'TypeError'
          || /network|failed to fetch|timeout|longer than expected/i.test(String(e?.message||''));
        if(!transient || attempt >= 2) throw e;
        await new Promise(resolve=>setTimeout(resolve, 900));
      }
    }
    throw lastError || new Error('Connection failed');
  })().finally(()=>NP_INFLIGHT.delete(key));

  if(dedupe) NP_INFLIGHT.set(key, run);
  return run;
}

function npPublicLoginMessage(error){
  const raw=String(error?.message||error||'').trim();
  const low=raw.toLowerCase();

  // Never expose browser/network implementation errors to traders.
  if(
    error?.name==='AbortError'
    || error?.code==='NP_TIMEOUT'
    || /signal is aborted|aborted without reason|aborterror|failed to fetch|networkerror|network request failed|load failed|timeout|timed out|longer than expected/i.test(raw)
  ){
    return 'Secure connection is temporarily delayed. Please try again.';
  }

  // Preserve useful authentication messages from NairaPips itself.
  if(/invalid login|invalid credentials|incorrect password|wrong password|trader not found/i.test(low)){
    return 'Email or password is incorrect. Please check and try again.';
  }
  if(/password reset|required.*password|temporary password/i.test(low)){
    return raw;
  }

  // No raw server/browser exception is ever printed on the public login screen.
  return 'We could not sign you in right now. Please try again.';
}

async function doLogin(){
  const lookup=document.getElementById('li-lookup').value.trim();
  const password=document.getElementById('li-pass').value;
  const err=document.getElementById('li-err');
  const btn=document.getElementById('li-btn');

  if(!lookup||!password){
    if(err) err.textContent='Enter email and password';
    return;
  }

  if(err) err.textContent='';
  if(btn){
    btn.disabled=true;
    btn.innerHTML='<span style="opacity:.7">Signing in securely…</span>';
  }

  try{
    // PUBLIC LOGIN SAFETY:
    // Do not attach AbortController to this customer-facing authentication request.
    // Some mobile Chromium builds expose the implementation error
    // "signal is aborted without reason" when an AbortSignal is cancelled.
    // A soft timeout gives the customer a clean response without aborting fetch().
    const requestPromise = fetch(API+'/login_trader',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({lookup:lookup.toLowerCase(),password}),
      cache:'no-store'
    }).then(async r=>{
      const data=await r.json().catch(()=>({success:false,error:'Invalid server response'}));
      return {r,data};
    });

    const timeoutPromise = new Promise((_,reject)=>{
      setTimeout(()=>{
        const e=new Error('LOGIN_SOFT_TIMEOUT');
        e.code='NP_LOGIN_TIMEOUT';
        reject(e);
      },15000);
    });

    const {r,data}=await Promise.race([requestPromise,timeoutPromise]);

    if(!r.ok || !data?.success){
      if(r.status===403 && (data?.code==='PASSWORD_SETUP_REQUIRED' || data?.password_setup_required)){
        const setupEmail=(data?.setup_email || (lookup.includes('@')?lookup:'')).trim().toLowerCase();
        if(err) err.textContent='Your account is active. Create your login password to continue.';
        npOpenPasswordSetup(setupEmail,'Your Golden Ticket account exists, but no login password was created. Verify your registered email once and set it now.');
        return;
      }
      throw new Error(data?.error || data?.message || 'Login failed');
    }

    SESSION.trader=data.data;
    SESSION.auth_token=data.data.auth_token;
    SESSION.bootstrap_url=data.data.bootstrap_url;

    try{
      sessionStorage.setItem('np_trader', JSON.stringify({
        trader: SESSION.trader,
        token: SESSION.auth_token,
        url: SESSION.bootstrap_url
      }));
    }catch(_e){}

    SESSION.currentTab=SESSION.trader?.password_reset_required ? 'profile' : 'dashboard';
    npSeedFastDashboard(
      SESSION.trader,
      SESSION.trader?.password_reset_required
        ? 'Temporary password detected. Create your personal password.'
        : 'Login successful. Loading live account data...'
    );
    npEnforceTemporaryPasswordScreen();
    renderApp();

    if(npPasswordResetRequired()){
      setTimeout(()=>toast(
        'Temporary password detected. Please create your personal password now.',
        'info'
      ),250);
    }

    npHydrateDashboardInBackground('Trader login');

  }catch(e){
    console.warn('Trader login failed safely', e);
    if(err){
      if(
        e?.code==='NP_LOGIN_TIMEOUT'
        || e?.name==='AbortError'
        || /signal is aborted|aborted without reason|aborterror|failed to fetch|networkerror|network request failed|load failed|timeout/i.test(String(e?.message||''))
      ){
        err.textContent='Secure connection is temporarily delayed. Please try again.';
      }else if(/invalid login|invalid credentials|incorrect password|wrong password|trader not found/i.test(String(e?.message||''))){
        err.textContent='Email or password is incorrect. Please check and try again.';
      }else{
        err.textContent='We could not sign you in right now. Please try again.';
      }
    }
    if(btn){
      btn.disabled=false;
      btn.textContent='Sign in';
    }
  }
}

function npAdminShellMode(){

    return new URLSearchParams(window.location.search || '').get('admin_shell') === '1';
  }catch(_e){
    return false;
  }
}

function npRenderAdminShell(){
  SESSION.__adminViewStarting = true;
  npRenderAdminOpeningScreen({lookup:'Secure trader session'});

  const params = new URLSearchParams(window.location.search || '');
  const handoffId = String(params.get('handoff') || '').trim();
  let opened = false;
  let readyTimer = null;
  let handoffTimer = null;

  const acknowledge = (traderId)=>{
    if(opened) return;
    opened = true;
    if(readyTimer) clearInterval(readyTimer);
    if(handoffTimer) clearInterval(handoffTimer);
    try{
      if(window.opener && window.opener !== window){
        window.opener.postMessage(
          {type:'NAIRAPIPS_ADMIN_VIEW_OPENED',trader_id:traderId},
          window.location.origin
        );
      }
    }catch(_e){}
  };

  const hydrate = (payload)=>{
    if(opened || !payload || payload.type!=='NAIRAPIPS_ADMIN_VIEW_BOOTSTRAP') return false;
    const traderId=String(payload.traderId||payload.trader_id||'').trim();
    const token=String(payload.token||payload.auth_token||'').trim();
    const lookup=String(payload.lookup||traderId||'Trader').trim();
    const bootstrap=payload.bootstrap;
    if(!traderId || !token || !bootstrap) return false;

    try{
      const handoff={traderId,trader_id:traderId,token,auth_token:token,lookup,bootstrap};
      window.name='NAIRAPIPS_ADMIN_VIEW:'+
        btoa(unescape(encodeURIComponent(JSON.stringify(handoff))));
    }catch(_e){}

    SESSION.__adminViewStarting=true;
    SESSION.trader={id:traderId,name:lookup,full_name:lookup,email:lookup};
    SESSION.auth_token=token;
    SESSION.adminView=true;

    if(!npHydrateAdminBootstrapPayload(bootstrap,traderId,token)){
      return false;
    }

    SESSION.__adminViewStarting=false;
    try{ window.history.replaceState({},document.title,window.location.pathname); }catch(_e){}
    renderApp();
    acknowledge(traderId);
    return true;
  };

  // Primary path: same-origin localStorage handoff. Poll because Admin may still
  // be waiting for Render to mint the secure trader token.
  if(handoffId){
    const key='np_admin_view_handoff_'+handoffId;
    const tryStored=()=>{
      try{
        const raw=localStorage.getItem(key);
        if(!raw) return false;
        const payload=JSON.parse(raw);
        if(payload?.expiresAt && Number(payload.expiresAt)<Date.now()){
          localStorage.removeItem(key);
          return false;
        }
        if(hydrate(payload)){
          localStorage.removeItem(key);
          return true;
        }
      }catch(e){
        console.warn('Admin View stored handoff read failed',e);
      }
      return false;
    };
    if(!tryStored()){
      handoffTimer=setInterval(()=>{
        if(tryStored()) clearInterval(handoffTimer);
      },200);
      setTimeout(()=>{ if(handoffTimer) clearInterval(handoffTimer); },30000);
    }
  }

  // Secondary path: keep announcing readiness until Admin completes token work.
  const announceReady=()=>{
    if(opened) return;
    try{
      if(window.opener && window.opener !== window){
        window.opener.postMessage(
          {type:'NAIRAPIPS_ADMIN_VIEW_READY',handoff_id:handoffId},
          window.location.origin
        );
      }
    }catch(_e){}
  };
  announceReady();
  readyTimer=setInterval(announceReady,500);
  setTimeout(()=>{ if(readyTimer) clearInterval(readyTimer); },30000);

  // Expose a one-shot hydrator for the postMessage handler below.
  window.__npHydrateAdminShellPayload = hydrate;
  npAdminShellTimeoutGuard();
  return true;
}

window.addEventListener('message',(event)=>{
  if(event.origin !== window.location.origin) return;
  const payload = event.data || {};

  if(payload.type === 'NAIRAPIPS_ADMIN_VIEW_ERROR'){
    SESSION.__adminViewStarting = false;
    showAdminViewError(new Error(payload.message || 'Admin View failed'));
    return;
  }

  if(payload.type !== 'NAIRAPIPS_ADMIN_VIEW_BOOTSTRAP') return;

  if(npAdminShellMode() && typeof window.__npHydrateAdminShellPayload==='function'){
    try{
      if(window.__npHydrateAdminShellPayload(payload)) return;
    }catch(error){
      console.error('Admin View durable handoff failed',error);
    }
  }

  try{
    const traderId = String(payload.traderId || payload.trader_id || '').trim();
    const token = String(payload.token || payload.auth_token || '').trim();
    const lookup = String(payload.lookup || traderId || 'Trader').trim();
    const bootstrap = payload.bootstrap;

    if(!traderId || !token || !bootstrap){
      throw new Error('Incomplete secure Admin View handoff');
    }

    // Persist a reload-safe, same-tab Admin View authority before first paint.
    // This is independent of the opener window and survives a browser reload.
    try{
      const handoff = {traderId, trader_id:traderId, token, auth_token:token, lookup, bootstrap};
      const encoded = btoa(unescape(encodeURIComponent(JSON.stringify(handoff))));
      window.name = 'NAIRAPIPS_ADMIN_VIEW:' + encoded;
    }catch(storageError){
      console.warn('Admin View window.name persistence failed', storageError);
    }

    SESSION.__adminViewStarting = true;
    SESSION.trader = {
      id:traderId,
      name:lookup,
      full_name:lookup,
      email:lookup
    };
    SESSION.auth_token = token;
    SESSION.adminView = true;

    if(!npHydrateAdminBootstrapPayload(bootstrap,traderId,token)){
      throw new Error('Trader bootstrap payload could not be hydrated');
    }

    SESSION.__adminViewStarting = false;
    try{
      window.history.replaceState({}, document.title, window.location.pathname);
    }catch(_e){}
    renderApp();

    try{
      event.source?.postMessage(
        {type:'NAIRAPIPS_ADMIN_VIEW_OPENED',trader_id:traderId},
        event.origin
      );
    }catch(_e){}
  }catch(error){
    console.error('Admin View postMessage handoff failed',error);
    SESSION.__adminViewStarting = false;
    showAdminViewError(error);
  }
});


function npAdminShellTimeoutGuard(){
  if(!npAdminShellMode()) return;
  setTimeout(()=>{
    if(SESSION.__adminViewStarting){
      showAdminViewError(new Error('Admin View handoff timed out. Return to Admin and click View Dashboard again.'));
    }
  },32000);
}

function npAdminViewParamsFromUrl(){
  let urlData = null;

  try{
    const params = new URLSearchParams(window.location.search || '');
    const adminView = params.get('admin_view') || params.get('ladmin_view');
    const traderId = (params.get('trader_id') || params.get('id') || '').trim();
    const token = (params.get('token') || params.get('auth_token') || '').trim();
    const lookup = (params.get('lookup') || '').trim();

    if((adminView || (traderId && token)) && traderId && token){
      urlData = {traderId, token, lookup};
    }
  }catch(e){
    console.warn('Admin View URL parsing failed', e);
  }

  // Reliable second channel from the Admin window. This protects Admin View
  // when a browser, extension or hosting layer truncates/re-writes a long query.
  try{
    const prefix = 'NAIRAPIPS_ADMIN_VIEW:';
    if(String(window.name || '').startsWith(prefix)){
      const encoded = String(window.name).slice(prefix.length);
      const json = decodeURIComponent(escape(atob(encoded)));
      const handoff = JSON.parse(json);

      const traderId = String(handoff.traderId || handoff.trader_id || '').trim();
      const token = String(handoff.token || handoff.auth_token || '').trim();
      const lookup = String(handoff.lookup || '').trim();
      const bootstrap = handoff.bootstrap && typeof handoff.bootstrap === 'object'
        ? handoff.bootstrap
        : null;

      if(traderId && token){
        // Keep the secure same-tab handoff in window.name.
        // window.name survives browser reloads, allowing Admin View to restore
        // the exact trader without exposing the token in the address bar.
        return {traderId, token, lookup, bootstrap};
      }
    }
  }catch(e){
    console.warn('Admin View handoff parsing failed', e);
  }

  return urlData;
}

function npHydrateAdminBootstrapPayload(payload, traderId, token){
  const data = payload && payload.data ? payload.data : payload;
  if(!data || typeof data !== 'object' || !data.trader) return false;

  SESSION.data = data;
  SESSION.trader = data.trader;
  SESSION.auth_token = token;
  SESSION.adminView = true;
  SESSION.bootstrap_url = '/trader_bootstrap?trader_id=' + encodeURIComponent(traderId)
    + '&token=' + encodeURIComponent(token || '')
    + '&auth_token=' + encodeURIComponent(token || '')
    + '&admin_view=1';
  SESSION.currentTab = 'dashboard';
  SESSION.lifecycleAccountId = data.trader?.current_account_id || data.current_account?.id || null;
  SESSION.adminFocusAccountId = String(data._admin_focus_account_id||'').trim();
  SESSION.selectedAccountId = SESSION.adminFocusAccountId || SESSION.lifecycleAccountId || SESSION.trader?.id;
  SESSION.userSelectedAccountId = !!SESSION.adminFocusAccountId;

  const pendingReplacements = Array.isArray(data.pending_replacements) ? data.pending_replacements : [];
  SESSION.allAccounts = npMergeAccountRows(
    data.all_accounts || [],
    data.accounts || [],
    data.active_accounts || [],
    data.current_account ? [data.current_account] : [],
    pendingReplacements
  );
  SESSION.accounts = SESSION.allAccounts;
  SESSION.previousResetActions = Array.isArray(data.previous_reset_actions)
    ? data.previous_reset_actions.filter(Boolean)
    : (SESSION.previousResetActions||[]);
  SESSION.previousResetRelease = data.previous_reset_release || SESSION.previousResetRelease || '';
  npApplyAccountDisplaySafety();
  npEnforceFundedAuthorityLockV142();
  npFinalFundedWaitingCleanupV141();
  if(SESSION.adminFocusAccountId){
    const focused=SESSION.allAccounts.find(a=>String(a.id||'')===SESSION.adminFocusAccountId);
    if(focused){
      SESSION.selectedAccountId=SESSION.adminFocusAccountId;
      SESSION.userSelectedAccountId=true;
      SESSION.data.current_account=focused;
    }
  }
  SESSION.trades = Array.isArray(data.latest_trades) ? data.latest_trades : [];
  SESSION.snapshots = data.latest_monitoring ? [data.latest_monitoring] : [];
  SESSION.offers = Array.isArray(data.offers) ? data.offers : [];
  SESSION.announcements = Array.isArray(data.announcements) ? data.announcements : [];
  SESSION.purchases = Array.isArray(data.purchases) ? data.purchases : [];
  SESSION.payouts = Array.isArray(data.payouts) ? data.payouts : [];
  SESSION.tickets = Array.isArray(data.tickets) ? data.tickets : [];
  SESSION.plansList = [];
  SESSION.paymentAccounts = [];
  SESSION.fastBootNote = '';

  try{
    sessionStorage.setItem('np_trader',JSON.stringify({
      trader:SESSION.trader,
      token:SESSION.auth_token,
      url:SESSION.bootstrap_url,
      admin_view:true
    }));
  }catch(_e){}

  scheduleDeferredTraderData(SESSION.trader.id, SESSION.trader);
  return true;
}

function npStartAdminViewFromUrl(){

  };

      token:p.token,
      auth_token:p.token,

      bootstrap:p.bootstrap||null
    };

      btoa(unescape(encodeURIComponent(JSON.stringify(handoff))));
  }catch(_e){}

  SESSION.bootstrap_url = '/trader_bootstrap?trader_id=' + encodeURIComponent(p.traderId)
    + '&token=' + encodeURIComponent(p.token)
    + '&auth_token=' + encodeURIComponent(p.token)
    + '&admin_view=1';

      token:SESSION.auth_token,
      url:SESSION.bootstrap_url,
      admin_view:true
    }));

  npRenderAdminOpeningScreen(p);


  // Preferred path: Admin already authorised and warmed the protected bootstrap.
  // Render it immediately; do not request the same cold feeds again before first paint.
  if(p.bootstrap && npHydrateAdminBootstrapPayload(p.bootstrap, p.traderId, p.token)){
    SESSION.__adminViewStarting = false;
    renderApp();

    // Refresh quietly in the background. A temporary failure must not close
    // an already-authorised and already-rendered dashboard.
    setTimeout(()=>{
      loadAll().then(()=>{
        SESSION.fastBootNote = '';
        renderApp();
      }).catch(e=>{
        console.warn('Admin View background refresh deferred', e?.message||e);
      });
    }, 1200);
    return true;
  }

  // Compatibility path for old Admin links without a bootstrap handoff.
  // Never fail the page after a single pair of requests.
  (async()=>{
    const delays = [0, 1200, 2500, 4500, 7000];
    const errors = [];
    for(let attempt=0; attempt<delays.length; attempt++){
      if(delays[attempt]) await new Promise(r=>setTimeout(r,delays[attempt]));
      const results = await Promise.allSettled([
        loadAdminViewFallback(p.traderId,p.token),
        loadAll()
      ]);
      if(results.some(r=>r.status==='fulfilled')){
        SESSION.__adminViewStarting = false;
        SESSION.fastBootNote = '';
        renderApp();
        return;
      }
      results.forEach(r=>{
        if(r.status==='rejected') errors.push(r.reason?.message || String(r.reason||'Feed failed'));
      });
    }
    SESSION.__adminViewStarting = false;
    showAdminViewError(new Error([...new Set(errors)].slice(-4).join(' | ') || 'Authorised trader data could not be loaded'));
  })();

  return true;
}
