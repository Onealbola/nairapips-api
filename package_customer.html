<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NairaPips · Build your package</title><style>
*{box-sizing:border-box}body{margin:0;background:#080a0b;color:#f4f5f6;font:16px system-ui,sans-serif}main{max-width:1120px;margin:auto;padding:24px}h1{margin:0 0 8px}h2{font-size:21px}p{color:#bdc5cc;line-height:1.5}button,input,select{font:inherit}button{background:#f8d24c;color:#141414;border:0;border-radius:8px;padding:12px 18px;cursor:pointer}button:disabled{opacity:.45;cursor:default}button.secondary{background:#252c31;color:#fff}input,select{display:block;width:100%;background:#080a0b;color:#fff;border:1px solid #46505a;border-radius:7px;padding:11px;margin-top:6px;min-width:0}input[type=checkbox]{display:inline;width:auto}label{font-size:14px;color:#cbd4dc}.card{border:1px solid #313a40;border-radius:14px;background:#111619;padding:20px;margin:18px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.notice{border-left:4px solid #f8d24c;padding:12px;background:#282515;color:#f9e8a3}.error{color:#ffa6a6}#message{min-height:28px;overflow-wrap:anywhere}small{color:#aab5bf}.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.metric{background:#080b0e;padding:16px;border-radius:9px;overflow-wrap:anywhere}.metric strong{display:block;font-size:22px;color:#f8d24c}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:10px;border-bottom:1px solid #313a40}pre{white-space:pre-wrap;overflow-wrap:anywhere}#history-wrap{overflow:auto;max-height:360px}.choice{border:1px solid #313a40;padding:12px;border-radius:9px}.choice .row{justify-content:space-between}#work[hidden],#login[hidden]{display:none}@media(max-width:650px){main{padding:14px}.grid,.metrics{grid-template-columns:1fr}.card{padding:14px}button{max-width:100%}}

body{background:radial-gradient(ellipse at top right,#26200f 0,transparent 48%),#080a08;color:#f3f0e5}main{max-width:1240px}.eyebrow{color:#e0be50;font-size:12px;letter-spacing:.15em;text-transform:uppercase}.builder-layout{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(330px,1fr);gap:22px;align-items:start}.card{background:#10130f;border-color:#403b24;border-radius:20px;padding:24px}.choice{background:transparent;border:0;padding:0}.choice>label{font-weight:600;color:#f0eddf}.choice select{border-color:#57502b;padding:14px;border-radius:11px}.choice details{font-size:12px;margin-top:8px;color:#b3b6a4}.choice details summary{cursor:pointer}.choice details label{display:block;margin-top:8px}.choice details input{padding:8px}.summary-card{position:sticky;top:20px}.price-label{font-size:12px;letter-spacing:.15em;color:#f6d24e;text-transform:uppercase}.price{font-size:clamp(34px,4vw,48px);font-weight:800;letter-spacing:-.04em;color:#f5d54f;margin:8px 0}.price-note{font-size:13px;color:#aeb5a4;min-height:20px}.summary-list{margin:20px 0}.summary-line{display:flex;justify-content:space-between;gap:20px;padding:13px 0;border-bottom:1px solid #303626;font-size:14px}.summary-line dt{color:#bbc3ae}.summary-line dd{margin:0;text-align:right;font-weight:650;overflow-wrap:anywhere}.summary-card button{width:100%;margin-top:18px}.presets button{padding:10px 13px;background:#191d13;border:1px solid #5c5228;color:#f4d65c;font-size:14px}.builder-note{border:1px solid #5c5228;background:#242214;padding:14px;border-radius:12px;font-size:14px;color:#e9e3c8}.owner-pricing{margin-top:24px;border-top:1px solid #333b2d;padding-top:18px}.owner-pricing summary{cursor:pointer;color:#bfc8b1}.owner-pricing label{display:block;margin-top:14px}.notice{font-size:13px;border-radius:8px;margin-bottom:22px}.benefit-tag{color:#9aa98a;font-size:12px;display:block;margin-top:6px}.price-card-updated{animation:pricePulse .45s ease-out}@keyframes pricePulse{from{color:#fff6c5}to{color:#f5d54f}}@media(prefers-reduced-motion:reduce){.price-card-updated{animation:none}}@media(max-width:850px){.builder-layout{grid-template-columns:1fr}.summary-card{position:static}}@media(max-width:650px){.card{padding:18px}.summary-line{gap:12px}.presets button{flex:1 1 auto}}

body:not(.show-owner) .choice details,body:not(.show-owner) .owner-pricing{display:none}.owner-toggle{display:flex;align-items:center;gap:8px}.owner-toggle input{margin:0}.mobile-summary{display:none}@media(max-width:850px){main{padding-bottom:110px}.mobile-summary{display:flex;position:fixed;z-index:10;bottom:12px;left:14px;right:14px;align-items:center;justify-content:space-between;gap:12px;background:#1b2015;border:1px solid #74652c;box-shadow:0 8px 30px #0009;border-radius:14px;padding:12px 16px}.mobile-summary small{display:block}.mobile-summary strong{color:#f5d54f;font-size:22px}.mobile-summary button{padding:10px 14px}}
</style></head><body><main><h1>NairaPips</h1><p>Build a package around your trading goals.</p><section class="card" id="signin"><h2>Trader sign-in</h2><form id="login"><label>Email or phone<input id="lookup" autocomplete="username" required></label><label>Password<input id="password" type="password" autocomplete="current-password" required></label><button>Sign in</button></form></section><div id="customer" hidden><button id="logout" class="secondary">Sign out</button><div id="content"></div></div><p id="message" role="status"></p></main><script>
'use strict';
const API='',SESSION={currentTab:'packages',trader:null,auth_token:'',paymentAccounts:[]};
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function renderApp(){document.getElementById('content').innerHTML=npRenderPackageBuilderV222();}
document.getElementById('login').onsubmit=async event=>{event.preventDefault();const button=event.submitter;button.disabled=true;document.getElementById('message').textContent='Signing in…';try{const r=await fetch('/login_trader',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({lookup:document.getElementById('lookup').value.trim(),password:document.getElementById('password').value})});const d=await r.json(),trader=d.data;if(!r.ok||d.success===false||!trader?.id||!trader.auth_token)throw Error(d.error||'Sign-in could not be confirmed');SESSION.trader={id:trader.id};SESSION.auth_token=trader.auth_token;document.getElementById('signin').hidden=true;document.getElementById('customer').hidden=false;document.getElementById('message').textContent='';await npPackageMaybeLoadV222(true);try{const accounts=await fetch('/payment_accounts').then(r=>{if(!r.ok)throw Error();return r.json();});SESSION.paymentAccounts=Array.isArray(accounts)?accounts:[];renderApp();}catch(_){document.getElementById('message').textContent='Payment details could not be loaded. Reload before making a transfer.';}}catch(e){document.getElementById('message').textContent=e.message;}finally{document.getElementById('password').value='';button.disabled=false;}};
document.getElementById('logout').onclick=()=>{SESSION.auth_token='';SESSION.trader=null;location.reload();};
</script><script src="/package-trader.js"></script></body></html>
